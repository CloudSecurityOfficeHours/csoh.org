<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="index, follow">
    <meta name="description"
        content="Countdown to the next Cloud Security Office Hours session, Fridays at 10:00 US Eastern, shown in UTC, Eastern and your local time.">
    <meta name="author" content="Shawn Nunley">
    <title>Cloud Security Office Hours Countdown - CSOH</title>

    <link rel="canonical" href="https://csoh.org/countdown.html">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#0f1419">
    <meta name="color-scheme" content="dark">

    <meta property="og:title" content="Cloud Security Office Hours Countdown">
    <meta property="og:description"
        content="Countdown to the next Cloud Security Office Hours session, Fridays at 10:00 US Eastern.">
    <meta property="og:site_name" content="Cloud Security Office Hours">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://csoh.org/countdown.html">
    <meta property="og:image" content="https://csoh.org/banner.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cloud Security Office Hours Countdown">
    <meta name="twitter:description"
        content="Countdown to the next Cloud Security Office Hours session, Fridays at 10:00 US Eastern.">
    <meta name="twitter:image" content="https://csoh.org/banner.png">

    <link rel="preload" href="/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/countdown.css?v=2c8905c6" integrity="sha384-J2jcJYooTT/efosuiMgaapV1FJvvPjFQWWX1HlsVtkPCyvfcEbPAjRiHTR7FrZlJ">
    <script defer src="/countdown.js?v=c80d91a5" integrity="sha384-zoDeXemZI5/Od33U9R0b4x4hIh4chDJTLGkcNXNlAdJf/VTzsfYL2GLZVtHjvHcg"></script>
</head>

<body>
    <main class="stage" id="stage">
        <div>
            <p class="eyebrow">Every Friday</p>
            <h1>Cloud Security Office Hours</h1>
        </div>
        <div class="clock">
            <div class="flip" id="flip" role="timer" aria-label="Countdown to the next session">
                <div class="pair">
                    <div class="tiles"><div class="tile"></div><div class="tile"></div></div>
                    <div class="unit" id="unitA">days</div>
                </div>
                <div class="colon" aria-hidden="true"><i></i><i></i></div>
                <div class="pair">
                    <div class="tiles"><div class="tile"></div><div class="tile"></div></div>
                    <div class="unit" id="unitB">hours</div>
                </div>
                <div class="colon" aria-hidden="true"><i></i><i></i></div>
                <div class="pair">
                    <div class="tiles"><div class="tile"></div><div class="tile"></div></div>
                    <div class="unit" id="unitC">minutes</div>
                </div>
            </div>
        </div>
        <div class="when">
            <div class="lead"><strong id="leadNow" hidden>Happening now,</strong> until</div>
            <dl class="times">
                <dt>UTC</dt><dd id="tUtc"></dd><dd class="off">UTC+00:00</dd>
                <dt>America/New_York</dt><dd id="tEt"></dd><dd class="off" id="oEt"></dd>
                <dt class="local" id="lLocal">Local</dt><dd class="local" id="tLocal"></dd><dd class="off local" id="oLocal"></dd>
            </dl>
        </div>
        <noscript><p class="nojs">The countdown needs JavaScript. Sessions are Fridays at 10:00 US Eastern.</p></noscript>
    </main>
</body>

</html>
