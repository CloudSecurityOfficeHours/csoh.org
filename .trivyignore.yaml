# Trivy vulnerability ignore list.
# Docs: https://trivy.dev/docs/configuration/filtering/#trivyignoreyaml
#
# Entries here are scoped, justified, and TIME-BOXED. Once an entry's
# `expired_at` date passes, Trivy stops honoring it and the deploy fails
# again - forcing a fresh review instead of silently suppressing a real CVE
# forever. Keep this list short; delete entries the moment they are moot.
#
# The list is currently EMPTY, and an empty list is the healthy state: every
# HIGH/CRITICAL finding in the image is either fixed by the Dockerfile's
# `apk upgrade --no-cache` or skipped by the scan's own `--ignore-unfixed`.
# Nothing is being suppressed by hand.
#
# The usual reason for an entry is an Alpine race: secdb names a fixed
# version before that binary reaches the v3.21 mirror, so `apk upgrade` has
# nothing newer to install yet. An expired entry is not a softer ignore, it is
# no ignore at all.
#
# When writing an entry:
#
#   - Re-check the mirror before assuming an entry is still load-bearing.
#     The Alpine race these entries exist for resolves on its own; the entry
#     usually dies of old age rather than needing renewal. Check with:
#       curl -s https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/APKINDEX.tar.gz \
#         | tar -xzO APKINDEX | grep -A1 '^P:<pkg>$'
#
#   - Never let an entry sit past its `expired_at`. Expired means Trivy
#     ignores the ignore, so the entry is either doing nothing (the CVE is
#     gone) or about to fail a deploy (it is not) - and the file still claims
#     it is handled either way. Extend it with a NEW justification and a new
#     date, or delete it.
#
# Format when an entry is needed again (each field is required by the docs
# above; `statement` is what shows up in the scan output):
#
#   vulnerabilities:
#     - id: CVE-YYYY-NNNNN
#       statement: >-
#         Why it is not exploitable HERE, and why it is not yet patchable.
#       expired_at: YYYY-MM-DD

# An explicit empty list, not an absent key. `--ignorefile .trivyignore.yaml`
# in deploy.yml's Trivy step names this file unconditionally, so it has to
# parse; `vulnerabilities:` with nothing under it would be null rather than a
# list. `[]` says "no exceptions" without leaving the deploy dependent on how
# Trivy handles a null.
vulnerabilities: []
