# =============================================================================
# Build once, publish to three clouds (AWS + GCP + Azure)
# -----------------------------------------------------------------------------
# The site is served active/active from three origins behind Cloudflare's Load
# Balancer. This workflow builds the site a single time, then fans out to
# publish the identical content to each origin in parallel:
#
#   build ─┬─► publish-aws    (S3 sync + CloudFront invalidation) ─┐
#          ├─► publish-azure  (Blob $web sync)                     ├─► purge-cloudflare
#          └─► publish-gcp    (build + Trivy scan + Cloud Run)     ┘   (purge + verify SRI
#                                                                       against the live edge)
#
# The final job is not optional bookkeeping: it purges the Cloudflare edge only
# after all three origins are serving the new bytes, then re-derives every
# versioned asset's SHA-384 from what the edge actually hands back and fails the
# deploy if it doesn't match the integrity= the live HTML declares.
#
# Every cloud uses keyless OIDC auth - no long-lived cloud secrets in the repo.
# The one stored credential is CLOUDFLARE_API_TOKEN, scoped to Zone → Cache
# Purge on this zone alone (Cloudflare has no OIDC federation).
# Non-secret resource IDs come from repo Variables (Settings → Variables),
# populated from the matching `terraform output` (see infra/README.md).
#
# All third-party actions below are pinned to full commit SHAs (with the
# human-readable version tag in a trailing comment) so a moved or re-pointed
# tag can't silently change what runs.
# =============================================================================

# A "workflow" is one automated process GitHub runs for you on its own
# servers. This whole file IS one workflow. `name:` is just the label shown in
# the repo's Actions tab so humans can tell workflows apart.
name: Deploy - build once, publish to AWS + GCP + Azure

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Fires on pushes to main that touch published site files, or on manual run.
# -----------------------------------------------------------------------------
# `on:` lists the events that TRIGGER this workflow - i.e. what has to happen
# for GitHub to start running it. There can be several triggers.
on:
  # Trigger 1: a `push` (new commits landing in the repo).
  push:
    # ...but only pushes to the `main` branch. Pushes to other branches are
    # ignored by this workflow.
    branches: [main]
    # ...and even on main, only run if at least one CHANGED file matches a
    # pattern below. No point redeploying the site if a commit only touched,
    # say, the README or Terraform. Patterns use glob syntax: `*` = any chars
    # in one path segment, `**` = any depth of subdirectories.
    #
    # THE RULE: if `tools/stage_site.sh` publishes it, it belongs in this list.
    # Anything published but missing here can be edited, committed, and merged
    # without ever reaching production - it silently waits for the next
    # unrelated push. There is no error and no warning; the push just looks
    # successful. Re-derive the published set any time with:
    #     ./tools/stage_site.sh /tmp/dist && find /tmp/dist -maxdepth 1
    #
    # NOTE ON `**.html` vs `*.html`: GitHub's `*` does NOT match `/`, so
    # `'*.html'` means *root-level HTML only*. This list used to say `'*.html'`,
    # which meant a commit touching only breaches/, meetings/, portfolio/, or
    # homelab/ pages never triggered a deploy. Commit 874a813c ("point retired
    # MITRE technique IDs at their current pages") is a real instance: it edited
    # only per-breach pages, so it did not publish. Usually this was masked -
    # add_meeting.py edits root meetings.html alongside the new recap - which is
    # exactly why it went unnoticed. `**.html` matches at any depth.
    paths:
      # --- pages (any depth: root + breaches/ + meetings/ + portfolio/ + homelab/)
      - '**.html'
      # --- shared styles and scripts
      - 'style.css'
      - 'main.js'
      - 'chat-resources.js'
      - 'breach-timeline.css'
      - 'breach-timeline.js'
      - 'meetings.js'
      - 'glossary.js'
      - '404.js'
      - 'search.css'
      - 'search-init.js'
      - 'search-synonyms.json'
      - 'vendor/**'
      # --- feeds, crawler files, and other machine-readable endpoints
      - 'feed.xml'
      - 'recaps.xml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'humans.txt'
      - 'manifest.json'
      - 'csoh.ics'
      - 'security.txt'
      - '.well-known/**'
      - 'preview-mapping.json'
      # --- images and media
      - 'img/**'
      - 'chat-screenshots/**'
      - 'email-screenshots/**'
      # --- the Terraform we publish as teaching material for terraform.html
      - 'infra/**'
      # --- things that change WHAT or HOW we publish
      - 'Dockerfile'
      - 'nginx.conf'
      - 'nginx-security-headers.conf'
      - 'tools/build_search_index.py'
      - 'tools/site-publish.filter'
      - 'tools/stage_site.sh'
      - '.github/workflows/deploy.yml'
      # `meetings-search-index.json` IS a trigger, unlike its sibling below.
      # See the note - it is not rebuilt by this workflow, so a commit really is
      # the only way a change to it reaches production.
      - 'meetings-search-index.json'
    #
    # Deliberately NOT a trigger: `search-index.json`. It is published, but the
    # build job regenerates it from the site content on every run (see
    # `python3 tools/build_search_index.py` below), so a commit is never the
    # reason it needs to ship.
    #
    # `meetings-search-index.json` is DIFFERENT and this list used to get it
    # wrong. It is built by `tools/build_meetings_search_index.py`, which this
    # workflow never runs - only the housekeeping workflow
    # (site-update-deploy.yml) does. So a stale entry in that index sits live
    # until something else happens to ship it. That is not hypothetical: a
    # participant's email address removed from two recap pages stayed readable
    # in the published index afterwards, because fixing the HTML did not
    # rebuild or redeploy the index. It is a trigger path now.
    #
    # Widening this list is always the safe direction - a superfluous pattern
    # costs one extra deploy of identical bytes, while a missing one costs a
    # change that never goes live.
  # Trigger 2: `workflow_dispatch` adds a "Run workflow" button in the Actions
  # tab so a human can deploy on demand (e.g. to redeploy after a config
  # change that didn't touch any of the paths above).
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read the repo, plus mint an OIDC token so all three clouds can log in keyless.
# -----------------------------------------------------------------------------
# `permissions:` sets what the automatic, per-run GITHUB_TOKEN is allowed to do
# against THIS repo. We deliberately keep it minimal (least privilege).
permissions:
  # Read-only access to the repo contents - enough to check out the code.
  contents: read
  # This is the key line for keyless cloud auth. `id-token: write` lets the run
  # mint a short-lived, signed OIDC (OpenID Connect) token that proves "I am
  # this GitHub workflow." Each cloud is configured to trust that token and
  # hand back temporary credentials in exchange - so there are NO long-lived
  # cloud keys stored in the repo. Without this line, all three logins fail.
  id-token: write   # required for OIDC token exchange (all three clouds)

# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# One global lock named "deploy". A newer deploy WAITS for an older one rather
# than killing it, so a publish is never interrupted half-done.
# -----------------------------------------------------------------------------
# `concurrency:` stops overlapping runs from racing each other. Runs that share
# the same `group` name are serialized.
concurrency:
  # A fixed, constant name (not one keyed on `${{ github.ref }}`), so EVERY run
  # of this workflow shares one lock - unlike the per-branch locks the read-only
  # check workflows use. There is only one production site, so we never want two
  # deploys publishing at once regardless of which ref triggered them.
  group: deploy
  # This was `true`, which cancels the in-flight run. That can kill a publish
  # part-way: on 2026-07-15 a push cancelled a run after AWS and Azure had
  # published but before GCP, which - had that commit touched a published file -
  # would have left two origins on new content and one on old, with Cloudflare
  # load-balancing between them. The sharper version: the publish jobs upload
  # assets first and HTML second, so a cancel between those two passes leaves an
  # origin serving the new style.css next to HTML naming the old hash, i.e. the
  # unstyled site again.
  #
  # `false` makes a newer run PEND until the current one finishes, so no job is
  # ever cancelled mid-flight. This does not let stale bytes win: the runs are
  # serialized, so the older one publishes first and the newer one publishes
  # after it - the final state is always the newest commit. Publishing older
  # bytes after newer ones needs two runs publishing AT ONCE, which the lock is
  # what prevents; cancelling was never what protected us there.
  #
  # It also doesn't pile up. GitHub keeps at most one pending run per group and
  # cancels any previously pending one, so a burst of pushes costs one extra
  # deploy, not N - and a pending run has touched nothing, so cancelling it is
  # free. That gives us the "supersede the stale deploy" behaviour we wanted
  # from `true`, without the half-published origin.
  #
  # (A job-level cancel on `build` alone would be dead code: this lock means a
  # second run never starts while the first is running, so two builds cannot
  # overlap in the first place.)
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# A `validate` gate runs first, then `build` stages the site, then three publish
# jobs (`needs: build`) fan out to AWS, Azure, and GCP in parallel.
# -----------------------------------------------------------------------------
# `jobs:` holds the units of work. A "job" runs on its own fresh virtual
# machine ("runner"). By default jobs run in PARALLEL; the `needs:` key (used
# below) is how you force one job to wait for another. Each job is made of
# ordered "steps".
jobs:
  # ---------------------------------------------------------------------------
  # Correctness gate. Nothing publishes unless this passes.
  #
  # WHY THIS EXISTS. validate-html.yml runs the same checks, but it is a
  # SEPARATE workflow triggered by the same push, so it runs *alongside* this
  # one rather than in front of it. GitHub's `needs:` cannot reach across
  # workflows. On 2026-08-10 a commit with unresolved `git stash pop` conflict
  # markers in meetings.html was published to all three origins while
  # validate-html was still running; the JSON-LD gate did fail, ~30 seconds
  # after the broken page was already live. A gate that reports after the fact
  # is a smoke alarm wired to a photo album.
  #
  # Duplicating three fast scripts across two workflows is the deliberate
  # trade. validate-html.yml keeps the fuller treatment (html5validator, PR
  # comments, artifact upload) for pull requests; this job is the narrow,
  # seconds-long "is it safe to publish" check on the push path.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      # The check that would have caught the 2026-08-10 incident directly,
      # rather than as a side effect of markers happening to land inside a
      # JSON-LD block. Conflict markers in plain prose are just as broken and
      # no other gate looks for them.
      #
      # Only `<<<<<<< ` and `>>>>>>> ` are matched. A bare `=======` line is
      # NOT a reliable signal: it is legitimate Markdown heading underline and
      # appears in the comment banners of these very workflow files.
      - name: Reject merge conflict markers
        run: |
          set -uo pipefail
          # `grep -r` exits 1 when it finds nothing, which is the good case, so
          # the exit code is captured rather than allowed to trip errexit.
          hits=$(grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
                   -e '^<<<<<<< ' -e '^>>>>>>> ' . || true)
          if [ -n "$hits" ]; then
            echo "::error::Unresolved merge conflict markers found. Publishing blocked."
            echo "$hits"
            exit 1
          fi
          echo "No conflict markers found."

      - name: Reject inline scripts (CSP gate)
        run: python3 tools/check_no_inline_scripts.py

      - name: Require SVG dimensions (CLS gate)
        run: python3 tools/check_svg_dimensions.py

      - name: Validate JSON-LD (structured-data gate)
        run: python3 tools/check_jsonld.py

  # ---------------------------------------------------------------------------
  # Build the public file set once. tools/build_search_index.py regenerates
  # /search-index.json, then tools/stage_site.sh produces dist/ - the exact
  # set of files that should be public (mirrors nginx.conf blocks + Dockerfile
  # strip list). dist/ is uploaded as an artifact for the object-storage jobs.
  # ---------------------------------------------------------------------------
  # `build` is this job's internal id (referenced later by `needs: build`).
  build:
    # Wait for the correctness gate above. This is the whole point of that job:
    # a failing check must stop the deploy, not merely report on it afterwards.
    # If `validate` fails, `build` never starts, so the three publish jobs and
    # the Cloudflare purge never start either, and the previously-deployed site
    # stays live and intact.
    needs: validate
    # `runs-on:` picks the runner type. `ubuntu-latest` is a GitHub-hosted
    # Linux VM, created clean for this job and thrown away when it finishes.
    runs-on: ubuntu-latest
    # Every job in this workflow carries a `timeout-minutes` cap. This matters
    # more here than in most workflows: the `deploy` concurrency group above
    # uses cancel-in-progress: false, so a wedged job doesn't just waste a
    # runner - it holds the deploy lock and every later deploy queues behind it
    # for the 6-HOUR default timeout. A cap turns that into minutes.
    timeout-minutes: 15
    # The ordered list of things this job does, top to bottom.
    steps:
      # A step is one action. `name:` is just its label in the run logs.
      # Two ways to run a step: `uses:` (run a prebuilt, shareable Action) or
      # `run:` (run shell commands). This step uses `uses:`.
      - name: Checkout
        # `actions/checkout` clones this repo onto the runner. Without it the
        # VM is empty and our scripts/files aren't there. The `@<40-hex>` after
        # the name pins the action to one exact Git commit instead of a movable
        # tag like `v6` - so a compromised or changed upstream tag can't
        # silently alter what runs. The `# v7.0.0` note records which release
        # that commit corresponds to, for human readers.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This step uses `run:` to execute shell. The `|` makes the value a
      # multi-line block: every following indented line is one line of a Bash
      # script run on the runner.
      - name: Build search index
        run: |
          # Make the script fail fast and loudly: -e exit on any error,
          # -u error on use of an unset variable, -o pipefail catch a failure
          # anywhere in a pipeline (not just the last command).
          set -euo pipefail
          # Regenerate the client-side search index file from the site content.
          python3 tools/build_search_index.py
          # Confirm the file was actually produced.
          test -f search-index.json
          # Measure its size in bytes (stat -c%s prints just the byte count).
          size=$(stat -c%s search-index.json)
          # Guard against a silently-broken build: a real index is large, so a
          # tiny file almost certainly means indexing failed. Fail the job.
          if [ "$size" -lt 100000 ]; then
            # `>&2` sends this message to standard error (the error stream).
            echo "search-index.json is suspiciously small ($size bytes)" >&2
            # A non-zero exit code marks the step (and job) as failed.
            exit 1
          fi
          # Log the size in KB for the run output.
          echo "search-index.json built: $((size / 1024)) KB"

      # Re-stamp SRI hashes + ?v= cache-busts before staging, so the HTML we
      # publish always matches the assets we publish alongside it.
      #
      # This used to be left to whoever edited style.css/main.js remembering to
      # run update_sri.py, with site-update-deploy.yml as the safety net. That
      # net cannot catch anything: its fix is committed `[skip ci]`, so it lands
      # in the repo but never reaches production. When an asset edit shipped
      # without re-stamped hashes, this job published the new asset next to HTML
      # still naming the old hash - browsers refuse the file on the SRI mismatch
      # and the site renders unstyled until some unrelated push happens to
      # trigger another deploy. Of the 46 times housekeeping has auto-fixed SRI,
      # 30 followed a push that published mismatched HTML.
      #
      # Doing it here makes the artifact self-consistent by construction, so the
      # failure mode is gone rather than merely detected. dist/ does not exist
      # yet at this point, so the rglob only walks the source tree.
      # site-update-deploy.yml still stamps the repo, which keeps the committed
      # HTML tidy; correctness no longer depends on it.
      #
      # NOTE: this artifact only feeds AWS and Azure. publish-gcp builds its
      # image from a fresh checkout, so it runs its own copy of this step -
      # if you change the logic here, change it there too.
      - name: Re-stamp SRI hashes (belt and braces)
        run: |
          set -euo pipefail
          out=$(python3 update_sri.py)
          echo "$out"
          # "Modified 0 of N files" means the commit already had correct hashes.
          # Anything else means the push would have shipped a broken site, so
          # say so loudly in the log - the deploy is still correct either way.
          if ! echo "$out" | grep -q "Modified 0 of"; then
            echo "::warning::HTML was committed with stale SRI hashes; this build corrected them. Run update_sri.py before pushing asset changes."
          fi

      # Run the staging script, which copies only the public files into a fresh
      # dist/ directory (see tools/stage_site.sh). dist/ is exactly what gets
      # published to the object-storage origins.
      - name: Stage public site into dist/
        run: ./tools/stage_site.sh dist

      # Each job runs on its own throwaway VM, so files don't automatically
      # carry over to other jobs. An "artifact" is a bundle of files this job
      # saves to GitHub so LATER jobs can download it. Here we save dist/ for
      # the AWS and Azure publish jobs to fetch.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # `with:` passes inputs (named settings) to a `uses:` action - like
        # arguments to a function.
        with:
          # The artifact's name; the download steps refer to it by this name.
          name: site-dist
          # Which folder to bundle up.
          path: dist/
          # REQUIRED, and easy to miss. Since v4.4 this action defaults to
          # `include-hidden-files: false` and silently drops every dot-path from
          # the artifact - it prints a count, not an error. That quietly broke
          # /.well-known/security.txt: stage_site.sh staged 2973 files, the
          # artifact carried 2972, and the missing one was the security.txt at
          # the RFC 9116 canonical location. AWS and Azure publish FROM this
          # artifact, so both 404'd on it, while GCP - which builds from a fresh
          # checkout, not the artifact - served it fine. The result was a path
          # that worked on roughly one request in three, which is a far more
          # annoying bug than a clean failure.
          #
          # dist/ contains exactly one hidden path (.well-known/) because
          # tools/site-publish.filter excludes every other dot-path, so turning
          # this on cannot smuggle in .git, .env, or friends. If you ever widen
          # the filter, that reasoning has to be rechecked.
          include-hidden-files: true
          # Auto-delete after 1 day. This artifact is only a hand-off between
          # jobs in the same run, so it doesn't need to linger (and storage
          # isn't free).
          retention-days: 1

  # ---------------------------------------------------------------------------
  # AWS: sync dist/ to the private S3 origin, then invalidate CloudFront.
  # ---------------------------------------------------------------------------
  publish-aws:
    # `needs: build` makes this job WAIT until `build` finishes successfully.
    # That's also how it gets access to the dist/ artifact build uploaded. The
    # three publish jobs all `needs: build` but not each other, so they run in
    # parallel once build is done.
    needs: build
    runs-on: ubuntu-latest
    # See the note on the build job: caps how long a hung sync can hold the
    # deploy lock.
    timeout-minutes: 15
    # `environment:` ties this job to a named GitHub Environment ("production").
    # Environments can carry their own variables/secrets and protection rules
    # (e.g. required approvals). They also scope which OIDC tokens the cloud
    # will trust - the AWS/Azure trust policies require environment=production.
    environment: production
    steps:
      # Pull down the dist/ bundle the build job uploaded, into a local dist
      # folder on this fresh VM.
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: site-dist
          path: dist

      # Exchange the run's OIDC token for temporary AWS credentials (no stored
      # keys). The action calls AWS sts:AssumeRoleWithWebIdentity behind the
      # scenes and exports the resulting short-lived creds for later steps.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          # `${{ ... }}` is GitHub Actions expression syntax - it gets
          # substituted before the step runs. `vars.NAME` reads a repo-level
          # Variable (Settings → Variables), used for NON-secret values like
          # this IAM role's ARN. (Sensitive values would use `secrets.NAME`
          # instead, which GitHub masks in logs - but keyless OIDC means we
          # have no AWS secrets to store here.) The role's trust policy is what
          # decides whether to accept our OIDC token.
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          # AWS region for the API calls below. S3 + CloudFront control-plane
          # operations are handled via us-east-1.
          aws-region: us-east-1

      # Mirror dist/ up to the S3 bucket that backs the AWS origin, ASSETS
      # FIRST, then the HTML that references them.
      #
      # Why two passes: `aws s3 sync` uploads in arbitrary order, so a single
      # pass can land index.html (asking for /style.css?v=NEW) before style.css
      # itself. Any request in that window makes Cloudflare cache the OLD css
      # under the NEW ?v= key - and since we serve assets `immutable,
      # max-age=31536000`, that wrong answer sticks for a year. Browsers then
      # reject the stylesheet on the SRI hash mismatch and the site renders
      # unstyled. That is exactly what happened on 2026-07-15.
      #
      # Uploading every asset before any HTML closes the window: the new
      # ?v= URL cannot be requested until the HTML naming it exists, and by
      # then the asset it points at is already in place.
      - name: Sync assets to S3 (everything except HTML)
        run: |
          # No --delete on this pass: dist/ minus *.html is not the full desired
          # state, so pruning here would delete every live HTML page for the
          # length of the deploy. Pass 2 does the pruning.
          aws s3 sync dist "s3://${{ vars.AWS_BUCKET_NAME }}" \
            --exclude "*.html" --no-progress

      - name: Sync HTML to S3 (and prune deleted files)
        run: |
          # Full sync: uploads the HTML held back above (the asset re-check is a
          # no-op), and --delete removes objects that no longer exist locally so
          # the bucket exactly matches dist/.
          aws s3 sync dist "s3://${{ vars.AWS_BUCKET_NAME }}" \
            --delete --no-progress

      # S3 is the origin, but Cloudflare/CloudFront cache copies at the edge.
      # After uploading new files we must purge the CDN cache or visitors keep
      # getting stale pages.
      - name: Invalidate CloudFront
        run: |
          # Tell the CloudFront distribution to drop its cached copies.
          # `--paths "/*"` invalidates everything (the whole site).
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  # ---------------------------------------------------------------------------
  # Azure: sync dist/ to the Blob static-website $web container. `blob sync`
  # mirrors the directory, including deletions of removed files.
  # ---------------------------------------------------------------------------
  publish-azure:
    needs: build
    runs-on: ubuntu-latest
    # See the note on the build job: caps how long a hung sync can hold the
    # deploy lock.
    timeout-minutes: 15
    environment: production
    steps:
      # Same dist/ bundle, downloaded onto this job's separate VM.
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: site-dist
          path: dist

      # Azure's flavour of keyless OIDC login. Entra ID (Azure's identity
      # system) has a "federated credential" that trusts this workflow's OIDC
      # token and signs us in as the app below - again, no stored secret.
      #
      # This step is attempted TWICE. `az login` occasionally gets a non-JSON
      # response (an empty body, or an HTML error page) from the Entra token
      # endpoint and dies parsing it. The tell is a Python JSONDecodeError -
      # `JSON is invalid: Expecting value: line 1 column 1 (char 0)` - followed
      # by the action's generic fallback, which advises checking `auth-type`.
      # That advice is a DEAD END: auth-type is not the problem, and the log
      # above it will show the OIDC subject claim and client-id resolving
      # correctly. It is an Azure-side blip, and it retries clean. Real
      # instance: run 31347298268 on 2026-08-10.
      #
      # Losing this job is not a no-op. publish-aws and publish-gcp still
      # succeed, so Azure alone falls behind, and Cloudflare load-balances
      # across all three origins - about one request in three then serves the
      # previous deploy. purge-cloudflare `needs:` all three publish jobs, so
      # it skips too and the edge keeps serving stale objects on top of that.
      # Nothing repairs it until the next unrelated push. That is the same
      # partial-origin failure shape as the dotfile-artifact bug in CLAUDE.md,
      # and it is worth one duplicated step to avoid.
      - name: Azure login (OIDC)
        id: azlogin
        # First attempt only. A failure here is swallowed so the retry below
        # can run; if that one also fails, the job fails normally. This must
        # NOT be set on the retry, or a genuine misconfiguration (a rotated
        # client-id, a federated credential whose subject no longer matches)
        # would sail through both attempts and hand an unauthenticated runner
        # to the sync step.
        continue-on-error: true
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          # The app (service principal) identity to sign in as. This one IS a
          # repo Variable because Terraform generates it on apply.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          # Tenant + subscription are fixed accounts (identifiers, not secrets),
          # pinned here and in infra/terraform/azure to match. AZURE_CLIENT_ID
          # stays a repo Variable because it's an output of `terraform apply`.
          tenant-id: 10e6d2fb-a320-46fa-8df1-9aa7a8f6b2dc
          subscription-id: f973ebad-a06c-4d5c-8161-0faf2a13076c

      # Second attempt, and the reason `continue-on-error` above is safe. Runs
      # only when the first one failed - `outcome` is the step's result BEFORE
      # continue-on-error rewrites it, which is why this reads `outcome` and
      # not `conclusion` (`conclusion` is 'success' whenever continue-on-error
      # swallowed a failure, so gating on it would never fire).
      #
      # Keep the inputs and the pinned SHA identical to the step above.
      - name: Azure login (OIDC, retry)
        if: steps.azlogin.outcome == 'failure'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: 10e6d2fb-a320-46fa-8df1-9aa7a8f6b2dc
          subscription-id: f973ebad-a06c-4d5c-8161-0faf2a13076c

      # Upload dist/ to the Azure Storage static-website container.
      - name: Sync to Blob $web
        # The azure/cli action runs commands inside a container that already
        # has the `az` CLI installed, reusing the login from the step above.
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52  # v3.0.0
        with:
          # Which az CLI version the container should use.
          azcliversion: latest
          # `inlineScript` is this action's way of taking shell to run (the
          # action's equivalent of a `run:` block).
          inlineScript: |
            # Mirror the local dist folder into the storage account, ASSETS
            # FIRST then HTML - same ordering rule as the S3 job above, for the
            # same reason (see the long comment there: HTML landing before the
            # asset it names lets Cloudflare cache the old asset under the new
            # ?v= key for a year, and SRI then blocks it).
            #
            # Static websites in Azure are served from a special container
            # literally named `$web`. `--auth-mode login` uses our OIDC sign-in
            # (an account identity) rather than a storage account key.
            #
            # Pass 1 - assets only. `blob sync` deletes destination files that
            # aren't in the source BY DEFAULT, and --exclude-pattern makes the
            # HTML look absent, so this pass MUST pass --delete-destination
            # false or it would wipe every live page. Pruning happens in pass 2.
            az storage blob sync \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --auth-mode login \
              -c '$web' \
              -s dist \
              --exclude-pattern '*.html' \
              --delete-destination false

            # Pass 2 - full sync. Uploads the HTML held back above (assets
            # re-check as no-ops) and prunes files that are gone locally, so the
            # site matches dist/ exactly.
            az storage blob sync \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --auth-mode login \
              -c '$web' \
              -s dist

  # ---------------------------------------------------------------------------
  # GCP: build the nginx container, Trivy-scan it, push to Artifact Registry,
  # and deploy a Cloud Run revision. Cloud Run is now a direct Cloudflare
  # origin (ingress=all, no GCLB / Cloud CDN - so no cache invalidation step).
  # ---------------------------------------------------------------------------
  publish-gcp:
    needs: build
    runs-on: ubuntu-latest
    # Longest cap of the publish jobs: docker build + Trivy DB download + scan
    # + registry push + Cloud Run rollout. See the note on the build job.
    timeout-minutes: 30
    environment: production
    # `env:` here defines environment variables shared by EVERY step in this
    # job. They name the GCP project, region, and resource names once, so the
    # steps below can reference them (via `${{ env.NAME }}` in expressions or
    # `$NAME` in shell) instead of repeating literals.
    env:
      PROJECT_ID: csoh-org-495800
      REGION: us-central1
      SERVICE: csoh-site
      REPO: csoh-containers
      IMAGE_NAME: csoh-site
    steps:
      # Unlike the object-storage jobs, GCP rebuilds the site INTO a container
      # image, so it needs the source code - hence checkout (not just the
      # dist/ artifact).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # GCP's keyless login: Workload Identity Federation (WIF). The provider
      # below is configured to trust this workflow's OIDC token and then act as
      # the named service account - no service-account key file involved.
      #
      # Attempted twice, for the same reason as the Azure login in
      # publish-azure: a transient token-exchange failure here fails the job,
      # which leaves GCP behind the other two origins while Cloudflare keeps
      # load-balancing across all three, and skips purge-cloudflare on top of
      # that. See the long note on that step for the full blast radius.
      #
      # Note the asymmetry with publish-aws, which deliberately has NO such
      # retry: aws-actions/configure-aws-credentials already retries the STS
      # assume-role call 12 times with exponential backoff by default
      # (`retry-max-attempts` defaults to 12, `disable-retry` to false), so
      # wrapping it would just add a 13th attempt. google-github-actions/auth
      # has no equivalent - it exposes no retry input and does not back off -
      # so the retry has to be built here. If you ever set `disable-retry: true`
      # on the AWS step, it needs this treatment too.
      - name: Authenticate to GCP via WIF
        id: gcpauth
        # First attempt only - never set this on the retry below, or a real
        # misconfiguration (a WIF provider whose attribute-condition no longer
        # matches, a service account that lost roles/iam.workloadIdentityUser)
        # would pass through both attempts and leave the gcloud steps below
        # running unauthenticated.
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          # The full resource path of the WIF provider that vets our OIDC token.
          workload_identity_provider: projects/23727240440/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          # The GCP service account this job impersonates (its deploy identity).
          service_account: csoh-deployer@csoh-org-495800.iam.gserviceaccount.com

      # Second attempt. Gated on `outcome`, not `conclusion` - continue-on-error
      # rewrites `conclusion` to 'success' on a swallowed failure, so a
      # conclusion-based gate would never fire and this would be dead code that
      # still reads correctly. Keep the inputs and pinned SHA identical above.
      - name: Authenticate to GCP via WIF (retry)
        if: steps.gcpauth.outcome == 'failure'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: projects/23727240440/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: csoh-deployer@csoh-org-495800.iam.gserviceaccount.com

      # Install and configure the `gcloud` CLI on the runner, reusing the WIF
      # credentials from the previous step.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      # Teach Docker how to authenticate to Artifact Registry (GCP's container
      # registry) so the later push is allowed. The registry host is
      # region-specific, hence `${{ env.REGION }}`.
      - name: Configure docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build the full image reference (registry path + tag) and publish it as
      # this step's output so later steps can reuse the exact same value.
      - name: Compute image tag
        # `id:` gives the step a handle. Other steps read its outputs via
        # `steps.tag.outputs.<name>` (see the build/scan/push/deploy steps).
        id: tag
        run: |
          # `$GITHUB_SHA` is the commit being built; `::12` is Bash substring
          # syntax taking the first 12 chars - a short, unique-enough tag.
          SHA="${GITHUB_SHA::12}"
          # Assemble the Artifact Registry path: HOST/PROJECT/REPO/IMAGE.
          REF="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}"
          # Writing `name=value` to the special `$GITHUB_OUTPUT` file is how a
          # step exports an output. This sets output `image` to the full
          # `path:shortsha`, consumed below as steps.tag.outputs.image.
          echo "image=${REF}:${SHA}" >> "$GITHUB_OUTPUT"

      # Ask Artifact Registry whether this exact tag already exists, BEFORE
      # deciding whether to build. This one question reorders the whole job, and
      # it exists to close a real gap:
      #
      # This job used to build unconditionally, Trivy-scan what it had just
      # built, then skip the push when the tag was already present and deploy
      # the REGISTRY copy. That means it scanned one set of bytes and shipped a
      # different set. The Dockerfile runs `apk upgrade --no-cache`, so a
      # rebuild days later genuinely differs from the stored image - the scan
      # would pass on freshly-patched packages while the older image actually
      # being deployed carried the CVEs.
      #
      # It was a narrow window when the only way a tag pre-existed was a
      # workflow rerun minutes later. The QA promotion path widens it to however
      # long a change sits in QA before being promoted, because deploy-qa.yml
      # pushes the image and this job then reuses it. So: find out first, then
      # either build (new commit) or pull (promotion), and scan whichever one is
      # actually going to be deployed.
      #
      # `describe` exits non-zero when the tag is absent, which is the normal
      # case, so the failure is captured rather than allowed to trip errexit.
      - name: Check whether this image is already in Artifact Registry
        id: registry
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "${{ steps.tag.outputs.image }}" --quiet >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already in Artifact Registry - this is a promotion or a rerun."
            echo "Will PULL and scan the stored image rather than rebuilding, so the"
            echo "bytes scanned are the bytes deployed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image not in Artifact Registry - building it."
          fi

      # Same index the object-storage origins serve, baked into the image via
      # the Dockerfile's `COPY . /usr/share/nginx/html/`.
      # (Rebuilt here because this job has the source, not the dist/ artifact;
      # same fail-fast + size sanity guard as the build job.)
      #
      # Skipped on a promotion: the stored image was built from this very commit
      # and already contains an index generated the same way, so rebuilding it
      # would be wasted work that cannot change what gets deployed.
      - name: Build search index
        if: steps.registry.outputs.exists == 'false'
        run: |
          set -euo pipefail
          python3 tools/build_search_index.py
          test -f search-index.json
          size=$(stat -c%s search-index.json)
          if [ "$size" -lt 100000 ]; then
            echo "search-index.json is suspiciously small ($size bytes)" >&2
            exit 1
          fi

      # Same belt-and-braces re-stamp as the build job, and for the same
      # reason the search index is rebuilt above: this job bakes its image from
      # the RAW CHECKOUT (`COPY . /usr/share/nginx/html/`), not from the
      # corrected dist/ artifact. Without this step, a commit carrying stale
      # SRI hashes would ship corrected HTML on AWS and Azure but stale-hash
      # HTML here - browsers reject the assets on the mismatch, and the site
      # renders unstyled on roughly one request in three, the most annoying
      # failure shape this repo knows. The SRI verify in purge-cloudflare
      # fetches the homepage once, so it only has a ~1-in-3 chance of landing
      # on this origin and catching it; prevention has to happen per-origin.
      #
      # Skipped on a promotion, for the same reason as the search index above:
      # deploy-qa.yml ran this identical step before pushing the image, so the
      # stored bytes already carry corrected hashes.
      - name: Re-stamp SRI hashes (belt and braces)
        if: steps.registry.outputs.exists == 'false'
        run: |
          set -euo pipefail
          out=$(python3 update_sri.py)
          echo "$out"
          # "Modified 0 of N files" means the commit already had correct
          # hashes. Anything else means the push would have shipped a broken
          # origin, so say so loudly - the image is still correct either way.
          if ! echo "$out" | grep -q "Modified 0 of"; then
            echo "::warning::HTML was committed with stale SRI hashes; this build corrected them for the GCP image. Run update_sri.py before pushing asset changes."
          fi

      # Build the Docker image locally on the runner from the repo's Dockerfile.
      # `docker build` reads the Dockerfile in the build context (the trailing
      # `.` = current directory) and produces an image. `--tag` names it with
      # the exact reference computed earlier. The three `--label` flags stamp
      # standard OpenContainers (OCI) metadata onto the image so anyone
      # inspecting it can trace it back to its source/commit/build-time;
      # `github.repository` and `github.sha` come from the `github` context
      # (built-in info about the run: owner/repo and the commit SHA), and the
      # created timestamp is computed at run time by `date` in UTC ISO-8601.
      # (Comments are kept ABOVE the command: a `#` line between two
      # backslash-continued shell lines would break the command.)
      - name: Build container image
        if: steps.registry.outputs.exists == 'false'
        run: |
          docker build \
            --tag "${{ steps.tag.outputs.image }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      # The promotion branch of the fork above. Pull the stored image so the
      # Trivy step below has something local to scan - and, crucially, so what
      # it scans is the same image the deploy step will roll out. Without this
      # the scan would either have nothing to look at or would be looking at a
      # rebuild that is never shipped.
      #
      # Note this is what makes a promotion catch NEWLY DISCLOSED CVEs. The
      # image was scanned clean when deploy-qa.yml pushed it, but Trivy's
      # database moves; re-scanning the identical bytes at promotion time is the
      # check that a vulnerability published in between still blocks the deploy.
      - name: Pull the image being promoted
        if: steps.registry.outputs.exists == 'true'
        run: docker pull "${{ steps.tag.outputs.image }}"

      # Install Trivy, an open-source vulnerability scanner, so we can check the
      # image for known security flaws BEFORE it ever reaches the registry.
      - name: Install Trivy
        run: |
          set -euo pipefail
          # Pin the exact version we want...
          TRIVY_VERSION="0.70.0"
          # ...and its expected SHA-256 checksum, so we can verify the download
          # wasn't tampered with or corrupted.
          TRIVY_SHA256="8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
          # Download the release tarball. curl flags: -f fail on HTTP errors,
          # -s silent, -S still show errors, -L follow redirects.
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # Verify the download matches the pinned checksum; `sha256sum -c -`
          # exits non-zero (failing the step) if it doesn't.
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          # Extract just the `trivy` binary into a directory on the PATH.
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          # Clean up the tarball and confirm the binary runs.
          rm /tmp/trivy.tar.gz
          trivy --version

      # Scan the freshly built image and BLOCK the deploy if serious, fixable
      # vulnerabilities are found. Flags below (kept above the command so a
      # comment never lands between backslash-continued lines):
      #   --exit-code 1   fail the job if anything matches
      #   --ignore-unfixed   skip vulns with no fix available (we can't act on
      #                      them, so they shouldn't block shipping)
      #   --severity HIGH,CRITICAL   only the two most serious levels
      #   --format table / --no-progress   readable output, no spinner in logs
      #   --ignorefile .trivyignore.yaml   honor our scoped, TIME-BOXED CVE
      #                      ignore list (see that file for each entry's
      #                      justification + expiry). Without it, a non-
      #                      exploitable, not-yet-patchable CVE in a transitive
      #                      OS package would block every deploy.
      # The final argument is the exact image we just built.
      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format table \
            --no-progress \
            --ignorefile .trivyignore.yaml \
            "${{ steps.tag.outputs.image }}"

      # Artifact Registry has immutable_tags=true, so re-pushing an existing tag
      # fails outright. The check at the top of this job decides whether we
      # built or pulled; this step re-asks the same question immediately before
      # pushing, because the answer can CHANGE while the job runs.
      #
      # That is not hypothetical. deploy-qa.yml builds the same commit into the
      # same tag in the same repository, so when a commit reaches `main` and
      # `qa` at once, both workflows race. On 2026-08-16 the production run
      # checked the registry (empty), spent two minutes building and scanning,
      # and by the time it pushed, the QA run had published the tag - so the
      # push was rejected, `Deploy to Cloud Run` was skipped, and GCP was left a
      # commit behind AWS and Azure with `purge-cloudflare` skipped on top. That
      # is the split-origin state this repo has hit before: roughly one request
      # in three serving stale content, from a workflow that looked like it had
      # simply failed.
      #
      # Re-checking here closes it. Finding the tag present is a SUCCESS, not an
      # error: the bytes are already where they need to be, and the run that put
      # them there ran the same Trivy gate before pushing.
      #
      # Note the deliberate asymmetry with the build/pull fork above, which
      # still keys off the ORIGINAL check. Re-deciding that here would mean
      # scanning one image and deploying another, which is the exact gap this
      # job was restructured to close. The narrow trade is that in a lost race
      # the locally built image is discarded unscanned-for-nothing, and the
      # registry copy - scanned by the QA run - is what gets deployed.
      - name: Push container image
        if: steps.registry.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "${{ steps.tag.outputs.image }}" --quiet >/dev/null 2>&1; then
            echo "::notice::Tag appeared in Artifact Registry while this job was building"
            echo "(a concurrent deploy-qa.yml run of the same commit). Skipping the push;"
            echo "the deploy below will use the image already published, which that run scanned."
          else
            docker push "${{ steps.tag.outputs.image }}"
          fi

      # Roll out a new Cloud Run revision running the image we just pushed.
      # Cloud Run scales to zero when idle and back up on demand. Flags below
      # (kept above the command so a comment never lands between
      # backslash-continued lines):
      #   --image   the exact image to run (same reference used all job long)
      #   --platform managed   Google runs the servers, not us
      #   --ingress all   accept traffic from anywhere; Cloudflare reaches this
      #                   service directly as one of the three origins
      #   --service-account   the RUNTIME identity the container runs as -
      #                       separate from the deployer identity above and kept
      #                       minimal (least privilege)
      #   --quiet   don't prompt for confirmation; CI can't answer prompts
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --image "${{ steps.tag.outputs.image }}" \
            --platform managed \
            --ingress all \
            --service-account "csoh-run-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet

      # Print which revision is now live and its URL - handy confirmation in the
      # run log that the deploy actually took effect.
      - name: Show deployed revision
        run: |
          # `--format='value(...)'` prints just the two named fields, space-
          # separated, with no surrounding table/labels.
          gcloud run services describe "${{ env.SERVICE }}" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.latestReadyRevisionName,status.url)'

  # ---------------------------------------------------------------------------
  # Cloudflare is the CDN actually in front of all three origins, and nothing
  # was purging it. The CloudFront invalidation in publish-aws only clears
  # CloudFront, which visitors never touch.
  #
  # Normally the ?v=<content-hash> cache-buster makes a purge unnecessary: new
  # content means a new URL means a guaranteed miss. But that only holds if the
  # asset is in place before its URL is first requested. When it isn't, the
  # edge caches the OLD bytes under the NEW key with `immutable,
  # max-age=31536000` and serves them for a year; SRI then blocks the asset and
  # the site renders unstyled (2026-07-15). The asset-before-HTML ordering in
  # the publish jobs prevents that; this purge is the backstop that stops any
  # such mistake from outliving the deploy.
  #
  # `needs:` all three publishers so the purge happens only once every origin
  # is serving the new bytes - purging earlier could just re-cache stale ones.
  #
  # SETUP (one time, required before this job can pass):
  #   1. Cloudflare → My Profile → API Tokens → Create Token → Custom token
  #      with the single permission Zone → Cache Purge → Purge, and Zone
  #      Resources limited to csoh.org. Nothing else.
  #   2. Repo → Settings → Secrets and variables → Actions:
  #      - Secret   CLOUDFLARE_API_TOKEN = that token
  #      - Variable CLOUDFLARE_ZONE_ID   = the zone id from the Cloudflare
  #        dashboard's Overview page (an identifier, not a secret)
  # Until both exist this job fails by design: publishing to the origins while
  # silently leaving a stale edge is the failure this whole job exists to stop.
  # ---------------------------------------------------------------------------
  purge-cloudflare:
    needs: [publish-aws, publish-azure, publish-gcp]
    runs-on: ubuntu-latest
    # See the note on the build job: caps how long a hung purge or verify can
    # hold the deploy lock.
    timeout-minutes: 10
    environment: production
    steps:
      # Unlike the clouds above, Cloudflare has no OIDC federation, so this is
      # the one stored credential in the deploy: an API token scoped to a single
      # permission (Zone → Cache Purge) on this zone alone. It cannot read DNS,
      # edit rules, or touch any other zone. Rotate it in Settings → Secrets.
      #
      # The zone id is an identifier, not a credential, so it's a Variable -
      # same split as AWS_PUBLISHER_ROLE_ARN (var) above. Both must exist before
      # this job can pass; see the setup note in the job comment.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          # -e: abort on error, -u: error on unset vars, -o pipefail: a failure
          # anywhere in a pipeline fails the step (not just the last command).
          set -euo pipefail

          # Fail loudly rather than "succeeding" with an unpurged cache - a
          # silent skip here is how a poisoned edge survives a green deploy.
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "::error::Missing Cloudflare config - cache NOT purged. Set the" \
                 "CLOUDFLARE_API_TOKEN secret (Zone → Cache Purge on this zone only)" \
                 "and the CLOUDFLARE_ZONE_ID variable."
            exit 1
          fi

          # purge_everything rather than a URL list: the free plan caps purge-by
          # -URL at 30 per call and every HTML page changes on a content deploy,
          # so enumerating is both fiddly and easy to under-cover. The site is
          # small and static; a cold edge refills in minutes.
          response=$(curl -sS --fail-with-body \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          # HTTP 200 is not enough: Cloudflare returns 200 with "success": false
          # for things like a bad zone id, so check the body's success flag.
          # (jq is preinstalled on ubuntu-latest runners.)
          if ! echo "${response}" | jq -e '.success' >/dev/null; then
            echo "::error::Cloudflare purge failed: $(echo "${response}" | jq -c '.errors')"
            exit 1
          fi
          echo "Cloudflare cache purged."

      # Prove the deploy is actually serving what the HTML asks for. This is the
      # check that would have caught 2026-07-15 in CI instead of in production:
      # it re-derives each asset's SHA-384 from the bytes the edge hands back and
      # compares against the integrity= the live HTML declares for that URL.
      - name: Verify live assets match their SRI hashes
        run: |
          set -euo pipefail
          # Give the purge a moment to take effect across the edge.
          sleep 10
          python3 - <<'PY'
          import base64, hashlib, re, sys, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "csoh-deploy-verify"})
              # cache-control: no-cache asks the edge to revalidate rather than
              # hand us a cached copy, so we verify what it would actually serve.
              req.add_header("Cache-Control", "no-cache")
              return urllib.request.urlopen(req, timeout=30).read()

          html = get("https://csoh.org/").decode("utf-8", "replace")

          # Pair each versioned asset URL with the integrity= alongside it.
          pattern = re.compile(
              r'(?:href|src)="(/[^"]+\?v=[0-9a-f]+)"[^>]*integrity="sha384-([^"]+)"'
              r'|integrity="sha384-([^"]+)"[^>]*(?:href|src)="(/[^"]+\?v=[0-9a-f]+)"')

          checked = failed = 0
          for m in pattern.finditer(html):
              url, want = (m.group(1), m.group(2)) if m.group(1) else (m.group(4), m.group(3))
              got = base64.b64encode(hashlib.sha384(get("https://csoh.org" + url)).digest()).decode()
              checked += 1
              if got != want:
                  failed += 1
                  print(f"::error::SRI MISMATCH {url}\n  serving: {got}\n  HTML wants: {want}")
              else:
                  print(f"ok  {url}")

          if not checked:
              print("::error::No versioned assets found in the live HTML - check the selector.")
              sys.exit(1)
          if failed:
              print(f"::error::{failed} of {checked} assets do not match their SRI hash; "
                    "browsers will refuse them and the site will render unstyled.")
              sys.exit(1)
          print(f"All {checked} live assets match their SRI hashes.")
          PY

      # Same idea as the SRI check above, for the security headers.
      #
      # The csoh-security-headers ruleset in infra/terraform/cloudflare/rules.tf
      # carries `ignore_changes = [rules]` to work around a cloudflare v4
      # provider ordering bug. `rules` is the only meaningful attribute of a
      # ruleset, so that makes the resource inert: a CSP tightened in Git
      # produces a clean `terraform apply` and reaches nothing. Those headers
      # are also the ONLY source of CSP/HSTS for the Azure origin, which cannot
      # set response headers itself (GCP has nginx-security-headers.conf; AWS
      # has a CloudFront response headers policy once aws/ is applied).
      #
      # So assert from the outside instead: fail the deploy if what the edge
      # serves has drifted from what this repo declares. Delete this step when
      # the v5 provider upgrade lets the ignore_changes workaround go away.
      # This job has no checkout of its own (the SRI step above is written as an
      # inline heredoc for that reason), so fetch the repo to get the checker.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here talks to git after the clone, so don't leave the
          # credential sitting in .git/config for later steps to find.
          persist-credentials: false

      - name: Verify live security headers match the repo
        run: python3 tools/check_edge_headers.py --url https://csoh.org/

      # Third edge-parity gate, same reasoning as the two above: assert that
      # what the edge serves is what this repo says.
      #
      # Cloudflare's AI Crawl Control used to prepend a managed robots.txt block
      # ahead of ours, disallowing seven crawlers that our own robots.txt and
      # llms.txt explicitly welcome. It was turned off on 2026-07-26. Nothing
      # stops it being re-enabled - it is a zone-level dashboard toggle that
      # infra/terraform/cloudflare/ does not declare, so `terraform apply` would
      # neither report nor fix a regression. This step is the only thing that
      # would notice.
      - name: Verify live robots.txt matches the repo
        run: python3 tools/check_robots_parity.py --url https://csoh.org/robots.txt
