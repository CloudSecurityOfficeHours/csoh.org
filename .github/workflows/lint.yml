# =============================================================================
# Lint
# -----------------------------------------------------------------------------
# Quality gate for code & GitHub Actions on every push and PR. Five checks:
#
#   1. actionlint  - workflow syntax + shellcheck on inline `run:` blocks.
#                    Catches things like unquoted variables, typo'd `uses:`
#                    versions, bad `if:` expressions BEFORE we ship.
#   2. ruff        - Python lint on the .py housekeeping scripts. Catches
#                    real bugs (unused imports, undefined names, bare
#                    `except`) without nitpicking on style.
#   3. yamllint    - structural sanity on every YAML file with a config that's
#                    relaxed for GitHub Actions quirks (see .yamllint.yml).
#   4. secret-audit - every `${{ secrets.X }}` a workflow reads must have a
#                    registry entry in tools/rotate_secrets.py, i.e. a written
#                    rotation plan. Adding a secret without one fails here.
#   5. dark-branch - style.css carries two dark-mode branches (attribute and
#                    prefers-color-scheme). They must stay in step, or dark-OS
#                    visitors get light-mode colours for the whole first paint.
#
# All five are fast (<30s combined). They run as parallel jobs so failures
# in one check don't hide failures in the others - you see everything at once.
# Read-only on the repo; never modifies code, never posts comments.
# =============================================================================

# This whole file is a "workflow": a GitHub Actions automation that runs in
# response to events in the repo (a push, a pull request, a button click).
# GitHub reads it because it lives under .github/workflows/ and ends in .yml.
# `name:` is just the human-friendly label shown in the repo's Actions tab.
name: Lint

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# -----------------------------------------------------------------------------
# `on:` lists the events that start this workflow. Any one of the events below
# is enough to trigger a run; they are alternatives, not requirements.
on:
  # `pull_request` fires whenever someone opens or updates a PR. With no
  # filters it covers PRs targeting any branch - this is the quality gate for
  # incoming changes.
  pull_request:
  # `push` fires when commits land on a branch. `branches:` narrows it to
  # only the listed branch(es) - here just `main` - as a safety net for
  # direct commits that bypass PRs.
  push:
    branches:
      - main
  # `workflow_dispatch` adds a "Run workflow" button in the Actions tab so a
  # human can launch this manually on demand (no code change required).
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions
# Read-only. The lint job never writes to the repo or posts comments.
# -----------------------------------------------------------------------------
# Every run gets an automatic, throwaway credential called GITHUB_TOKEN.
# `permissions:` sets what that token is allowed to do. Listing only what's
# needed (least privilege) limits the damage if a step misbehaves.
permissions:
  # `contents: read` lets the run read repo files (needed to check them out)
  # but not push commits, tags, or releases.
  contents: read

# -----------------------------------------------------------------------------
# §3 - Concurrency
# Per-ref lock so a new push to the same PR cancels the in-flight lint run.
# Different PRs lint in parallel.
# -----------------------------------------------------------------------------
# `concurrency:` lets at most one run hold a named "group" at a time. Runs in
# the same group queue up or cancel each other; runs in different groups are
# unaffected and proceed in parallel.
concurrency:
  # `${{ ... }}` is GitHub Actions' expression syntax - it's substituted with
  # a real value at run time. `github.ref` is the branch/PR ref being built,
  # so each branch or PR gets its own group (e.g. "lint-refs/heads/main").
  group: lint-${{ github.ref }}
  # When a newer run claims the group, cancel the older in-progress one. This
  # avoids wasting minutes linting a commit you've already superseded.
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps
# Four independent jobs running in parallel. Each fails the workflow on its
# own - we don't want a Python lint failure to mask a workflow lint failure.
# -----------------------------------------------------------------------------
# `jobs:` holds the units of work. Each job runs on its own fresh virtual
# machine and, unless one job declares it `needs:` another, all jobs start at
# once and run in parallel. A job is a sequence of `steps:` (below).
jobs:
  # -------------------------------------------------------------------------
  # actionlint - checks .github/workflows/*.yml for syntax issues, bad
  # `uses:` references, malformed `if:` expressions, and (via the bundled
  # shellcheck) shell issues inside `run:` blocks like unquoted variables.
  # -------------------------------------------------------------------------
  # `actionlint:` is the job's internal id (used to reference it elsewhere).
  actionlint:
    # `runs-on:` picks the runner OS. "ubuntu-latest" is a GitHub-hosted
    # Linux VM, created fresh for this job and discarded when it finishes.
    runs-on: ubuntu-latest
    # `steps:` is the ordered to-do list for this job. Each list item ("- ")
    # is one step and runs top-to-bottom on the same VM. A step either runs a
    # prebuilt action (`uses:`) or a shell command (`run:`).
    steps:
      # `name:` is the label shown for this step in the run's log.
      - name: Checkout repository
        # `uses:` pulls in a reusable, prepackaged action. This first-party
        # one copies your repo's code onto the runner - without it the VM is
        # empty. The "@<40-hex-chars>" pins the action to an exact commit SHA
        # (not a moving tag) so a hijacked tag can't swap in malicious code;
        # the trailing "# v7.0.0" comment just notes the human-readable
        # version that SHA corresponds to.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # raven-actions/actionlint bundles actionlint + shellcheck and emits
      # GitHub Actions error annotations so failures show up inline on PRs.
      - name: Run actionlint
        # A third-party action, again pinned to a full commit SHA for safety.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        # `with:` passes input settings to the action (like function args).
        with:
          # Make the step (and thus the job) fail if actionlint finds a
          # problem, so a bad workflow can't slip through as a green check.
          fail-on-error: true

  # -------------------------------------------------------------------------
  # ruff - Python linter. Config lives in pyproject.toml. We use the default
  # rule set (E + F + W): catches real bugs without surfacing style nits.
  # -------------------------------------------------------------------------
  # A separate job, so it runs in parallel with actionlint on its own VM.
  ruff:
    runs-on: ubuntu-latest
    steps:
      # Same checkout step as above - each job's VM starts empty, so every
      # job that needs the code must check it out for itself.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Runs ruff, reading its rules from pyproject.toml in the repo. A lint
      # failure fails the job. The `version:` input pins the ruff binary
      # itself - without it the action installs whatever ruff is newest, and a
      # release that adds or tightens rules can turn this job red with no
      # change in the repo. Same reproducibility reasoning as the pinned
      # yamllint below; bump the pin deliberately.
      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: 0.16.0

  # -------------------------------------------------------------------------
  # yamllint - structural lint for every YAML file. Config in .yamllint.yml
  # disables the rules that don't fit GitHub Actions YAML (line-length,
  # truthy, document-start). Everything else stays at default.
  # -------------------------------------------------------------------------
  # The third parallel job, on its own VM.
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `run:` (instead of `uses:`) executes a shell command on the runner.
      # The ubuntu-latest VM already has Python+pip, so we pip-install yamllint
      # here - rather than pulling a third-party action - to keep the
      # supply-chain surface small. Pinning the exact version (==1.38.0) keeps
      # results reproducible: a new release can't silently change which rules
      # fire.
      - name: Install yamllint
        run: pip install yamllint==1.38.0

      # `yamllint .` scans every YAML file from the repo root down. It applies
      # the repo's .yamllint.yml automatically (yamllint looks for that file),
      # so the GitHub-Actions-friendly rule tweaks there take effect. A
      # non-zero exit (any reported problem) fails the step and the job.
      - name: Run yamllint
        run: yamllint .

  # -------------------------------------------------------------------------
  # secret-audit - every secret a workflow reads must have a rotation plan.
  # -------------------------------------------------------------------------
  # tools/rotate_secrets.py scans .github/workflows/ for `${{ secrets.X }}` and
  # cross-references a registry of every long-lived credential: what it is for,
  # how sensitive it is, how often it should be rotated, and how to roll it.
  # `--check` exits 1 when the two disagree.
  #
  # The specific thing this catches is a secret added to a workflow without
  # anyone deciding how it gets rotated - which is how you end up with a
  # credential that is simply never rolled, because nothing ever asks. It also
  # catches a secret referenced after being deleted, and a registry entry left
  # behind after its last consumer went away.
  #
  # WHAT THIS JOB CANNOT SEE, AND WHY IT SAYS SO
  # --------------------------------------------
  # Reading the Actions secrets API needs a `secrets` permission that
  # GITHUB_TOKEN cannot be granted - it is not one of the keys `permissions:`
  # accepts - and the org-level secrets need `admin:org` on top of that. So on
  # a runner the script cannot see any secret's `updated_at`, which means the
  # rotation-cadence check and the orphaned-secret check do not run here. They
  # run locally, where `gh` is authenticated as a human.
  #
  # That gap is the reason the script prints a "Coverage" section listing each
  # check as `enforced` or `not checked`, with the reason. A gate that skips
  # checks silently is worse than no gate, because the green tick gets read as
  # "all of this was verified" - the same failure shape as the inert Cloudflare
  # ruleset and the `'*.html'` path filter documented in CLAUDE.md. Read the
  # Coverage block in this job's log rather than assuming a pass covers
  # everything.
  #
  # Deliberately NOT fixed by handing this job a PAT that can read secrets:
  # putting a long-lived credential into CI in order to audit long-lived
  # credentials is a bad trade, and it would be the broadest secret in the repo.
  secret-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No pip install and no setup-python: the script is stdlib-only by
      # design, and ubuntu-latest ships both python3 and the gh CLI.
      #
      # GH_TOKEN is what `gh api` authenticates with. It is expected to be
      # refused by the secrets endpoints; the script treats that as "cannot
      # read" rather than "nothing there", and reports it in Coverage.
      - name: Audit workflow secrets against the rotation registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/rotate_secrets.py audit --check

  # ---------------------------------------------------------------------------
  # dark-branch - the two dark-mode branches in style.css must stay in step.
  #
  # `[data-theme="dark"] X` governs after main.js stamps the attribute;
  # `:root:not([data-theme]) X` inside @media (prefers-color-scheme: dark)
  # governs before it, which - since main.js loads at the bottom of <body> -
  # is the whole first paint for anyone on a dark OS, and forever with JS off.
  #
  # Only the first branch was ever maintained. It drifted to 196 rules against
  # the other's 36, and the gap rendered as light-mode text on dark surfaces:
  # a .btn-primary whose text exactly matched its own background (contrast
  # 1.00, invisible), .hamburger at 1.08:1, body copy at 2.04:1. None of it
  # was visible to the SEO audit, which does not check contrast, and PSI runs
  # light so it never saw it either.
  #
  # The generated block cannot drift silently again while this gate exists.
  # It is read-only: it fails the build, it never rewrites style.css.
  # ---------------------------------------------------------------------------
  dark-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # stdlib-only, same as the other checks here - no pip install needed.
      - name: Check the system-dark branch mirrors the toggle branch
        run: python3 tools/sync_dark_branch.py --check
