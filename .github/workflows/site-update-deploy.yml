# =============================================================================
# Site housekeeping - SRI hashes, URL safety, sitemap, preview images
# -----------------------------------------------------------------------------
# Runs on every push to main that touches site files. Walks through a
# sequence of housekeeping steps (SRI hashes, URL safety, URL normalization,
# presentations schema, sitemap dates, preview screenshots), committing each
# one back to main if anything changed. The actual deploy to production is
# done by `deploy.yml` - this workflow only does the housekeeping that
# belongs upstream of the deploy.
#
# Each step that commits-and-pushes uses
#     git push || (git pull --rebase origin main && git push)
# so that if another workflow pushed a commit while this one was working,
# this run rebases on top and tries again instead of failing.
#
# The downstream deploy.yml is triggered by the housekeeping commits
# this workflow pushes (since they're authored by the csoh-ci App, not the
# default GITHUB_TOKEN, so they trigger downstream workflows correctly).
# =============================================================================

# This whole file is a "workflow": a set of automated jobs that GitHub runs
# for us on its own servers (no laptop required) whenever a trigger fires.
# `name:` is just the label shown in the repo's Actions tab and in commit
# status checks so a human can tell which workflow ran.
name: Site Housekeeping (SRI, sitemap, previews)

# `on:` lists the events that start this workflow. Below it lists two:
# a `push` to a branch, and a manual button click (`workflow_dispatch`).
on:
  # Auto-run on every push to main, but ONLY when one of the listed file
  # patterns changed. Editing tools/ or docs alone won't trigger a run.
  # `paths:` are glob patterns: `*` matches within one path segment and
  # `**` matches across directories, so `img/**` means any file under img/.
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'chat-screenshots/**'
      - 'img/**'
      - 'style.css'
      - 'main.js'
      - 'chat-resources.js'
      - 'breach-timeline.css'
      - 'breach-timeline.js'
      - 'vendor/**'
      - 'update_sri.py'
  # Manual trigger from the Actions tab.
  # `workflow_dispatch:` adds a "Run workflow" button so a human can launch
  # this run on demand (e.g. to regenerate previews) without pushing a commit.
  workflow_dispatch:

# `permissions:` sets what the automatic, throwaway credential GitHub hands
# this run (called GITHUB_TOKEN) is allowed to do against this repo. Starting
# from least-privilege and granting only what's needed is the safe default.
# Read-only on the auto-injected GITHUB_TOKEN. Every step that pushes
# commits (SRI, sitemap, previews, etc.) uses an installation token minted
# from the csoh-ci GitHub App. The default token only needs to clone the repo.
# (`contents: read` = may read repo files; it cannot write/push.)
permissions:
  contents: read

# `concurrency:` stops two runs that share the same `group:` name from
# executing at the same time - GitHub lets only one run per group proceed and
# holds (or cancels) the rest. This `deploy-pipeline` group is shared across
# all the workflows that push commits to main (site-update-deploy,
# update-news, normalize-urls) so they queue serially instead of racing and
# clobbering each other.
#
# cancel-in-progress: true - if a newer push is queued while an older
# housekeeping run is in flight, cancel the older one so we don't push
# stale SRI/sitemap state on top of a newer base.
concurrency:
  group: deploy-pipeline
  cancel-in-progress: true

# `jobs:` holds one or more jobs. A "job" is an independent unit of work that
# runs on its own fresh virtual machine. This workflow has a single job; jobs
# run in parallel by default unless one declares it `needs:` another.
jobs:
  # `update-sri-and-previews` is the job's id (our name for it). Everything
  # indented under it belongs to this one job.
  update-sri-and-previews:
    # `runs-on:` picks the type of machine GitHub spins up for the job here a
    # fresh, GitHub-hosted Ubuntu Linux VM that is wiped after the run.
    runs-on: ubuntu-latest
    # `steps:` is the ordered list of actions/commands the job runs, top to
    # bottom, on that VM. Each `- name:` below is one step.
    steps:
      # This is the first step. Two ways a step can do work: `uses:` runs a
      # prebuilt, shareable action (someone else's packaged code), while
      # `run:` (seen later) executes raw shell commands. This step `uses:` an
      # action. `id:` gives the step a handle so later steps can read its
      # outputs (e.g. `steps.app-token.outputs.token`).
      # Mint a short-lived (~1h) installation token from the csoh-ci GitHub
      # App. Replaces the long-lived PAT_TOKEN we used to use here. We need a
      # non-default token (not the auto-injected GITHUB_TOKEN) because the
      # housekeeping steps below push commits to main and we want those to
      # trigger downstream workflows - GITHUB_TOKEN-authored commits do not.
      # The App is on the main-branch ruleset bypass list, so direct pushes
      # from this workflow are accepted.
      - name: Mint installation token
        id: app-token
        # The text after `@` pins the action to one exact Git commit (a SHA),
        # not a movable tag like `v3`. Pinning by SHA means a compromised
        # upstream tag can't silently swap in malicious code on our next run;
        # the `# v3.1.1` comment just records which release that SHA is.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        # `with:` passes inputs to the action above (like function arguments).
        with:
          # `${{ ... }}` is a GitHub Actions expression, evaluated before the
          # step runs. `secrets.NAME` reads an encrypted repo secret (stored
          # in Settings, never printed in logs) - here the App's credentials.
          # `client-id` (the Iv23.* string from the App's settings page) -
          # the older `app-id` (numeric App ID) was deprecated in v3.x.
          client-id: ${{ secrets.CSOH_CI_CLIENT_ID }}
          private-key: ${{ secrets.CSOH_CI_PRIVATE_KEY }}

      # The VM starts empty, so the first thing almost every workflow does is
      # `actions/checkout` to clone this repo's code onto the machine.
      # App-authenticated full clone. fetch-depth: 0 = no shallow clone, so
      # `git diff` and `git log` see full history (needed for the
      # diff-against-original-SHA checks below).
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Reuse the App token from the previous step (via its `id`) as the
          # clone credential. checkout saves it, so later `git push` commands
          # in `run:` steps authenticate as the App without re-supplying it.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # First `run:` step: instead of a prebuilt action, it runs a shell
      # command directly on the VM. Writing `key=value` lines into the special
      # file named by `$GITHUB_OUTPUT` publishes a step output that other steps
      # read as `steps.<id>.outputs.<key>` (here: steps.original_sha.outputs.sha).
      # `$(...)` runs `git rev-parse HEAD` and substitutes its result (the SHA).
      # Remember the commit SHA we started from. Later steps push new commits
      # and we want to compare against THIS sha (not HEAD) to know what the
      # original push actually changed.
      - name: Save original commit SHA
        id: original_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The fresh VM has no project tooling pre-configured, so we install what
      # the scripts need. Install Python - most of the housekeeping scripts
      # are Python. `actions/setup-python` puts a Python on PATH; `'3.x'` means
      # "the latest Python 3" (quoted so YAML keeps it a string, not the
      # number 3.0).
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      # `run: |` - the `|` is YAML for "a multi-line block"; every indented
      # line below is one shell command, run in order in the same shell.
      # Install Playwright + Pillow (used by generate_preview.py to capture
      # and resize screenshots) plus a headless Chromium binary.
      # Pinned versions: bump deliberately when needed rather than picking
      # up whatever PyPI happens to ship today (supply-chain reproducibility).
      - name: Install dependencies
        run: |
          pip install 'playwright==1.59.0' 'Pillow==12.2.0'
          playwright install chromium

      # --- SRI hashes are always updated and committed BEFORE any deploy step ---
      # SRI = Subresource Integrity. Each <script> and <link rel="stylesheet">
      # tag carries a sha384 hash of the file it loads; browsers refuse to
      # execute the file if the hash mismatches. We recompute these hashes
      # whenever style.css or main.js changes, otherwise the page breaks.
      # This step sets the pattern most steps below reuse: run a Python script
      # that rewrites files, then commit & push ONLY if something actually
      # changed. Read the inline comments here once and the later steps will
      # look familiar.
      - name: Update SRI hashes in HTML files (MUST RUN BEFORE DEPLOY)
        id: sri
        run: |
          python3 update_sri.py
          # `git diff --quiet` exits 0 if there's nothing changed, 1 if there is.
          if git diff --quiet; then
            # Set a step output so later steps can ask "did SRI change?"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SRI changes to commit"
          else
            # Configure git as the bot identity, then commit & push.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # `*.html` is shell-globbed by git itself; commit ONLY HTML files.
            git add '*.html'
            # `[skip ci]` in a commit message tells GitHub Actions NOT to
            # trigger workflows on this commit - avoids a deploy loop.
            git commit -m "chore: update SRI hashes for CSS/JS files [skip ci]"
            # If push fails (race with another deploy-pipeline run), pull
            # with rebase and retry. See file header for context.
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SRI changes committed"
          fi

      # Validate every URL in our HTML against safety lists. We block the
      # whole deploy if anything unsafe slipped through - this is the
      # deploy-time equivalent of the per-PR check.
      # How "blocking" works: by default, if any command in a step exits with
      # a nonzero code the whole step fails and the rest of the job is
      # abandoned. So the `exit 1` further down is what actually halts the run.
      - name: Check URL safety (must pass before normalization)
        id: url_safety
        run: |
          # `> file` redirects normal output (stdout) to the report file, and
          # `2>&1` sends error output (stderr) to the same place. `|| true`
          # swallows a nonzero exit here so we can inspect the report ourselves
          # below rather than failing immediately on this line.
          python3 tools/check_all_site_urls.py > url-safety-report.txt 2>&1 || true
          cat url-safety-report.txt
          if grep -q "❌ UNSAFE" url-safety-report.txt; then
            # `::error::` makes GitHub Actions render this as a red error
            # annotation in the run summary.
            echo "::error::Unsafe URLs detected - blocking normalization and deploy"
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      # An "artifact" is a file the run saves and attaches to itself so you can
      # download it from the run's page afterward (the VM is destroyed, so this
      # is how files outlive the run). `if:` is a condition controlling whether
      # a step runs at all; normally a step is skipped once an earlier step has
      # failed.
      # Save the safety report so reviewers can read it. `if: always()` =
      # upload even if the previous step failed (that's exactly when we
      # most want the report).
      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `name:` is what the downloadable artifact is called; `path:` is the
          # file(s) to bundle into it.
          name: deploy-url-safety-report
          path: url-safety-report.txt
          # Auto-delete after 30 days so artifacts don't pile up forever.
          retention-days: 30
          # If the file is missing, just warn instead of failing the step.
          if-no-files-found: warn

      # Strip tracking params and resolve redirects on every URL. Same logic
      # as the standalone normalize-urls workflow, but runs inline so changes
      # ride along with the same deploy instead of opening a PR.
      - name: Normalize URLs (strip tracking params, resolve redirects)
        id: normalize
        run: |
          # `tee` writes output to a file AND prints it. PIPESTATUS[0] is
          # the exit code of the FIRST command in the pipe (Python), not tee.
          # `--cache` backs redirect resolution with a committed JSON map so
          # only URLs we've never resolved hit the network (the slow part was
          # re-resolving all ~2,500 every run). The cache auto-does a full
          # re-resolve once it's older than its TTL, so drift is still caught;
          # safety checks on resolved destinations run every time regardless.
          # The cache is seeded by CI on first run - never commit a local one,
          # since redirect resolution is IP-dependent.
          python3 tools/normalize_urls.py --apply \
            --cache tools/url_resolution_cache.json 2>&1 | tee normalize-output.txt
          NORM_EXIT=${PIPESTATUS[0]}
          # Exit code 2 from normalize_urls.py = a redirect went to an
          # unsafe destination. Don't deploy; surface as a hard error.
          if [ "$NORM_EXIT" -eq 2 ]; then
            echo "::error::Normalization detected redirects to unsafe destinations - blocking deploy"
            exit 1
          fi
          # Other nonzero exits are warnings (couldn't resolve some URLs);
          # `::warning::` shows them as yellow annotations but doesn't fail.
          if [ "$NORM_EXIT" -ne 0 ]; then
            echo "::warning::URL normalization exited with code $NORM_EXIT - some redirects may not have been resolved"
          fi
          # Stage normalized HTML plus the refreshed resolution cache. Scope
          # the staging to these paths only - other steps (URL safety) may
          # leave report files modified, and we don't want to commit those.
          # The cache changes whenever a new URL is resolved, even when no HTML
          # changed, so we commit on either. `git diff --cached --quiet` then
          # tells us whether anything is actually staged (avoids an empty
          # commit failing under `bash -e`).
          git add '*.html'
          if [ -f tools/url_resolution_cache.json ]; then
            git add tools/url_resolution_cache.json
          fi
          if git diff --cached --quiet; then
            echo "No URL or cache changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: normalize URLs + refresh resolution cache [skip ci]"
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # presentations.html embeds JSON-LD VideoObject schema for each YouTube
      # talk. This script regenerates that block from the cards on the page,
      # so when you add a presentation the schema follows automatically.
      - name: Refresh presentations VideoObject schema
        id: presentations_schema
        run: |
          python3 tools/update_presentations_schema.py
          # Only commit if presentations.html actually changed.
          if git diff --quiet -- presentations.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No presentations schema changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presentations.html
            git commit -m "chore: refresh presentations VideoObject schema [skip ci]"
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Presentations schema changes committed"
          fi

      # Rebuild the meetings full-text search index. The meetings.html
      # search input lazily fetches /meetings-search-index.json so users
      # can match against the FULL recap body (speakers, topics buried in
      # the prose) and not just the card summaries.
      - name: Rebuild meetings search index
        id: meetings_search
        run: |
          python3 tools/build_meetings_search_index.py
          if git diff --quiet -- meetings-search-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meetings search index changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add meetings-search-index.json
            git commit -m "chore: rebuild meetings search index [skip ci]"
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Meetings search index changes committed"
          fi

      # Refresh the <lastmod> dates in sitemap.xml from each file's git
      # commit date. Search engines use these to decide what to re-crawl.
      - name: Refresh sitemap lastmod dates
        id: sitemap
        run: |
          python3 tools/update_sitemap.py
          if git diff --quiet -- sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sitemap changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh sitemap lastmod dates [skip ci]"
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sitemap changes committed"
          fi

      # Validate that every news source banner referenced in news.html exists
      # on disk. Catches the case where update_news.py:SOURCE_SLUGS gains a
      # new entry but the matching img/news-banners/{slug}.{jpg,webp} pair
      # was never committed - which silently broke cards before this check
      # was added. Fails the deploy so the missing banners get generated
      # (see tools/generate_news_banners.py) before going live.
      - name: Check news source banners exist
        run: |
          python3 tools/check_news_banners.py

      # Look for resource cards on the site that don't yet have a preview
      # screenshot. Sets a step output so the next two steps know whether
      # to actually generate them.
      - name: Check for missing previews
        id: check_previews
        run: |
          # `|| true` - don't fail this step if the script exits nonzero;
          # we just want the report to grep.
          python3 tools/generate_preview.py --check > preview-check.txt || true
          if grep -q "Found.*resources without previews" preview-check.txt; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "Found resources without previews"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "All resources have previews"
          fi
          cat preview-check.txt

      # This `if:` reads the output the previous step published
      # (steps.check_previews.outputs.missing) and runs only when it equals the
      # string 'true'. Note the quotes: step outputs are always text, so we
      # compare against the string 'true', not a YAML boolean. If it's 'false'
      # this step (and the next one) are skipped, saving time.
      # Headless-Chromium screenshot every URL that's missing a preview.
      # Conditional - only runs if the previous step found something missing.
      - name: Generate missing previews
        if: steps.check_previews.outputs.missing == 'true'
        run: |
          python3 tools/generate_preview.py --batch-auto

      # Squeeze ONLY the JPGs the generate step just produced (strip metadata,
      # recompress at quality 85). jpegoptim is idempotent, so re-running it on
      # the other ~540 already-optimized previews is pure wasted CI time - that
      # was the bulk of this step's runtime. New previews show up as untracked
      # files; a regenerated one shows as modified. Nothing else writes to
      # img/previews before this step, so git status is an exact list of what
      # the generate step touched.
      - name: Optimize images
        if: steps.check_previews.outputs.missing == 'true'
        run: |
          # The Ubuntu VM lets us install system packages on the fly.
          # `apt-get update` refreshes the package lists; `install -y` then
          # installs jpegoptim, answering "yes" to any prompt automatically.
          sudo apt-get update
          sudo apt-get install -y jpegoptim
          # Collect new (untracked) + modified preview JPGs. `git diff` never
          # lists untracked files, so `ls-files --others` is the other half.
          { git ls-files --others --exclude-standard -- 'img/previews/*.jpg'
            git diff --name-only -- 'img/previews/*.jpg'
          } | sort -u > new-previews.txt
          if [ -s new-previews.txt ]; then
            echo "Optimizing $(wc -l < new-previews.txt) new/changed preview(s):"
            cat new-previews.txt
            # `-r` skips running jpegoptim at all if the list is empty;
            # `-d '\n'` splits on newlines so paths with spaces stay intact.
            xargs -r -d '\n' jpegoptim --strip-all --max=85 < new-previews.txt
          else
            echo "No new or changed previews to optimize."
          fi
          rm -f new-previews.txt

      # Always sync HTML <img src> paths to preview-mapping.json, even
      # when no new previews were generated this run - past contributors
      # (humans or the weekly Update Resources model) often type
      # made-up filenames into the HTML that drift from what the
      # screenshot generator actually writes to disk. This step is the
      # safety net that keeps them aligned.
      - name: Sync HTML preview paths to mapping
        run: |
          python3 tools/generate_preview.py --fix-html

      # Commit and push the new preview JPGs + the mapping file. We rely on
      # the credentials persisted by actions/checkout (which used the App
      # token) - same pattern as the SRI / sitemap / normalize steps above.
      # No need to embed the token in the remote URL.
      - name: Commit and push preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `|| true` lets the step continue if there are no JPGs to add.
          git add img/previews/*.jpg || true
          git add preview-mapping.json || true
          # Also pick up any HTML rewrites from the --fix-html step.
          git add resources.html ctfs.html threat-research.html conferences.html cloud-security-reading-list.html || true
          # `git diff --cached --quiet` checks the staging area: nothing to
          # commit means we just exit cleanly.
          if git diff --cached --quiet; then
            echo "No preview-related changes to commit"
          else
            git commit -m "chore: auto-generate preview images and sync HTML paths [skip ci]"
            git push || (git pull --rebase origin main && git push)
          fi
