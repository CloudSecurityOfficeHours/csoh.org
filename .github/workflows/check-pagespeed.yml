# =============================================================================
# Weekly PageSpeed Insights Check
# -----------------------------------------------------------------------------
# Every Monday at 14:00 UTC (07:00 PT), runs Google PageSpeed Insights against
# https://csoh.org/ (mobile + desktop in parallel) and appends a row to
# seo-audits/SCORECARD.md. If any of the 8 category scores dropped vs the
# previous row, opens a tracking issue so a regression doesn't go unnoticed.
#
# The SCORECARD diff is one line in one file - safe to auto-merge.
# =============================================================================

# This whole file is a "workflow": a set of automated steps GitHub Actions
# runs for us on GitHub's servers when a trigger fires. `name:` is just the
# label shown in the repo's "Actions" tab so we can spot this run among others.
name: Check PageSpeed

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Weekly cron, a manual button, or a push that edits the checker/workflow.
# -----------------------------------------------------------------------------
# `on:` lists the events ("triggers") that start this workflow. Any one of
# the entries below is enough to kick off a run.
on:
  # `schedule:` runs the workflow on a timer, with no human involved.
  # Mondays at 14:00 UTC (07:00 Pacific, 10:00 Eastern). Cron is always UTC.
  schedule:
    # A cron expression has five space-separated fields:
    #   minute hour day-of-month month day-of-week
    # Here: minute 0, hour 14, any day-of-month (*), any month (*),
    # day-of-week 1 (Monday) - i.e. "every Monday at 14:00".
    - cron: '0 14 * * 1'
  # `workflow_dispatch:` adds a "Run workflow" button in the Actions tab so a
  # human can trigger this on demand (e.g. to test it without waiting a week).
  workflow_dispatch:
  # `push:` fires when commits land on a branch. The `branches` and `paths`
  # filters below narrow it down so we only run when it's actually relevant.
  # Re-run when the checker script changes - exercise the new logic
  # immediately on next push.
  push:
    # Only pushes to the `main` branch count - ignore feature branches.
    branches:
      - main
    # ...and only if one of these files changed. A push that touches nothing
    # but unrelated HTML/CSS won't waste a run here.
    paths:
      - 'tools/check_pagespeed.py'
      - '.github/workflows/check-pagespeed.yml'

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read-only auto-token; every write is done by the App/PAT identities below.
# -----------------------------------------------------------------------------
# `permissions:` controls what the automatic, built-in credential - the
# `GITHUB_TOKEN` that GitHub injects into every run - is allowed to do.
# Granting the least access needed is a security best practice. The detailed
# comment below explains why this token stays read-only and which other
# identities do the actual writing.
# Read-only on the auto-injected GITHUB_TOKEN. Every write (push commits,
# open PR, enable auto-merge, file issue) uses an installation token from
# the csoh-ci GitHub App. CSOH_PAT (separate identity) approves the PR
# because GitHub blocks self-approval and the auto-merge feature does NOT
# honor the App's ruleset bypass for the approval requirement.
permissions:
  # `contents: read` = may clone/read repo files, but may NOT push commits,
  # open PRs, or touch issues. Those happen via the App/PAT tokens instead.
  contents: read

# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# One fixed-group lock so two runs never clobber the same SCORECARD commit.
# -----------------------------------------------------------------------------
# `concurrency:` stops two runs that share a "group" name from executing at
# the same time, which prevents them from clobbering each other's changes.
# This workflow only updates SCORECARD.md, so it doesn't race with the
# deploy pipeline. Keep it in its own concurrency group; multiple runs
# of itself still queue serially.
concurrency:
  # A constant group name (not one keyed on `${{ github.ref }}`) means EVERY
  # run of this workflow shares one lock, so two overlapping runs can never
  # both be mid-write on SCORECARD.md. Other workflows use different names, so
  # this one only competes with other copies of itself, never with deploys.
  group: check-pagespeed
  # `false` = a new run WAITS for the in-flight one to finish rather than
  # killing it. We don't want to abort a half-written SCORECARD commit.
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: mint tokens, run PSI, detect regressions, then open/merge the PR
# and (only on a real drop) file a tracking issue.
# -----------------------------------------------------------------------------
# `jobs:` holds one or more jobs. A "job" is a unit of work that runs on its
# own fresh virtual machine; its steps run top-to-bottom and share that VM's
# disk. This workflow has exactly one job (named `check-pagespeed`).
jobs:
  # The job's name. (Defining it here also lets other jobs depend on it via
  # `needs:`, though there are no other jobs in this file.)
  check-pagespeed:
    # `runs-on:` picks the type of VM ("runner") GitHub spins up for the job.
    # `ubuntu-latest` is GitHub's standard, free Linux runner.
    runs-on: ubuntu-latest
    # Cap the run. The GitHub default is 360 minutes, so a job that
    # hangs on a network call burns six hours and, where it holds a
    # concurrency lock, blocks everything queued behind it for the same
    # six. Sized to the work, not to the worst case imaginable.
    timeout-minutes: 30

    # `steps:` is the ordered list of actions this job performs. Each step is
    # EITHER `uses:` (run a prebuilt, shareable action) OR `run:` (run shell
    # commands we write ourselves). Steps execute in order on the same VM.
    steps:
      # Mint a short-lived (~1h) installation token from the csoh-ci GitHub
      # App. Same pattern as update-news.yml - App token can trigger
      # downstream CI on the PR it opens; the default GITHUB_TOKEN can't.
      # `name:` is the human-readable label for this step in the run log.
      - name: Mint installation token
        # `id:` gives the step a handle so later steps can read its results,
        # e.g. `steps.app-token.outputs.token` further down.
        id: app-token
        # `uses:` runs a prebuilt action published on GitHub. The text after
        # `@` pins the EXACT commit (a 40-char SHA) of that action - far safer
        # than a movable tag like `v3`, because a SHA can't be changed under us
        # to inject malicious code. The trailing `# v3.1.1` is just a
        # human-friendly note of which release that SHA corresponds to.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        # `with:` passes inputs (named parameters) into the action.
        with:
          # `${{ ... }}` is a GitHub Actions expression - it's evaluated and
          # substituted before the step runs. `secrets.NAME` pulls an encrypted
          # value stored in repo/org settings; secrets are never printed in
          # logs. These two identify and prove ownership of the csoh-ci App.
          client-id: ${{ secrets.CSOH_CI_CLIENT_ID }}
          private-key: ${{ secrets.CSOH_CI_PRIVATE_KEY }}

      # The runner starts empty, so this standard action clones our repo onto
      # the VM so later steps can read and edit the files.
      # Full clone - we need the file write access for SCORECARD updates
      # and the history depth for the diff/issue body.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Clone using the App token from the previous step (referenced by its
          # `id`), so any commits/pushes are attributed to the App, not the
          # default GITHUB_TOKEN - that's what lets the PR trigger downstream CI.
          token: ${{ steps.app-token.outputs.token }}
          # `fetch-depth: 0` clones the FULL git history (the default is a
          # shallow 1-commit clone). We need history for the diff/issue body.
          fetch-depth: 0

      # Install a Python interpreter on the runner so the checker script can
      # run. (Ubuntu ships one, but this pins a known version and adds it to
      # PATH cleanly.)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # `3.x` = the latest available Python 3 release. The script doesn't
          # need a specific minor version.
          python-version: '3.x'

      # Capture the most recent PageSpeed row BEFORE running, so we can
      # compare new vs old. Stored as workflow output for the regression
      # step further down.
      - name: Snapshot previous scores
        id: prev
        # `run:` executes shell commands on the runner. The `|` means
        # "everything indented below is one multi-line script" (a YAML block).
        run: |
          # Bash safety flags: -e exit on any error, -u error on undefined
          # variables, -o pipefail fail if any command in a pipe fails. This
          # makes the script stop loudly instead of silently doing the wrong thing.
          set -euo pipefail
          # Find the last existing data row in the PageSpeed Insights table.
          # The table starts after "## PageSpeed Insights" and ends at the
          # next "##" or EOF.
          prev_row=$(awk '
            /^## PageSpeed Insights/ {in_t=1; next}
            in_t && /^## / {in_t=0}
            in_t && /^\| [0-9]{4}-/ {last=$0}
            END {print last}
          ' seo-audits/SCORECARD.md)
          echo "previous row: $prev_row"
          # To hand a value to later steps, a `run:` step appends `key=value`
          # lines to the file named in `$GITHUB_OUTPUT` (a path GitHub provides).
          # That becomes `steps.prev.outputs.row`. For values that may span
          # multiple lines you must use this `key<<EOF ... EOF` heredoc form
          # instead of plain `key=value`.
          {
            echo "row<<EOF"
            echo "$prev_row"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Run the actual PSI check. It hits mobile + desktop in parallel and
      # appends a row to seo-audits/SCORECARD.md.
      - name: Run PageSpeed Insights
        # `env:` defines environment variables visible to this step's command.
        # Here we hand the Google PageSpeed API key (kept as a secret) to the
        # Python script, which reads it from the environment rather than having
        # the key hardcoded in the repo.
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python3 tools/check_pagespeed.py

      # Diff the new row against the snapshot. If any of the 8 category
      # scores dropped, emit `regressed=true` plus a human-readable summary
      # that the issue body will use.
      - name: Detect regression
        id: regression
        run: |
          # `python3 <<'PYEOF' ... PYEOF` feeds everything between the markers
          # to Python as a script (an inline heredoc) - handy for logic too
          # fiddly for shell. Quoting the marker ('PYEOF') stops the shell from
          # touching `$` inside, so Python sees the code verbatim.
          python3 <<'PYEOF'
          import os, re, sys
          path = "seo-audits/SCORECARD.md"
          text = open(path).read()

          # Re-extract the last row (same logic as the bash snapshot step).
          rows = [
              line for line in text.splitlines()
              if re.match(r"^\| \d{4}-\d{2}-\d{2}\s*\|", line)
          ]
          # Filter to PageSpeed table rows - they have "/" inside each cell.
          ps_rows = [r for r in rows if " / " in r]
          if len(ps_rows) < 2:
              print("Only one PSI row in SCORECARD - nothing to compare. Skipping.")
              sys.exit(0)

          prev_row, new_row = ps_rows[-2], ps_rows[-1]
          def parse(row):
              # row: "| DATE | P / A / BP / SEO | P / A / BP / SEO | notes |"
              cells = [c.strip() for c in row.strip("|").split("|")]
              date = cells[0]
              mobile = [int(x.strip()) for x in cells[1].split("/")]
              desktop = [int(x.strip()) for x in cells[2].split("/")]
              return date, mobile, desktop

          prev_date, prev_m, prev_d = parse(prev_row)
          new_date, new_m, new_d = parse(new_row)

          # Lab Performance varies wildly run-to-run based on emulated
          # CPU/network timing. Real regressions show up as both a large
          # drop AND the new score landing below a real-pass floor; lab
          # glitches (e.g. 88 → 38 with LCP still at 1s) drop a lot but
          # stay above 75. The other three categories are deterministic
          # Lighthouse audits and any drop is a real signal.
          THRESHOLDS = {
              # label: (min_drop, max_new_score) - both conditions must hold
              "Performance":    (10, 75),   # ≥10 drop AND new < 75
              "Accessibility":  (1,  100),  # any drop, regardless of new score
              "Best Practices": (1,  100),
              "SEO":            (1,  100),
          }
          labels = ["Performance", "Accessibility", "Best Practices", "SEO"]
          regressions = []
          for strategy, prev_s, new_s in [("mobile", prev_m, new_m),
                                          ("desktop", prev_d, new_d)]:
              for label, p, n in zip(labels, prev_s, new_s):
                  drop = p - n
                  min_drop, max_new = THRESHOLDS[label]
                  if drop >= min_drop and n < max_new:
                      regressions.append(f"{strategy} {label}: {p} → {n} (-{drop})")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              if regressions:
                  f.write("regressed=true\n")
                  body = (
                      f"PageSpeed Insights scores dropped vs the previous run.\n\n"
                      f"**Previous**: `{prev_row}`\n"
                      f"**Current**:  `{new_row}`\n\n"
                      f"**Regressions**:\n"
                      + "\n".join(f"- {r}" for r in regressions)
                      + f"\n\nFull scorecard: [seo-audits/SCORECARD.md]"
                        f"(https://github.com/CloudSecurityOfficeHours/csoh.org/blob/main/seo-audits/SCORECARD.md)\n"
                  )
                  f.write("body<<BODYEOF\n")
                  f.write(body)
                  f.write("\nBODYEOF\n")
                  print(f"⚠️  Regressions detected:\n" + "\n".join(regressions))
              else:
                  f.write("regressed=false\n")
                  print(f"✓ No regressions. {prev_date} → {new_date}")
          PYEOF

      # Did the script change anything? (It always should - appending a
      # row - but guard against the no-op case.) Also decide whether every
      # change is confined to seo-audits/ - the approve and auto-merge steps
      # below are gated on that, so an unexpected file keeps the PR open for
      # a human instead of rubber-stamping it through.
      #
      # Untracked files are included deliberately: peter-evans/create-pull-
      # request commits EVERYTHING in the working tree, including brand-new
      # files a plain `git diff` never lists - so a scope check that only
      # looked at the diff could approve a PR carrying files it never saw.
      - name: Detect changed files
        id: changes
        run: |
          set -euo pipefail
          # `git diff --name-only` lists modified tracked files; `git ls-files
          # --others --exclude-standard` lists new untracked ones. Together
          # they are exactly the set the create-PR action would commit.
          files="$(git diff --name-only; git ls-files --others --exclude-standard)"
          if [ -z "$files" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          # Walk every changed path. If ANY falls outside seo-audits/, flip
          # in_scope=false and stop - humans need to review it.
          in_scope=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              seo-audits/*) ;;                          # expected - allowed
              *) in_scope=false; break ;;               # unexpected file
            esac
          done <<< "$files"
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"
          echo "Changed files (in_scope=$in_scope):"
          echo "$files"

      # Open a PR with the SCORECARD update. Deploy + site-housekeeping
      # workflows have path filters that exclude seo-audits/, so a
      # SCORECARD-only change won't trigger them - no need for the [skip ci]
      # marker (which would also suppress the required lint checks and
      # leave the PR blocked indefinitely).
      # ([skip ci] is a magic phrase in a commit message that tells GitHub
      # Actions to skip running workflows for that commit.)
      - name: Create Pull Request
        id: cpr
        # `if:` makes a step conditional: it runs ONLY when this expression is
        # true. Skip opening a PR if the previous step found no changes.
        if: steps.changes.outputs.has_changes == 'true'
        # A community action that commits the working-tree changes to a branch
        # and opens (or updates) a pull request for them.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # Use the App token so the PR is created by the App identity (which
          # can trigger the PR's status checks).
          token: ${{ steps.app-token.outputs.token }}
          # The commit message and PR title (kept identical here).
          commit-message: 'chore: weekly PageSpeed Insights check'
          title: 'chore: weekly PageSpeed Insights check'
          # The PR description. `|` again starts a multi-line text block.
          body: |
            Automated weekly run of `tools/check_pagespeed.py` against
            https://csoh.org/ (mobile + desktop).

            One-line append to `seo-audits/SCORECARD.md`. Safe to auto-merge.
          # Always reuse this fixed branch name for the PR.
          branch: pagespeed-weekly-check
          # Delete that branch automatically once the PR is merged/closed.
          delete-branch: true
          # Tags applied to the PR for easy filtering in the GitHub UI.
          labels: automated, seo

      # Approve our own PR with the second identity (CSOH_PAT). Required
      # because GitHub blocks self-approval AND the auto-merge feature
      # doesn't honor the App's ruleset bypass for the approval rule.
      - name: Auto approve
        # Two conditions, and the second one matters: a PR was actually opened
        # (its number is not empty), AND every changed path is under
        # seo-audits/. This used to be gated on the PR number alone, reasoning
        # that check_pagespeed.py only touches SCORECARD.md - the same
        # assumption update-news.yml made before it learned the hard way (see
        # its "Auto approve" comments): an approval satisfies the Main
        # ruleset's review requirement and carries the repo owner's identity
        # via CSOH_PAT, so an out-of-scope PR must not receive it. Withhold
        # the approval too, not just the auto-merge.
        if: steps.cpr.outputs.pull-request-number != '' && steps.changes.outputs.in_scope == 'true'
        # `gh` is GitHub's official command-line tool, preinstalled on runners.
        # `gh pr review --approve <number>` posts an approving review on the PR.
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          # `gh` authenticates using whatever is in `GH_TOKEN`. Using the PAT
          # (a different identity than the App that opened the PR) sidesteps
          # GitHub's "you can't approve your own PR" rule.
          GH_TOKEN: ${{ secrets.CSOH_PAT }}

      # Enable auto-merge. The expected diff is a single-line SCORECARD
      # append; safe to merge once status checks pass. Same scope gate as the
      # approval above: anything outside seo-audits/ leaves the PR open for a
      # human.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != '' && steps.changes.outputs.in_scope == 'true'
        # `--auto` tells GitHub to merge the PR by itself as soon as all
        # required checks pass and it's approved; `--squash` combines the PR's
        # commits into one. So this step just arms the merge, it doesn't block.
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          # Arming auto-merge runs as the App identity here (it has the rights
          # to do so); the separate approval above came from the PAT.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # If any score regressed, open OR comment on a tracking issue.
      # Idempotent: if today already has an open "PageSpeed regression"
      # issue (from an earlier manual trigger or rerun), append a comment
      # instead of opening a duplicate. Body is piped via stdin so the `|`
      # chars in the markdown table rows don't get shell-expanded.
      - name: Open or update regression issue
        # Only runs when the Detect-regression step flagged a real drop.
        if: steps.regression.outputs.regressed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Pull the multi-line issue text the regression step produced into an
          # env var, so the shell below can pipe it in without quoting headaches.
          ISSUE_BODY: ${{ steps.regression.outputs.body }}
        run: |
          set -euo pipefail
          # `date -u +%Y-%m-%d` prints today's date in UTC, e.g. 2026-05-29.
          TITLE="PageSpeed regression detected on $(date -u +%Y-%m-%d)"
          # Look for an already-open issue with today's exact title.
          # `${{ github.repository }}` is a built-in context value that GitHub
          # fills in as "owner/repo" (here CloudSecurityOfficeHours/csoh.org).
          # `--json number --jq ...` returns just the first match's number, or
          # empty if none - so `existing` is set only when a duplicate exists.
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label regression \
            --search "in:title \"$TITLE\"" \
            --json number \
            --jq '.[0].number // empty')
          # `[ -n ... ]` is true when the string is NON-empty (we found one).
          if [ -n "$existing" ]; then
            echo "Found existing open issue #$existing - appending comment."
            # Pipe the body in on stdin; `--body-file -` means "read the body
            # from stdin" - keeps the markdown's `|` chars away from the shell.
            printf '%s' "$ISSUE_BODY" | gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body-file -
          else
            # No existing issue: open a fresh one with these labels.
            printf '%s' "$ISSUE_BODY" | gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --label "seo,regression,automated" \
              --body-file -
          fi
