# =============================================================================
# Weekly PageSpeed Insights Check
# -----------------------------------------------------------------------------
# Every Monday at 14:00 UTC (07:00 PT), runs Google PageSpeed Insights against
# https://csoh.org/ (mobile + desktop in parallel) and appends a row to
# seo-audits/SCORECARD.md. If any of the 8 category scores dropped vs the
# previous row, opens a tracking issue so a regression doesn't go unnoticed.
#
# The SCORECARD diff is one line in one file — safe to auto-merge.
# =============================================================================

name: Check PageSpeed

on:
  # Mondays at 14:00 UTC (07:00 Pacific, 10:00 Eastern). Cron is always UTC.
  schedule:
    - cron: '0 14 * * 1'
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Re-run when the checker script changes — exercise the new logic
  # immediately on next push.
  push:
    branches:
      - main
    paths:
      - 'tools/check_pagespeed.py'
      - '.github/workflows/check-pagespeed.yml'

# Read-only on the auto-injected GITHUB_TOKEN. Every write (push commits,
# open PR, enable auto-merge, file issue) uses an installation token from
# the csoh-ci GitHub App. CSOH_PAT (separate identity) approves the PR
# because GitHub blocks self-approval and the auto-merge feature does NOT
# honor the App's ruleset bypass for the approval requirement.
permissions:
  contents: read

# This workflow only updates SCORECARD.md, so it doesn't race with the
# deploy pipeline. Keep it in its own concurrency group; multiple runs
# of itself still queue serially.
concurrency:
  group: check-pagespeed
  cancel-in-progress: false

jobs:
  check-pagespeed:
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived (~1h) installation token from the csoh-ci GitHub
      # App. Same pattern as update-news.yml — App token can trigger
      # downstream CI on the PR it opens; the default GITHUB_TOKEN can't.
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.CSOH_CI_CLIENT_ID }}
          private-key: ${{ secrets.CSOH_CI_PRIVATE_KEY }}

      # Full clone — we need the file write access for SCORECARD updates
      # and the history depth for the diff/issue body.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.x'

      # Capture the most recent PageSpeed row BEFORE running, so we can
      # compare new vs old. Stored as workflow output for the regression
      # step further down.
      - name: Snapshot previous scores
        id: prev
        run: |
          set -euo pipefail
          # Find the last existing data row in the PageSpeed Insights table.
          # The table starts after "## PageSpeed Insights" and ends at the
          # next "##" or EOF.
          prev_row=$(awk '
            /^## PageSpeed Insights/ {in_t=1; next}
            in_t && /^## / {in_t=0}
            in_t && /^\| [0-9]{4}-/ {last=$0}
            END {print last}
          ' seo-audits/SCORECARD.md)
          echo "previous row: $prev_row"
          # Multiline-safe output via heredoc syntax.
          {
            echo "row<<EOF"
            echo "$prev_row"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Run the actual PSI check. It hits mobile + desktop in parallel and
      # appends a row to seo-audits/SCORECARD.md.
      - name: Run PageSpeed Insights
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python3 tools/check_pagespeed.py

      # Diff the new row against the snapshot. If any of the 8 category
      # scores dropped, emit `regressed=true` plus a human-readable summary
      # that the issue body will use.
      - name: Detect regression
        id: regression
        run: |
          python3 <<'PYEOF'
          import os, re, sys
          path = "seo-audits/SCORECARD.md"
          text = open(path).read()

          # Re-extract the last row (same logic as the bash snapshot step).
          rows = [
              line for line in text.splitlines()
              if re.match(r"^\| \d{4}-\d{2}-\d{2}\s*\|", line)
          ]
          # Filter to PageSpeed table rows — they have "/" inside each cell.
          ps_rows = [r for r in rows if " / " in r]
          if len(ps_rows) < 2:
              print("Only one PSI row in SCORECARD — nothing to compare. Skipping.")
              sys.exit(0)

          prev_row, new_row = ps_rows[-2], ps_rows[-1]
          def parse(row):
              # row: "| DATE | P / A / BP / SEO | P / A / BP / SEO | notes |"
              cells = [c.strip() for c in row.strip("|").split("|")]
              date = cells[0]
              mobile = [int(x.strip()) for x in cells[1].split("/")]
              desktop = [int(x.strip()) for x in cells[2].split("/")]
              return date, mobile, desktop

          prev_date, prev_m, prev_d = parse(prev_row)
          new_date, new_m, new_d = parse(new_row)

          labels = ["Performance", "Accessibility", "Best Practices", "SEO"]
          regressions = []
          for strategy, prev_s, new_s in [("mobile", prev_m, new_m),
                                          ("desktop", prev_d, new_d)]:
              for label, p, n in zip(labels, prev_s, new_s):
                  if n < p:
                      regressions.append(f"{strategy} {label}: {p} → {n} (-{p - n})")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              if regressions:
                  f.write("regressed=true\n")
                  body = (
                      f"PageSpeed Insights scores dropped vs the previous run.\n\n"
                      f"**Previous**: `{prev_row}`\n"
                      f"**Current**:  `{new_row}`\n\n"
                      f"**Regressions**:\n"
                      + "\n".join(f"- {r}" for r in regressions)
                      + f"\n\nFull scorecard: [seo-audits/SCORECARD.md]"
                        f"(https://github.com/CloudSecurityOfficeHours/csoh.org/blob/main/seo-audits/SCORECARD.md)\n"
                  )
                  f.write("body<<BODYEOF\n")
                  f.write(body)
                  f.write("\nBODYEOF\n")
                  print(f"⚠️  Regressions detected:\n" + "\n".join(regressions))
              else:
                  f.write("regressed=false\n")
                  print(f"✓ No regressions. {prev_date} → {new_date}")
          PYEOF

      # Did the script change anything? (It always should — appending a
      # row — but guard against the no-op case.)
      - name: Detect changed files
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git diff --name-only)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Open a PR with the SCORECARD update. [skip ci] in the commit body
      # tells the site-update-deploy workflow not to push a fresh build —
      # SCORECARD is a tracking artifact, not site content.
      - name: Create Pull Request
        id: cpr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            chore: weekly PageSpeed Insights check

            [skip ci]
          title: 'chore: weekly PageSpeed Insights check'
          body: |
            Automated weekly run of `tools/check_pagespeed.py` against
            https://csoh.org/ (mobile + desktop).

            One-line append to `seo-audits/SCORECARD.md`. Safe to auto-merge.
          branch: pagespeed-weekly-check
          delete-branch: true
          labels: automated, seo

      # Approve our own PR with the second identity (CSOH_PAT). Required
      # because GitHub blocks self-approval AND the auto-merge feature
      # doesn't honor the App's ruleset bypass for the approval rule.
      - name: Auto approve
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.CSOH_PAT }}

      # Enable auto-merge. The diff is a single-line SCORECARD append; safe
      # to merge once status checks pass. No file-allowlist gate needed —
      # check_pagespeed.py only touches SCORECARD.md.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # If any score regressed, open a tracking issue so it doesn't slip
      # past in the PR firehose. Pin to the App token so the issue is
      # tagged to csoh-ci, not to a person.
      #
      # Body is piped via stdin (`--body-file -`) rather than inlined via
      # `--body "${{ ... }}"`, because the body contains markdown table
      # rows with `|` characters that the shell would interpret as pipes
      # if expanded into the command line.
      - name: Open regression issue
        if: steps.regression.outputs.regressed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_BODY: ${{ steps.regression.outputs.body }}
        run: |
          printf '%s' "$ISSUE_BODY" | gh issue create \
            --repo "${{ github.repository }}" \
            --title "PageSpeed regression detected on $(date -u +%Y-%m-%d)" \
            --label "seo,regression,automated" \
            --body-file -
