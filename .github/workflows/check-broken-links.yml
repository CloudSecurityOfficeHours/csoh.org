# =============================================================================
# Check Broken Links
# -----------------------------------------------------------------------------
# Crawls every link in our published content - the root pages plus the
# breaches/, meetings/, portfolio/, and homelab/ subfolders, and the published
# Terraform under infra/terraform/ (using lychee) - and reports any that 404,
# DNS-fail, or otherwise rot. Runs on PRs that touch HTML or Terraform, weekly
# to catch external link rot, and on demand. Posts a comment on PRs when
# problems are found, but does not fail on a broken link - link rot is
# everywhere and shouldn't block merges.
#
# It DOES fail when the crawl itself did not happen. See the "Assert the crawl
# actually ran" step: an unparseable .lychee.toml kept this job green for
# eleven weeks while it checked zero URLs, because "no report" and "clean
# report" were indistinguishable to everything downstream.
#
# On the weekly cron (and manual runs) there is no PR to comment on, and
# because the job does not fail on rot, findings used to land in an artifact
# nobody opened - the run stayed green and the rot stayed live. Those runs now
# maintain a sticky tracking issue instead (same pattern as the staleness
# checkers), which auto-closes once a crawl comes back clean.
# =============================================================================

# This whole file is a "workflow": a set of automated steps that GitHub runs
# for us on its own computers (called "runners") whenever a trigger fires.
# It lives under .github/workflows/, which is the only place GitHub looks for
# these files. The structure is always: a name, the triggers ("on:"), some
# settings, then one or more "jobs", each made of ordered "steps".

# `name:` is just the human-friendly label shown in the repo's "Actions" tab.
name: Check Broken Links

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Runs on PRs that touch HTML, on a weekly timer, or on demand.
# -----------------------------------------------------------------------------
# `on:` lists the events that start this workflow. Any one of them triggers it;
# they are alternatives, not requirements.
on:
  # Validate links on any PR that touches an HTML file.
  # A "PR" (pull request) is a proposed code change someone wants to merge.
  # `paths:` narrows the trigger so this only runs when the change touches a
  # matching file - no point re-crawling links if only CSS changed.
  pull_request:
    # `**.html` is a glob: `**` matches any folders/subfolders, so this means
    # "any file ending in .html, anywhere in the repo."
    #
    # `**.tf` is here because the Terraform under infra/terraform/ is PUBLISHED
    # (tools/site-publish.filter excludes *.py/*.md/*.sh but nothing excludes
    # *.tf), and 65% of its lines are teaching prose. A single `*` would not
    # do: GitHub's `*` does not match `/`, so `*.tf` would mean root-level
    # only and every file under infra/terraform/<cloud>/ would be skipped.
    # Same trap as the `**.html` one documented in CLAUDE.md.
    paths:
      - '**.html'
      - '**.tf'
  # Weekly external-link recheck - Mondays at 06:00 UTC. External sites die
  # on their own schedule; this catches it without us having to think about it.
  # `schedule:` runs the workflow on a timer instead of in response to a push.
  schedule:
    # A "cron" expression is five fields - minute, hour, day-of-month, month,
    # day-of-week - that define a repeating schedule. A `*` means "every".
    # `0 6 * * 1` = minute 0, hour 6, any day, any month, weekday 1 (Monday),
    # i.e. 06:00 UTC every Monday. (GitHub cron is always in UTC.)
    - cron: '0 6 * * 1'    # min hour day-of-month month day-of-week
  # `workflow_dispatch:` adds a "Run workflow" button in the Actions tab so a
  # human can kick it off on demand, without waiting for a PR or the weekly timer.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read the repo files; write PR comments. Never modifies code.
# -----------------------------------------------------------------------------
# `permissions:` controls what the automatic per-run credential (the
# GITHUB_TOKEN) is allowed to do against THIS repo. Best practice is to grant
# the least access needed: read the files, write PR comments, nothing more.
# This workflow never modifies code.
permissions:
  # Allow reading repository contents (needed to fetch the HTML to scan).
  contents: read
  # Allow writing to pull requests (needed to post the broken-links comment).
  pull-requests: write
  # Allow managing issues (needed for the sticky tracking issue that surfaces
  # findings from the weekly cron, where there is no PR to comment on).
  issues: write


# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# Per-ref lock so a new push to the same PR cancels the in-flight crawl.
# Different PRs crawl in parallel.
# -----------------------------------------------------------------------------
# `concurrency:` lets at most one run exist per named "group" at a time. This
# crawl is read-only, so cancelling an in-flight run mid-crawl is safe.
concurrency:
  # The group name. `${{ ... }}` is GitHub's expression syntax - it gets
  # replaced at runtime with a real value. `github.ref` is the branch/PR
  # being built, so each PR gets its own group and they don't cancel each
  # other; only repeated pushes to the SAME PR collide.
  group: check-broken-links-${{ github.ref }}
  # When a new run joins a group that's already running, cancel the old one.
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: crawl the links, save the report as an artifact, then comment on
# the PR if any links are broken.
# -----------------------------------------------------------------------------
# `jobs:` holds the actual work. Each job runs on its own fresh machine and,
# unless you say otherwise, jobs run in parallel. This workflow has one job.
jobs:
  # `check-links` is our chosen ID for this job (any unique name works).
  check-links:
    # `runs-on:` picks the runner OS. `ubuntu-latest` is a clean, throwaway
    # Linux virtual machine GitHub spins up just for this run, then discards.
    runs-on: ubuntu-latest

    # `steps:` are the ordered actions inside the job. Each runs top to bottom
    # on the same machine. A step either reuses a packaged action (`uses:`) or
    # runs shell commands (`run:`).
    steps:
      # The runner starts empty, so the first step copies our code onto it.
      # `uses:` runs a prebuilt, shareable action - here the official
      # `actions/checkout`. The part after `@` pins the EXACT version by its
      # commit hash (SHA) rather than a moving tag like `v7`; the `# v7.0.0`
      # comment just notes which release that hash is. Pinning to a SHA is a
      # security practice: a tag can be re-pointed at malicious code later,
      # but a specific commit can't change underneath you.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # "Caching" means saving files from one run so a later run can reuse them
      # instead of redoing slow work. Each fresh runner is empty, so without a
      # cache lychee would re-check every URL from scratch every time. Restoring
      # lychee's HTTP cache massively speeds up the crawl - lychee skips URLs it
      # already validated within the cache TTL (the max-cache-age set below).
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        # `with:` passes named inputs to the action - its settings/parameters.
        with:
          # Which folder on the runner to save and later restore.
          path: .lycheecache
          # The cache's lookup name. `github.sha` is this commit's unique ID,
          # so a fresh entry is saved per commit. On a later run, an exact
          # match for this key is loaded first if it exists.
          key: cache-lychee-${{ github.sha }}
          # If no exact key match (e.g. brand-new commit), fall back to the
          # newest cache whose name STARTS WITH this prefix - so we still reuse
          # a recent crawl instead of starting cold.
          restore-keys: cache-lychee-                   # fall back to any cache

      # Run the actual link checker. Lychee is a fast, parallel link crawler.
      # We pass it a `.lychee.toml` config in the repo root for things like
      # ignore-lists, retry rules, and headers.
      - name: Check for broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # `>-` is YAML's "fold this multi-line string into one line."
          # CLI flags below: --config points lychee at .lychee.toml (its
          # exclude-list of bot-blocking hosts, accepted status codes, and
          # timeouts); --cache reuses the cache restored above;
          # --max-cache-age 3d treats results <3 days old as still good;
          # --verbose prints per-URL detail; --no-progress silences the live
          # progress bar (noise in CI logs); --max-concurrency 20 hits servers
          # in parallel (be polite); --glob-ignore-case so we catch
          # HTML/Html/HTM equally.
          # The globs cover every published page: the root pages plus the
          # breaches/, meetings/, portfolio/, and homelab/ subfolders (all
          # flat). The tooling template tools/og/template.html has no real
          # links, so it's deliberately left out.
          #
          # The last glob covers the published Terraform. Those .tf files ship
          # to the origins like any page, and they are deliberately
          # comment-heavy teaching material (~65% comments, ~3,100 lines of
          # prose) - so until this was added, the only prose on the site that
          # no gate ever read was the prose written to be read. lychee treats
          # an unknown extension as plaintext and extracts URLs from it, so no
          # extra tooling is needed. The URL-shaped strings in HCL that are
          # identifiers rather than destinations (CSP allowlist hosts, the OIDC
          # issuer, placeholder examples) are anchored out in .lychee.toml.
          args: >-
            --config .lychee.toml
            --cache
            --max-cache-age 3d
            --verbose
            --no-progress
            --max-concurrency 20
            --glob-ignore-case
            './*.html'
            './breaches/*.html'
            './meetings/*.html'
            './portfolio/*.html'
            './homelab/*.html'
            './infra/terraform/*/*.tf'
          # Write the crawl results to this file (path relative to the repo).
          output: ./lychee-report.md
          # Produce that report as Markdown so it renders nicely in a PR comment.
          format: markdown
          # By default this action would "fail" (turn the job red) on a broken
          # link. We force false so a dead link never blocks a merge.
          fail: false                                   # never fail the job - see header

      # -----------------------------------------------------------------------
      # Did the crawl actually happen?
      # -----------------------------------------------------------------------
      # This job is built never to fail on a broken LINK - link rot is everyone
      # else's fault and shouldn't block a merge. But that tolerance used to
      # extend to the crawler itself failing, and those are not the same thing.
      #
      # Worked example, and the reason this step exists. On 2026-05-29 a triage
      # commit added seven exclude entries written `"news\.ycombinator\.com"`.
      # In TOML, `\.` inside a double-quoted string is an invalid escape, so
      # lychee could not parse .lychee.toml and exited before crawling
      # anything. It wrote no report. The `[Errors]` grep below found no
      # `[Errors]` in a file that did not exist, so `has_errors` came out
      # `false`; the sticky-issue step read the same absent report as a clean
      # crawl and posted "The latest link crawl found no broken links."
      # The job was green every week for eleven weeks while checking zero URLs.
      #
      # So: assert the crawl produced a real report that counted a real number
      # of links. This catches a config parse error, a lychee crash, and a glob
      # that silently matches nothing. It is deliberately the one condition in
      # this workflow that DOES fail the job - a checker that isn't running is
      # a broken checker, not a broken link.
      - name: Assert the crawl actually ran
        run: |
          if [ ! -f ./lychee-report.md ]; then
            echo "::error::lychee produced no report - it failed before crawling."
            echo "Check the 'Check for broken links' step above; a .lychee.toml"
            echo "parse error exits lychee before it reads any input."
            exit 1
          fi
          # Every real lychee markdown report opens with a Summary table
          # carrying a "Total" row. Pull the count out of it: the row looks
          # like `| 🔍 Total       | 546   |`, so take the last numeric field.
          total=$(grep -m1 'Total' ./lychee-report.md | grep -oE '[0-9]+' | tail -1)
          if [ -z "$total" ]; then
            echo "::error::lychee report has no Summary/Total row - malformed report."
            echo "--- report ---"; cat ./lychee-report.md; exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "::error::lychee checked 0 links - the input globs matched nothing."
            exit 1
          fi
          echo "lychee checked $total links. Crawl ran."

      # An "artifact" is a file the workflow saves and attaches to the run so
      # reviewers can download the full crawl afterward from the Actions page.
      # The runner itself is destroyed when the job ends, so this is how files
      # outlive the run.
      - name: Upload link check report
        # `if:` decides whether a step runs. By default a step is skipped once
        # an earlier step failed; `always()` forces this one to run regardless,
        # so we still keep the report even if something upstream broke.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Label the downloadable artifact will show under on the run page.
          name: broken-links-report
          # The file (or folder) to upload.
          path: ./lychee-report.md
          # GitHub auto-deletes the artifact after this many days to save space.
          retention-days: 30
          # If the file is missing, just warn instead of failing the step.
          if-no-files-found: warn

      # On non-PR runs (the weekly cron, a manual dispatch) there is no PR to
      # comment on, so surface findings as a sticky tracking issue instead -
      # otherwise the crawl's whole point is defeated: the job never fails, so
      # a green run with an unread artifact is indistinguishable from a clean
      # one. The shared composite action (.github/actions/sticky-issue, also
      # used by the staleness checkers) opens/updates the issue while the
      # report contains lychee's `[Errors]` section and auto-closes it once a
      # crawl comes back clean.
      - name: Open, update, or close tracking issue (non-PR runs)
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/sticky-issue
        with:
          # GITHUB_TOKEN is the automatic per-run credential; the `issues:
          # write` permission above is what lets it manage the issue.
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Broken links: the latest crawl found failures"
          label: broken-links
          label-description: Auto-generated reports from check-broken-links.yml
          report-file: ./lychee-report.md
          # lychee prints an `[Errors]` section header only when something is
          # broken; its absence means a clean crawl. (Matched literally, not
          # as a regex - the action uses grep -F.)
          stale-marker: '[Errors]'
          footer: >-
            _This issue auto-closes once a scheduled crawl comes back clean.
            Triage guide: NXDOMAIN on two resolvers = genuinely dead, fix the
            link; 403/429 = bot-blocked, exclude it in .lychee.toml._
          # A non-empty close-comment enables auto-close on a clean report.
          close-comment: The latest link crawl found no broken links.

      # Quick scan: did lychee find errors? Sets a step output we use below.
      # `[Errors]` is the section header lychee prints when something is broken.
      - name: Check for broken links in report
        # `id:` gives this step a handle so later steps can read its outputs
        # via `steps.report.outputs.<name>`.
        id: report
        # `github.event_name` is the trigger that started this run. Only do the
        # comment dance on pull requests - there's no PR to comment on when this
        # runs from the weekly schedule or a manual click.
        if: github.event_name == 'pull_request'
        # `run:` executes shell commands on the runner (default shell: bash).
        # The `|` keeps this as a multi-line block, run line by line.
        run: |
          # If the report file exists AND contains an `[Errors]` section
          # (`grep -q` = quiet, just succeed/fail; `-E` = extended regex;
          # the `\[ \]` escape the literal square brackets)...
          if [ -f ./lychee-report.md ] && grep -qE '\[Errors\]' ./lychee-report.md; then
            # ...record that we found errors. Appending `name=value` to the
            # special file named by $GITHUB_OUTPUT is how a step publishes an
            # output that other steps can read.
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            # Otherwise record that the report was clean.
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      # If we found errors AND we're on a PR, post a summary comment.
      # This reads the `has_errors` output set just above; the step is skipped
      # entirely when the report was clean or we're not on a PR.
      - name: Comment on PR with broken links
        if: steps.report.outputs.has_errors == 'true' && github.event_name == 'pull_request'
        # `github-script` lets us run JavaScript with a ready-to-use, already
        # authenticated GitHub API client (`github`) and run context info
        # (`context`) - handy for small API calls without writing a full action.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # The JS to run is passed as the `script:` input below. NOTE: lines
          # inside this block are literal JavaScript, so any comments here use
          # `//` (JS style), not `#` - a `#` would be a JS syntax error.
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('./lychee-report.md', 'utf8');
            } catch (e) {
              report = 'Error reading link check report';
            }

            // PR comments have a 65,536-char hard limit. Truncate at 60k to
            // leave headroom for the wrapper formatting we add below.
            if (report.length > 60000) {
              report = report.substring(0, 60000) + '\n\n...(truncated, see artifacts for full report)';
            }

            let comment = `## :warning: Broken Links Detected\n\n`;
            comment += report;
            comment += `\n\n---\nFull report available in workflow artifacts.`;

            // Post the comment on the PR.
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
