# =============================================================================
# Check Reading List Staleness
# -----------------------------------------------------------------------------
# Once a month, walks every podcast / blog / newsletter / YouTube channel on
# cloud-security-reading-list.html, discovers its RSS or Atom feed, and flags
# anything whose newest post is older than the threshold. The reading list is
# hand-curated and opinionated, so this workflow NEVER edits the page - it
# only opens (or updates) a tracking issue with the report. A human decides
# whether to drop, replace, or keep each entry.
#
# Broken-link detection for the same page is already covered by the weekly
# check-broken-links.yml workflow; this one only looks at "is the source
# still publishing?" - which dead-link checks can't see.
# =============================================================================

# A GitHub Actions "workflow" is an automated job defined in YAML and stored
# under .github/workflows/. GitHub watches for the events listed below and,
# when one fires, spins up a fresh virtual machine (a "runner") to execute the
# steps. Nothing here runs on our servers - it all runs on GitHub's machines.
# This `name:` is the human-friendly label shown in the repo's Actions tab.
name: Check Reading List Staleness

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Runs on a monthly timer, on demand, or when the checker/workflow itself edits.
# -----------------------------------------------------------------------------
# `on:` lists the events that trigger this workflow. Any one of them is enough
# to start a run; they are alternatives, not requirements.
on:
  # First of the month, 07:00 UTC. Monthly is plenty - most blogs go quiet
  # over weeks, not days, and we don't want a noisy report nagging us.
  # `schedule:` runs the workflow on a timer using cron syntax. A cron string
  # has five space-separated fields (see the trailing comment for their order).
  # Decoded, '0 7 1 * *' means: at minute 0 of hour 7, on day-of-month 1, in
  # every month, on any day-of-week - i.e. 07:00 UTC on the 1st of each month.
  # An asterisk (*) means "every value" for that field. Times are always UTC.
  schedule:
    - cron: '0 7 1 * *'    # min hour day-of-month month day-of-week
  # `workflow_dispatch:` adds a "Run workflow" button on the Actions tab so a
  # human can launch this on demand without waiting for the schedule.
  workflow_dispatch:
  # `push:` fires when commits land on the branch(es) listed below. The
  # `paths:` filter narrows that further: only pushes that touch one of the
  # listed files start a run, so unrelated commits don't waste a run.
  # Re-run only when the checker script or this workflow file changes - those
  # alter HOW staleness is computed, so the issue should refresh right away.
  # Editing cloud-security-reading-list.html does NOT re-trigger here: that
  # would run the ~45s, ~29-feed checker on every content edit, and the glossary
  # / crosslink tooling touches these pages often. Entries added to or removed
  # from the page are instead picked up by the next monthly run (the schedule
  # above) or an on-demand "Run workflow" dispatch.
  push:
    branches:
      - main
    paths:
      - 'tools/check_reading_list_staleness.py'
      - '.github/workflows/check-reading-list-staleness.yml'

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read the repo files; write Issues (to open/update the tracking issue).
# -----------------------------------------------------------------------------
# `permissions:` sets what the automatic per-run token (GITHUB_TOKEN) is
# allowed to do. It's a least-privilege control: grant only what the job needs
# so a bug or a malicious dependency can't do more damage. Anything not listed
# defaults to no access. Here we can read repo contents and write issues so we
# can post / update the report - and nothing else (no pushing code, no
# releases, etc.). We never modify source files in this workflow.
permissions:
  # `contents: read` lets the run read repo files (needed to check them out)
  # but not push commits, tags, or releases.
  contents: read
  # `issues: write` lets the run create and edit Issues - which is how the
  # last step manages the single sticky staleness tracking issue.
  issues: write

# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# One global lock so two staleness runs never race on the same tracking issue.
# -----------------------------------------------------------------------------
# `concurrency:` prevents overlapping runs. Runs that share the same `group:`
# string are serialized; with `cancel-in-progress: true`, starting a new one
# cancels whichever is already running. The group name here is a fixed string
# (not one keyed on the branch/ref), so this whole workflow allows only one run
# at a time across the repo - overlapping runs can't both edit the shared issue
# and clobber each other. This crawl is read-only, so interrupting a run is safe.
concurrency:
  # A constant group name means every run of this workflow shares one lock.
  group: check-reading-list-staleness
  # If a newer run starts, cancel the older in-progress one. A staleness report
  # is a read-only computation, so interrupting a stale run is safe.
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: compute the report, save it as an artifact, then open/update the
# tracking issue with the findings.
# -----------------------------------------------------------------------------
# `jobs:` holds one or more jobs. A "job" is a set of steps that run together
# on a single fresh runner. Separate jobs run in parallel by default and on
# different machines. This workflow has just one job, so there's nothing to
# coordinate (no `needs:` to chain jobs, no matrix to fan out).
jobs:
  # This is the job's internal id (`check-staleness`). It's referenced in logs
  # and could be referenced by other jobs; the name is otherwise arbitrary.
  check-staleness:
    # `runs-on:` picks the runner OS/image. `ubuntu-latest` is GitHub's
    # standard hosted Linux VM - created clean for this run and thrown away
    # afterward, so nothing persists between runs except what we cache or save.
    runs-on: ubuntu-latest
    # Cap the run. The GitHub default is 360 minutes, so a job that
    # hangs on a network call burns six hours and, where it holds a
    # concurrency lock, blocks everything queued behind it for the same
    # six. Sized to the work, not to the worst case imaginable.
    timeout-minutes: 15

    # `steps:` are the ordered actions inside the job. Each step is either a
    # `uses:` (run a prebuilt, shareable action) or a `run:` (run shell
    # commands). Steps execute top to bottom on the same runner, sharing its
    # filesystem, so a file written by one step is visible to the next.
    steps:
      # `uses:` runs a published action - reusable, packaged automation from
      # the GitHub Marketplace or another repo. This first one, actions/checkout,
      # clones THIS repository onto the runner; without it the runner starts
      # empty and our files wouldn't be here. The `@<40-hex-chars>` pins the
      # action to one exact commit SHA (the `# v7.0.0` notes which release that
      # is). Pinning to a SHA - rather than a moving tag like `@v6` - is a
      # supply-chain safeguard: the code can't change underneath us even if the
      # tag is later repointed at something malicious.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Installs Python on the runner and puts it on the PATH so the next step
      # can call `python3`. `with:` passes inputs (named settings) to a `uses:`
      # action - think of them as the action's function arguments. Here the one
      # input is `python-version: '3.x'`, meaning "any latest Python 3.x."
      # The checker is a Python script using stdlib only - no pip install.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      # `run:` (instead of `uses:`) executes shell commands directly on the
      # runner - here, one line invoking our Python script. The script reads
      # cloud-security-reading-list.html, looks up each source's feed, and
      # writes its findings to the file named by `--output`. In shell, a
      # command's "exit code" signals success (0) or failure (non-zero); a step
      # is considered failed only if its command exits non-zero. This script
      # deliberately exits 0 even when entries are stale (it writes the markdown
      # report to staleness.md), so a stale finding does not turn the run red -
      # this is a report, not a gate. If the script itself crashes it does exit
      # non-zero, so the step fails and we notice via the normal
      # workflow-failure path.
      - name: Run staleness check
        run: python3 tools/check_reading_list_staleness.py --output staleness.md

      # An "artifact" is a file (or folder) saved from the run and attached to
      # the run's summary page, so you can download it afterward. The runner
      # itself is deleted when the run ends, so uploading is how anything
      # leaves the machine. `if:` gates whether a step runs; by default a step
      # is skipped once an earlier step has failed. `if: always()` overrides
      # that so we still capture the report even if a later step errors.
      # Inside `with:`: `name` is the download label, `path` is what to upload,
      # `retention-days` is how long GitHub keeps it (90 here), and
      # `if-no-files-found: warn` logs a warning instead of failing if the file
      # is missing.
      # Upload the report as an artifact so reviewers can grab it from the
      # run page even if the issue-update step fails for any reason.
      - name: Upload staleness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reading-list-staleness-report
          path: staleness.md
          retention-days: 90
          if-no-files-found: warn

      # Sticky issue: if an open issue with this exact title exists, replace
      # its body. Otherwise create one. The label gives a stable handle for
      # filtering and for future automation. We use the auto-injected
      # GITHUB_TOKEN - issues:write was granted above and that's all we need.
      #
      # The open/update mechanics live in the shared composite action
      # `.github/actions/sticky-issue` (see check-meeting-staleness.yml for
      # the fuller note on why). Two inputs make this workflow's semantics
      # different from its siblings: `always-stale: 'true'` refreshes the
      # issue on every monthly run regardless of report content (this is a
      # recurring checklist, not a pass/fail gate), and the ABSENCE of a
      # close-comment means the action never auto-closes it - the reading
      # list is hand-curated, so a human decides when the checklist is done.
      - name: Open or update tracking issue
        uses: ./.github/actions/sticky-issue
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Reading list: monthly staleness report"
          label: reading-list-staleness
          label-description: Auto-generated reports from check-reading-list-staleness.yml
          report-file: staleness.md
          always-stale: 'true'
          # `|` is YAML's literal block: the footer keeps these line breaks.
          footer: |
            _The reading list is hand-curated. This issue is a checklist, not a queue -
            close it when you've decided which (if any) entries to act on; the next
            monthly run will reopen / refresh it as needed._
