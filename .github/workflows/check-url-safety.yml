# =============================================================================
# Check URL Safety
# -----------------------------------------------------------------------------
# Scans every external link in the site's HTML files against safety lists
# (malware databases, known-bad domains, etc.). Stops a PR from merging if any
# link points somewhere unsafe and posts a summary comment so the contributor
# knows what to remove.
# =============================================================================

# A "workflow" is one automated process GitHub Actions runs for this repo.
# `name:` is just the human-readable label shown in the repo's Actions tab.
name: Check URL Safety

# `on:` lists the events ("triggers") that start this workflow. Any one of
# the events below is enough to launch a fresh run.
on:
  # Run on PRs that touch HTML - that's where new URLs get introduced.
  pull_request:
    paths:
      - '**.html'
  # Weekly recheck (Mondays at 06:30 UTC) catches domains that turn malicious
  # AFTER they were originally safe to link.
  schedule:
    # A cron string has five fields. This one - minute 30, hour 6, any
    # day-of-month, any month, weekday 1 (Monday) - means "06:30 UTC every
    # Monday". GitHub cron always runs on UTC, never your local time zone.
    - cron: '30 6 * * 1'   # min hour day-of-month month day-of-week
  # `workflow_dispatch` adds a "Run workflow" button in the Actions tab so a
  # human can launch a run on demand, without waiting for a PR or the weekly
  # schedule.
  workflow_dispatch:

# Every run gets an automatic, short-lived credential called GITHUB_TOKEN.
# `permissions:` sets exactly what that token is allowed to do - least
# privilege, so a bug or bad dependency can't do more than intended.
# `contents: read` = read repo files. `pull-requests: write` = post comments.
# This workflow never modifies the codebase, so write access to contents is
# deliberately withheld.
permissions:
  contents: read
  pull-requests: write


# `${{ ... }}` is GitHub Actions' expression syntax: at run time it gets
# replaced with a real value. `github.ref` here is the branch/tag being built,
# so each branch gets its own concurrency group (its own "lane") and PRs on
# different branches still run in parallel; only a new push to the SAME PR
# cancels its old run. That cancellation is safe because this check is read-only.
concurrency:
  group: check-url-safety-${{ github.ref }}
  cancel-in-progress: true

# `jobs:` holds the actual work. A workflow has one or more jobs; jobs run on
# separate fresh machines and (unless told otherwise) run in parallel.
jobs:
  # `check-urls` is this job's internal id. A job is an ordered list of steps
  # that all run on the same machine, sharing its files and environment.
  check-urls:
    # `runs-on` picks the runner (the throwaway VM GitHub spins up for the
    # job). `ubuntu-latest` is GitHub's current Ubuntu Linux image.
    runs-on: ubuntu-latest
    # Hard cap so a hung HTTP request can't burn the 6-hour job budget.
    timeout-minutes: 15

    # `steps:` is the to-do list, run top to bottom. Each step either pulls in
    # a prebuilt action with `uses:` or runs shell commands with `run:`.
    steps:
      # Pull the code so we can read HTML files.
      # `uses:` runs a reusable action published on GitHub. The part after `@`
      # pins the EXACT commit (a SHA hash) instead of a moving tag like `v6`,
      # so a hijacked or retagged release can't silently change what runs here;
      # the trailing comment just notes which human-friendly version that is.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Install Python - the safety check is a Python script.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        # `with:` passes named inputs (settings) into the action above - like
        # arguments to a function. This action reads `python-version`.
        with:
          python-version: '3.x'   # any Python 3 - script is version-tolerant

      # Run the actual scanner. Pipes stdout+stderr into a report file.
      # `|| true` keeps this step from failing on the script's nonzero exit;
      # we want to inspect the report and decide ourselves whether to fail.
      - name: Run URL safety check
        run: |
          python3 tools/check_all_site_urls.py > site-wide-url-safety-report.txt 2>&1 || true
          cat site-wide-url-safety-report.txt
          # If the report contains the string "❌ UNSAFE", the script flagged
          # at least one bad URL - fail the workflow with a GH-Actions error.
          if grep -q "❌ UNSAFE" site-wide-url-safety-report.txt; then
            # `::error::` is a GitHub log command - this text shows up as a red
            # error annotation on the run. `exit 1` (nonzero) is what actually
            # marks the step - and thus the whole run - as failed.
            echo "::error::Unsafe URLs detected in HTML files"
            exit 1
          fi

      # An "artifact" is a file the run saves so a reviewer can download it
      # afterward from the run's summary page. The runner itself is wiped when
      # the job ends, so this is how a file outlives the run.
      # Normally a step is skipped once an earlier step has failed.
      # `if: always()` = upload even if the script failed (the report still
      # exists and is what we need to debug).
      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `name` is the label of the downloadable bundle; `path` is the file
          # to put in it.
          name: site-wide-url-safety-report
          path: site-wide-url-safety-report.txt
          # Auto-delete the artifact after 30 days so storage doesn't pile up.
          retention-days: 30
          # If the file is missing, just warn instead of failing the step.
          if-no-files-found: warn

      # `if:` decides whether this step runs at all. `failure()` is true only
      # when an earlier step failed, and `github.event_name` is what triggered
      # the run - so this posts a summary comment only on a failed PR run (not
      # on the weekly schedule, where there's no PR to comment on).
      - name: Comment on PR with results
        if: failure() && github.event_name == 'pull_request'
        # `github-script` lets you write a little JavaScript inline (below)
        # instead of pulling in a whole separate action just to call the API.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # JS that runs in a Node sandbox the action provides. `github`,
          # `context`, etc. are pre-bound helpers for the GH API.
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('site-wide-url-safety-report.txt', 'utf8');
            } catch (e) {
              report = 'Error reading safety report';
            }

            // Pull just the summary block from the report - full report can
            // be hundreds of lines and we want a readable PR comment.
            const summaryMatch = report.match(/SUMMARY[\s\S]*?={50,}/);
            const summary = summaryMatch ? summaryMatch[0] : 'See full report in artifacts';

            // Extract the count from the report header for a punchy first line.
            const unsafeMatch = report.match(/❌ UNSAFE URLS \((\d+)\):/);
            const unsafeCount = unsafeMatch ? unsafeMatch[1] : '0';

            let comment = `## ⚠️ URL Safety Check Failed\n\n`;
            comment += `Found **${unsafeCount} unsafe URL(s)** in HTML files\n\n`;
            comment += `\`\`\`\n${summary}\n\`\`\`\n\n`;
            comment += `Please review the URLs and remove any unsafe entries.\n\n`;
            comment += `Full report is available in the workflow artifacts.`;

            // Post the comment on the PR.
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
