# =============================================================================
# Check URL Safety
# -----------------------------------------------------------------------------
# Scans every external link in the site's HTML files with
# tools/check_all_site_urls.py, which applies the heuristics in
# tools/check_url_safety.py. This is static analysis, NOT a threat-intel
# lookup - there is no malware database or reputation API behind it. What it
# actually checks:
#
#   - structural red flags: an `@` in the URL, a raw-IP host, an executable
#     file extension, excessive-dash obfuscation
#   - throwaway TLDs (.tk / .ml / .ga / .cf / .gq)
#   - brand-impersonation and account-panic phrasing in the path
#   - URL-shortener / redirector domains (bit.ly, t.co, …), which hide the
#     real destination from review
#   - redirect resolution, so the FINAL destination is what gets judged
#   - a small hand-maintained BLOCKLIST in check_url_safety.py
#
# That catches the realistic failure mode here - someone pastes a link from
# Zoom chat that turns out to be a shortener or a lookalike domain - without
# taking a dependency on an external reputation service. It will not catch a
# freshly-compromised legitimate domain; nothing static would.
#
# Stops a PR from merging if any link trips a check, and posts a summary
# comment so the contributor knows what to remove.
# =============================================================================

# This whole file is a "workflow": a GitHub Actions automation that runs in
# response to events in the repo (a PR, a timer, a button click). GitHub reads
# it because it lives under .github/workflows/ and ends in .yml. `name:` is
# just the human-friendly label shown in the repo's Actions tab.
name: Check URL Safety

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Runs on HTML-touching PRs, a weekly timer, or on demand.
# -----------------------------------------------------------------------------
# `on:` lists the events ("triggers") that start this workflow. Any one of the
# events below is enough to launch a fresh run; they are alternatives, not
# requirements.
on:
  # `pull_request` fires when someone opens or updates a PR.
  #
  # THERE IS DELIBERATELY NO `paths:` FILTER HERE. This job is a REQUIRED STATUS
  # CHECK on `main`, and a required check is only satisfied by a check run that
  # actually reports. A workflow filtered out by `paths:` never starts and so
  # produces no check run, leaving the pull request blocked forever waiting on a
  # result that cannot arrive - which would hang every PR touching only Python,
  # YAML, or docs.
  #
  # The filtering moved into the "Detect HTML changes" step below, which decides
  # whether this PR touches any .html and gates the scan on the answer. A
  # non-HTML PR still gets a green `check-urls` check, quickly, having scanned
  # nothing.
  #
  # The `push:` trigger below keeps its `paths:` filter; nothing depends on a
  # push producing a check run.
  pull_request:
  # `push` on main, same path filter. Without this the scan had never once run
  # on the event that actually publishes: every run in this workflow's history
  # was a pull_request or the weekly cron. That left a real gap, because the
  # repo owner and the csoh-ci App are both on the Main ruleset's bypass list,
  # so HTML reaches production by direct push routinely - as it did throughout
  # the 2026-07-25/26 remediation. A URL-safety scan that only ever sees PRs
  # does not cover the path most content takes to the live site.
  #
  # This does not block the deploy (it is a separate workflow), so treat it as
  # detection rather than prevention: it runs alongside the deploy and reports.
  # Making it blocking would mean adding it to the Main ruleset's required
  # status checks.
  push:
    branches: [main]
    paths:
      - '**.html'
  # `schedule` runs the workflow on a timer using cron syntax. This weekly
  # recheck catches domains that turn malicious AFTER they were originally
  # safe to link.
  schedule:
    # A cron string has five fields: minute, hour, day-of-month, month,
    # day-of-week (`*` means "every"). This one - minute 30, hour 6, any
    # day-of-month, any month, weekday 1 (Monday) - means "06:30 UTC every
    # Monday". GitHub cron always runs on UTC, never your local time zone.
    - cron: '30 6 * * 1'   # min hour day-of-month month day-of-week
  # `workflow_dispatch` adds a "Run workflow" button in the Actions tab so a
  # human can launch a run on demand, without waiting for a PR or the weekly
  # schedule.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read repo files; write PR comments. Never modifies the codebase.
# -----------------------------------------------------------------------------
# Every run gets an automatic, short-lived credential called GITHUB_TOKEN.
# `permissions:` sets exactly what that token is allowed to do - least
# privilege, so a bug or bad dependency can't do more than intended.
permissions:
  # `contents: read` lets the run read repo files (needed to check them out).
  # This workflow never modifies the codebase, so write access to contents is
  # deliberately withheld.
  contents: read
  # `pull-requests: write` lets the last step post a summary comment on the PR.
  pull-requests: write


# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# Per-ref lock so a new push to the same PR cancels its in-flight run.
# -----------------------------------------------------------------------------
# `concurrency:` lets at most one run hold a named "group" at a time. Runs in
# the same group queue up or cancel each other; runs in different groups are
# unaffected and proceed in parallel.
concurrency:
  # `${{ ... }}` is GitHub Actions' expression syntax: at run time it gets
  # replaced with a real value. `github.ref` is the branch/PR being built, so
  # each branch gets its own group (its own "lane") and PRs on different
  # branches still run in parallel; only a new push to the SAME PR cancels its
  # old run.
  group: check-url-safety-${{ github.ref }}
  # When a newer run claims the group, cancel the older in-progress one. That
  # cancellation is safe because this check is read-only.
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: scan URLs, fail on any unsafe hit, save the report, comment on PRs.
# -----------------------------------------------------------------------------
# `jobs:` holds the actual work. A workflow has one or more jobs; jobs run on
# separate fresh machines and (unless told otherwise) run in parallel.
jobs:
  # `check-urls` is this job's internal id. A job is an ordered list of steps
  # that all run on the same machine, sharing its files and environment.
  check-urls:
    # `runs-on` picks the runner (the throwaway VM GitHub spins up for the
    # job). `ubuntu-latest` is GitHub's current Ubuntu Linux image.
    runs-on: ubuntu-latest
    # `timeout-minutes` is a hard cap on the whole job: if a hung HTTP request
    # stalls the scan, GitHub kills the job at 15 minutes instead of letting it
    # burn the default 6-hour budget.
    timeout-minutes: 15

    # `steps:` is the to-do list, run top to bottom on the same VM. Each step
    # either pulls in a prebuilt action with `uses:` or runs shell commands
    # with `run:`.
    steps:
      # Step 1 - Pull the repo's code onto the runner so later steps can read
      # the HTML files; without this the VM starts empty.
      # `uses:` runs a reusable action published on GitHub. The part after `@`
      # pins the EXACT commit (a 40-hex SHA) instead of a moving tag like `v7`,
      # so a hijacked or retagged release can't silently change what runs here;
      # the trailing "# v7.0.0" comment just notes the human-friendly version
      # that SHA corresponds to.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The next step diffs this PR against its base commit, which needs
          # both commits present; checkout defaults to a depth of 1.
          fetch-depth: 0

      # Decide whether this run has any HTML to scan.
      #
      # The `pull_request` trigger above deliberately carries no `paths:` filter
      # (see the note there), because as a required status check this workflow
      # must always produce a check run. The path filtering lives here instead,
      # where skipping is cheap and still reports success.
      #
      # Anything that is not a pull_request - a push to main, the weekly cron, a
      # manual dispatch - scans everything. Those runs gate no merge, and a full
      # sweep is the point of the cron: a URL that was safe last week can be
      # re-registered and turn hostile without any file changing.
      - name: Detect HTML changes
        id: html
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}, not a pull request: scanning everything."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --name-only "$base"...HEAD | grep -qE '\.html$'; then
            echo "This pull request touches HTML: scanning."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .html files changed in this pull request; no URLs to scan."
            echo "This check reports success so it can serve as a required status check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 2 - Install Python on the runner so the next step's `python3`
      # command exists; the safety check is a Python script. Another SHA-pinned
      # first-party action.
      - name: Set up Python
        if: steps.html.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # `with:` passes named inputs (settings) into the action above - like
        # arguments to a function. This action reads `python-version`.
        with:
          python-version: '3.x'   # any Python 3 - script is version-tolerant

      # Step 3 - Run the actual scanner and decide pass/fail.
      # `run: |` runs a multi-line shell script on the runner.
      - name: Run URL safety check
        if: steps.html.outputs.changed == 'true'
        run: |
          # Run the scanner, redirecting BOTH stdout and stderr (`2>&1`) into
          # one report file. The step runs under `bash -e`, so a nonzero exit
          # would normally abort here; `|| rc=$?` intercepts it and stashes the
          # real exit code instead, letting us echo the report before deciding.
          rc=0
          python3 tools/check_all_site_urls.py > site-wide-url-safety-report.txt 2>&1 || rc=$?
          # Echo the report into the step log so it is visible without
          # downloading the artifact.
          cat site-wide-url-safety-report.txt
          # Gate on the scanner's OWN exit code: it returns 1 when unsafe URLs
          # are found (and stays 0 for safe / suspicious-only runs). Gating on
          # the exit code - rather than grepping report text - also fails the
          # run if the scanner itself crashes, so a bad URL can't merge or ship.
          if [ "$rc" -ne 0 ]; then
            # `::error::` is a GitHub log command - this text shows up as a red
            # error annotation on the run. `exit 1` (nonzero) is what actually
            # marks the step - and thus the whole run - as failed.
            echo "::error::Unsafe URLs detected in HTML files"
            exit 1
          fi

      # Step 4 - Stash the report as an "artifact": a file the run saves and
      # attaches to the run page so a reviewer can download it afterward. The
      # runner's disk is wiped when the job ends, so uploading is the only way
      # to keep the report. `if: always()` runs this even when an earlier step
      # failed (the report still exists and is exactly what we need to debug).
      - name: Upload safety report
        # `always()` so a FAILED scan still uploads its report, but only when a
        # scan actually ran - a skipped run produces no report to upload.
        if: always() && steps.html.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `name` is the label of the downloadable bundle; `path` is the file
          # to put in it.
          name: site-wide-url-safety-report
          path: site-wide-url-safety-report.txt
          # `retention-days` is how long GitHub keeps the artifact before
          # auto-deleting it, so storage doesn't pile up.
          retention-days: 30
          # `if-no-files-found: warn` - if the file is missing, just print a
          # warning instead of failing the step.
          if-no-files-found: warn

      # Step 5 - If the scan failed AND this run came from a PR, post a summary
      # comment so the contributor sees it without digging through logs. The
      # `if:` is a guard that runs the step only when BOTH are true: `failure()`
      # (an earlier step in this job failed) AND `github.event_name` is
      # `pull_request` (not the weekly schedule, where there's no PR to comment
      # on).
      - name: Comment on PR with results
        if: failure() && github.event_name == 'pull_request'
        # `github-script` lets you write a little JavaScript inline (below)
        # instead of pulling in a whole separate action just to call the API.
        # SHA-pinned like the other actions.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # `script:` is inline JS the action runs in a Node sandbox it
          # provides. `github`, `context`, etc. are pre-bound helpers for the
          # GitHub API.
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('site-wide-url-safety-report.txt', 'utf8');
            } catch (e) {
              report = 'Error reading safety report';
            }

            // Pull just the summary block from the report - full report can
            // be hundreds of lines and we want a readable PR comment.
            const summaryMatch = report.match(/SUMMARY[\s\S]*?={50,}/);
            const summary = summaryMatch ? summaryMatch[0] : 'See full report in artifacts';

            // Extract the count from the report's "UNSAFE URLS (N)" summary
            // header for a punchy first line. The header has no ❌ prefix and
            // no trailing colon, so match exactly what the scanner prints; the
            // uppercase "URLS" avoids matching the per-file "UNSAFE URLs:" lines.
            const unsafeMatch = report.match(/UNSAFE URLS \((\d+)\)/);
            const unsafeCount = unsafeMatch ? unsafeMatch[1] : '0';

            let comment = `## ⚠️ URL Safety Check Failed\n\n`;
            comment += `Found **${unsafeCount} unsafe URL(s)** in HTML files\n\n`;
            comment += `\`\`\`\n${summary}\n\`\`\`\n\n`;
            comment += `Please review the URLs and remove any unsafe entries.\n\n`;
            comment += `Full report is available in the workflow artifacts.`;

            // Post the comment on the PR.
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
