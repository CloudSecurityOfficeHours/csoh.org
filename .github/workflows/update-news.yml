# =============================================================================
# Update News
# -----------------------------------------------------------------------------
# Every 3 hours, pulls fresh items from the RSS/Atom feeds configured in the
# FEEDS list at the top of update_news.py (50 sources as of this writing) and
# rewrites the news.html cards + JSON-LD schema, feed.xml, and the sitemap
# lastmod dates. If anything changed, opens a PR and - only when the diff is
# confined to those news files - auto-approves and auto-merges it.
#
# The merge is a push to main touching *.html, which independently triggers
# BOTH site-update-deploy.yml (housekeeping: SRI, sitemap, previews) and
# deploy.yml (the job that actually publishes to the three origins).
# =============================================================================

# This whole file is one "workflow": a set of automated steps GitHub runs for
# us on its servers. `name` is just the human label shown in the repo's
# Actions tab and in status checks.
name: Update News

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Runs every 3 hours on a timer, on demand, or when update_news.py changes.
# -----------------------------------------------------------------------------
# `on:` lists the events that START this workflow. Any one of them is enough;
# they are independent triggers.
on:
  # `schedule` runs the workflow on a timer. `cron` is the classic 5-field
  # timetable syntax (see the field legend on the cron line below). This one
  # runs every 3 hours, on the hour. cron's timezone is always UTC.
  schedule:
    # The 5 fields are minute / hour / day-of-month / month / day-of-week.
    # `0 */3 * * *` = minute 0, every 3rd hour (00:00, 03:00, 06:00 … UTC),
    # any day, any month, any weekday.
    - cron: '0 */3 * * *'   # min hour day-of-month month day-of-week
  # `workflow_dispatch` adds a "Run workflow" button in the Actions tab so a
  # human can launch it by hand - handy for testing or a one-off refresh.
  workflow_dispatch:
  # `push` fires when commits land in the repo. The `branches` + `paths`
  # filters below narrow it down: only a push to `main` that touches the
  # listed file(s) will trigger a run. A push that changes anything else is
  # ignored by this workflow.
  # Re-run if someone edits the news script itself, so changes to feed
  # config / parsing rules take effect immediately on next push.
  push:
    # Only the main branch counts.
    branches:
      - main
    # …and only when one of these files changed. The workflow file itself is
    # listed too - same pattern as every sibling workflow - so an edit to the
    # PR/approve/merge logic here gets exercised on the next push instead of
    # waiting up to 3 hours for the schedule.
    paths:
      - 'update_news.py'
      - '.github/workflows/update-news.yml'

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Read-only on the built-in token; writes go through the App + PAT tokens.
# -----------------------------------------------------------------------------
# `permissions:` sets what the automatic, built-in credential - called the
# GITHUB_TOKEN, which GitHub creates fresh for every run and throws away when
# the run ends - is allowed to do. Granting the least access needed is a
# security best practice: if this token leaked, it could do nothing but read.
# Read-only on the auto-injected GITHUB_TOKEN. Every step that needs write
# access (push commits, open PRs, enable auto-merge) uses an installation
# token from the csoh-ci GitHub App. CSOH_PAT (a fine-grained org-scoped
# PAT) drives the auto-approve step because GitHub's auto-merge feature
# does NOT honor the App's ruleset bypass when evaluating the "1 required
# approval" rule (empirically verified, see "Auto approve" step comments).
permissions:
  # `contents: read` = may clone/read the repo, but may not push.
  contents: read


# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# One fixed lock so news refreshes queue serially and never overlap.
# -----------------------------------------------------------------------------
# `concurrency:` stops two runs from stepping on each other. Runs that share
# the same `group` name are not allowed to execute at the same time - a new
# one waits for the current one to finish (or, if cancel-in-progress were
# true, it would kill the running one and take over).
# Update News opens a PR on its own branch - it does not push to main, so it
# doesn't need to share the deploy-pipeline group with site-update-deploy.
# Keeping its own group means a freshly-queued site update (which uses
# cancel-in-progress: true to avoid stale state) won't cancel a news refresh
# mid-run. Multiple Update News runs still queue serially against each other.
concurrency:
  # The lock name. Anything else using this exact name would share the lock;
  # this name is unique to Update News, so it only blocks its own re-runs.
  group: update-news
  # false = let the in-flight run finish; queue the new one behind it.
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: refresh the feeds, and if anything changed open (and maybe
# auto-approve + auto-merge) a PR.
# -----------------------------------------------------------------------------
# A workflow is made of one or more "jobs". Each job runs on its own fresh
# virtual machine and (unless told otherwise) in parallel with other jobs.
# This workflow has just one job.
jobs:
  # `update-news` is this job's internal id (used to reference it elsewhere).
  update-news:
    # `runs-on` picks the type of throwaway machine GitHub spins up for the
    # job. `ubuntu-latest` = a fresh, current Ubuntu Linux VM, wiped after.
    runs-on: ubuntu-latest

    # `steps` are the ordered list of actions the job performs, top to bottom,
    # on that same machine. Each step is either a `run:` (a shell command we
    # write) or a `uses:` (a prebuilt action we borrow) - explained inline.
    steps:
      # Mint a short-lived (~1h) installation token from the csoh-ci GitHub
      # App. The App's permissions (contents:write, pull-requests:write) are
      # scoped to this repo only - much smaller blast radius than a PAT if
      # the token leaks. CSOH_PAT below is still a PAT: GitHub blocks
      # self-approval, AND empirically GitHub's auto-merge feature does NOT
      # honor the ruleset bypass list for the approval requirement (verified
      # in PR #650, 2026-05-08 - checks all green, App on bypass, auto-merge
      # stayed BLOCKED on REVIEW_REQUIRED). So a second identity approving
      # the PR is the only way to drive auto-merge to completion.
      # `name` is just the step's label in the run log.
      - name: Mint installation token
        # `id` gives this step a handle so later steps can read its outputs -
        # here, the minted token is reachable as steps.app-token.outputs.token.
        id: app-token
        # `uses` runs a prebuilt, shareable action instead of our own shell.
        # The part after `@` pins it to one exact commit (a 40-char SHA), not
        # a moving tag like `v3` - so a compromised or retagged release can't
        # silently change what runs here. The `# v3.1.1` is just a human note
        # of which release that SHA corresponds to.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        # `with:` passes named inputs to the action - like arguments to a
        # function. Each action documents which inputs it accepts.
        with:
          # `${{ ... }}` is GitHub Actions' expression syntax: it gets
          # evaluated and substituted before the step runs. `secrets.NAME`
          # pulls an encrypted value stored in the repo/org settings - never
          # printed in logs. These two feed the App its identity + key.
          # `client-id` (the Iv23.* string from the App's settings page) -
          # the older `app-id` (numeric App ID) was deprecated in v3.x.
          client-id: ${{ secrets.CSOH_CI_CLIENT_ID }}
          private-key: ${{ secrets.CSOH_CI_PRIVATE_KEY }}

      # The fresh VM starts empty - it does NOT have our code. `actions/
      # checkout` is the standard action that git-clones the repo onto the
      # machine so later steps can see and edit the files.
      # Full clone using the App's installation token so the create-PR action
      # below has push access. Unlike the auto-injected GITHUB_TOKEN, an App
      # token CAN trigger downstream workflows on PRs it creates - which is
      # why we don't just use the default token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Clone using the App token (from the previous step's output) rather
          # than the default credential, so the later push has the right
          # identity and access.
          token: ${{ steps.app-token.outputs.token }}
          # `fetch-depth: 0` clones the FULL history. The default is a shallow
          # 1-commit clone; the create-PR action needs full history to build a
          # clean branch and diff.
          fetch-depth: 0

      # The runner doesn't have a guaranteed Python ready to use, so this
      # action installs one and puts it on the PATH - update_news.py needs it.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # `'3.x'` = the latest available Python 3. (Quoted so YAML reads it
          # as text, not the number 3.)
          python-version: '3.x'

      # `run:` executes a shell command on the runner (bash by default) - this
      # is the "do our own thing" counterpart to `uses:`.
      # Run the actual script. It rewrites news.html, feed.xml, and sitemap.xml in place.
      - name: Update news.html from feeds
        run: python3 update_news.py

      # Did the script change anything? And were the changes ONLY to the
      # safe-to-auto-merge files? We use this to decide whether to enable
      # auto-merge or require human review.
      #
      # Untracked files are included deliberately: peter-evans/create-pull-
      # request commits EVERYTHING in the working tree, including brand-new
      # files a plain `git diff` never lists - so a scope check that only
      # looked at the diff could approve a PR carrying files it never saw.
      # update_news.py rewrites three files that all already exist, so today
      # a new file means the script did something unexpected, which is
      # precisely the case this gate is for. (check-pagespeed.yml and
      # run-seo-audit.yml use the identical pair of commands for the same
      # reason.)
      - name: Detect changed files
        # This step publishes two named "outputs" (has_changes, only_news_
        # files). Later steps read them as steps.changes.outputs.<name> - the
        # `changes` part is exactly this `id`.
        id: changes
        # A `|` after `run:` starts a multi-line block: every indented line
        # below is one shell script, run top to bottom.
        run: |
          # `set -euo pipefail` - fail fast on errors, undefined vars, or
          # broken pipes. Standard "strict mode" for shell scripts.
          set -euo pipefail
          # `git diff --name-only` lists modified tracked files; `git ls-files
          # --others --exclude-standard` lists new untracked ones (--exclude-
          # standard honors .gitignore, so ignored junk isn't counted). Run
          # back to back inside one `$( )`, they are exactly the set the
          # create-PR action would commit.
          files="$(git diff --name-only; git ls-files --others --exclude-standard)"

          # `[ -z "$files" ]` is true when the list is empty, i.e. the script
          # changed nothing. In that case record "no changes" and stop early.
          if [ -z "$files" ]; then
            # `$GITHUB_OUTPUT` is a temp file the runner gives each step.
            # Appending `name=value` lines to it sets this step's outputs,
            # which later steps read via steps.changes.outputs.<name>.
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "only_news_files=false" >> "$GITHUB_OUTPUT"
            # `exit 0` ends the script successfully - nothing more to do.
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Walk every changed file. If ANY file isn't in the allowed list,
          # flip `only_allowed=false` and break - humans need to review it.
          allowed="news.html feed.xml sitemap.xml"
          only_allowed=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case " $allowed " in
              *" $f "*) ;;                              # match - allowed
              *) only_allowed=false; break ;;          # no match - not allowed
            esac
          done <<< "$files"
          if [ "$only_allowed" = "true" ]; then
            echo "only_news_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_news_files=false" >> "$GITHUB_OUTPUT"
          fi

      # Open a PR with whatever the news script changed. The action handles
      # branch creation, commit, push, and PR creation - all in one shot.
      - name: Create Pull Request
        # This step also exposes outputs (notably pull-request-number), which
        # the next two steps reference as steps.cpr.outputs.<name>.
        id: cpr
        # `if:` is a condition - the step runs only when it evaluates true,
        # otherwise it's skipped. Here: only open a PR when the previous step
        # reported actual changes. (Output values are strings, hence 'true'.)
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # DO NOT switch this to CSOH_PAT. The identity in `token:` becomes the
          # PR author, and CSOH_PAT is Shawn's own identity - GitHub then rejects
          # the "Auto approve" step below with "Can not approve your own pull
          # request", because that step authenticates as CSOH_PAT too. The App
          # must author the PR so the PAT is a *different* identity that is
          # allowed to approve it. Using the App token here also lets the PR
          # trigger downstream CI, which the built-in GITHUB_TOKEN cannot do.
          # This has now been broken and reverted twice: PR #947 (reverted in
          # 069e3500) and PR #1286 (reverted in this commit).
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: update news feed content'
          title: 'chore: Update news articles'
          # Multi-line PR body. `|` keeps newlines literal.
          body: |
            This PR was automatically created by the Update News workflow.

            The news feed content in `news.html` has been refreshed from configured RSS/Atom sources.

            **Changes:**
            - Updated article cards in `news.html`
            - Updated `dateModified` in JSON-LD

            This can be safely reviewed and merged.
          branch: update-news-content                   # always reuses the same branch name
          delete-branch: true                            # clean up after merge
          labels: automated, content

      # Approve our own PR using a fine-grained org-level PAT (different
      # identity), because GitHub won't let an actor approve a PR it opened.
      # CSOH_PAT belongs to a separate identity for this single purpose
      # and should be scoped to csoh.org with permissions limited to
      # `Pull requests: Read & Write`. Note: the `csoh-ci` App is on the
      # main-branch ruleset bypass list, but auto-merge does not consult
      # the bypass list when checking the approval requirement - only
      # direct API merges do. So this approval step is still needed to
      # drive auto-merge below to completion.
      - name: Auto approve
        # Two conditions, and the second one matters. Skip unless the create-PR
        # step actually produced a PR number (an empty string `''` means no PR
        # was opened), AND the diff is news content only.
        #
        # The scope check used to be missing here, so a PR that touched
        # something unexpected still received a code-owner approval - it simply
        # did not get auto-merge enabled by the next step. That is a weaker
        # safety valve than it looks: an approved PR satisfies the Main
        # ruleset's review requirement, so anyone could merge it later without
        # a second look, and the approval carries the repo owner's identity via
        # CSOH_PAT. Withhold the approval too, not just the auto-merge.
        # update-resources.yml already gates its approval this way.
        if: steps.cpr.outputs.pull-request-number != '' && steps.changes.outputs.only_news_files == 'true'
        # `gh` is GitHub's official command-line tool, preinstalled on the
        # runner. `gh pr review --approve <number>` submits an approval review.
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        # `env:` defines environment variables visible only to this step's
        # command. `gh` automatically authenticates using `GH_TOKEN`, so this
        # supplies the separate-identity PAT that's allowed to approve the PR.
        env:
          GH_TOKEN: ${{ secrets.CSOH_PAT }}

      # Only enable auto-merge when the diff is purely news content. If the
      # script accidentally touches anything else, the PR stays open until a
      # human reviews - important safety valve.
      - name: Enable PR auto-merge when only news content files changed
        # `&&` = both conditions must be true: the diff is news-only AND a PR
        # exists. Auto-merge tells GitHub to merge the PR by itself once all
        # required checks pass and the approval (from the step above) is in.
        if: steps.changes.outputs.only_news_files == 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d  # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Tell the action which PR to enable auto-merge on.
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash                          # one tidy commit on main
