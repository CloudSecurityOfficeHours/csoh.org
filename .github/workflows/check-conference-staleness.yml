# =============================================================================
# Check Conference Staleness
# -----------------------------------------------------------------------------
# Monthly, scans conferences.html and flags any conference card whose "Next:"
# date has slipped into the past. Each card carries a machine-readable
# data-next-date="YYYY-MM-DD" attribute; once that start date is behind today,
# the card advertises a "Next" edition that has already happened, which reads as
# a neglected page. This is the self-policing half of showing concrete dates on
# an otherwise static, hand-maintained site.
#
# Like check-meeting-staleness.yml and check-reading-list-staleness.yml, this
# NEVER edits the site - it only opens (or updates, or closes) a single sticky
# tracking issue with the report.
# =============================================================================

# This whole file is a "workflow": a GitHub Actions automation that runs when
# something happens in the repo (a timer fires, a button is clicked, a push
# lands). GitHub reads it because it lives under .github/workflows/ and ends in
# .yml. `name:` is just the human-friendly label shown in the Actions tab.
name: Check Conference Staleness

# -----------------------------------------------------------------------------
# §1 - Triggers
# Runs on a monthly timer, on demand, or when the checker/workflow itself edits.
# -----------------------------------------------------------------------------
# `on:` lists the events that start this workflow. Any one is enough to trigger.
on:
  # `schedule` runs on a timer using cron (minute, hour, day-of-month, month,
  # day-of-week; `*` = every). GitHub cron is always UTC. Conference dates move
  # on the scale of months, not days, so a monthly check is plenty.
  # `0 14 1 * *` reads: 14:00 UTC on the 1st of every month.
  schedule:
    - cron: '0 14 1 * *'    # min hour day-of-month month day-of-week
  # `workflow_dispatch` adds a "Run workflow" button so a human can launch it
  # on demand (e.g. right after editing dates, to confirm nothing is stale).
  workflow_dispatch:
  # `push` re-checks only when the checker script or this workflow changes,
  # because those files alter HOW staleness is computed. Editing dates in
  # conferences.html does NOT re-trigger (it is not in `paths:`); the monthly
  # timer and the manual button cover that.
  push:
    branches:
      - main
    paths:
      - 'tools/check_conference_staleness.py'
      - '.github/workflows/check-conference-staleness.yml'

# -----------------------------------------------------------------------------
# §2 - Permissions
# Read the repo files; write Issues (to open/update/close the tracking issue).
# -----------------------------------------------------------------------------
# Every run gets an automatic, throwaway credential (GITHUB_TOKEN).
# `permissions:` sets what it may do; listing only what's needed (least
# privilege) limits the blast radius if a step misbehaves.
permissions:
  contents: read      # read repo files (needed to check them out); no pushing
  issues: write       # create/edit/close the sticky tracking issue

# -----------------------------------------------------------------------------
# §3 - Concurrency
# One global lock so two runs never race on the same tracking issue.
# -----------------------------------------------------------------------------
concurrency:
  # A constant group name means every run of this workflow shares one lock.
  group: check-conference-staleness
  # A staleness report is a read-only computation, so cancelling an older
  # in-progress run in favor of a newer one is safe.
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps
# One job: compute the report, save it as an artifact, then open/update/close
# the tracking issue based on whether anything is stale.
# -----------------------------------------------------------------------------
jobs:
  check-staleness:
    # "ubuntu-latest" is a GitHub-hosted Linux VM, created fresh for this job
    # and discarded when it finishes.
    runs-on: ubuntu-latest
    # Cap the run. The GitHub default is 360 minutes, so a job that
    # hangs on a network call burns six hours and, where it holds a
    # concurrency lock, blocks everything queued behind it for the same
    # six. Sized to the work, not to the worst case imaginable.
    timeout-minutes: 15
    steps:
      # Step 1 - Pull the repo onto the runner so later steps can read
      # conferences.html and the checker script. The "@<40-hex>" pins the action
      # to an exact commit SHA (not a moving tag) so a hijacked tag can't swap in
      # malicious code; the trailing "# v7.0.0" notes the human-readable version.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Step 2 - Install a Python interpreter so the next step's `python3`
      # command exists. The checker only uses the standard library.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      # Step 3 - Run the checker. It scans conferences.html, pairs each
      # data-next-date with its card title, and writes a markdown report to
      # staleness.md whose "Status:" line reads STALE or OK. It exits 0 even when
      # something is stale (report, not a gate); only an internal error (e.g. the
      # card markup changed so no date lines are found) exits non-zero.
      - name: Run staleness check
        run: python3 tools/check_conference_staleness.py --output staleness.md

      # Step 4 - Stash the report as an "artifact" a human can download from the
      # run page. `if: always()` runs this even if an earlier step failed, so we
      # still capture whatever was written.
      - name: Upload staleness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: conference-staleness-report
          path: staleness.md
          retention-days: 90
          if-no-files-found: warn

      # Step 5 - Manage the single sticky tracking issue. If anything is stale,
      # create the issue (or update it if it already exists); once every date is
      # refreshed, auto-close it.
      #
      # The open/update/close mechanics live in the shared composite action
      # `.github/actions/sticky-issue` (see check-meeting-staleness.yml for the
      # fuller note on why). This workflow only supplies its own title, label,
      # footer, and close-comment; the action's default stale marker matches
      # the "**Status:** STALE" line the checker emits.
      - name: Open, update, or close tracking issue
        uses: ./.github/actions/sticky-issue
        with:
          # GITHUB_TOKEN is the automatic per-run credential; the `issues:
          # write` permission above is what lets it manage the issue.
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Conferences: a 'Next' date has gone stale"
          label: conference-staleness
          label-description: Auto-generated reports from check-conference-staleness.yml
          report-file: staleness.md
          footer: _This issue auto-closes once every 'Next' date on conferences.html is refreshed._
          # A non-empty close-comment enables auto-close on a healthy report.
          close-comment: All conference 'Next' dates are upcoming again.
