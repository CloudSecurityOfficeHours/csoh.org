# =============================================================================
# Validate HTML
# -----------------------------------------------------------------------------
# The PR gate for markup correctness. Six checks, all blocking:
#
#   1. No inline <script> blocks    - the production CSP is `script-src 'self'`,
#                                     so an inline script is silently dropped in
#                                     the browser while still passing validation.
#   2. width/height on every <svg viewBox> - otherwise the browser has no aspect
#                                     ratio at parse time and the element jumps
#                                     once CSS lands (Cumulative Layout Shift).
#   3. Valid JSON in every JSON-LD block   - one trailing comma and a strict
#                                     schema.org parser drops the whole block,
#                                     silently shipping no structured data.
#   4. The W3C HTML5 validator (Nu HTML Checker) over every .html file - catches
#                                     unclosed tags, anchors nested inside
#                                     anchors or buttons, invalid attributes.
#   5. Crosslink coverage           - every root page is either cross-linked or
#                                     explicitly opted out; an unlisted page is
#                                     silently never visited by the linker.
#   6. Glossary integrity           - unique <dt> ids, no alias claimed by two
#                                     entries, anchors resolve, no entry made
#                                     unreachable by accident.
#
# 5 and 6 assert whole-repo invariants rather than inspecting the diff, so they
# run on every invocation. 1-4 are gated on the diff actually containing HTML.
#
# Failing the job posts a PR comment with the last 50 lines of the validator log
# so the contributor doesn't have to dig through the run output.
# =============================================================================

name: Validate HTML

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# When does this workflow run?
# -----------------------------------------------------------------------------
# A "workflow" is one automation file. GitHub watches for the events listed
# under `on:` and, when one fires, runs the jobs defined further down. A
# workflow contains jobs; a job contains steps. Each event below is a
# separate trigger - any one of them can start this workflow.
on:
  # `pull_request` fires when someone opens or updates a PR.
  #
  # THERE IS DELIBERATELY NO `paths:` FILTER HERE, and putting one back would
  # break more than it saves. This job is a REQUIRED STATUS CHECK on `main`, and
  # a required check is satisfied only by a check run that actually reports. A
  # workflow that `paths:` filters out never starts, so it produces no check run
  # at all, so the requirement is never met and the pull request is blocked
  # forever waiting for a result that cannot arrive. That is not a hypothetical:
  # it would hang every PR touching only Python, YAML, or docs.
  #
  # The filtering still happens, just one level down. The "Detect HTML changes"
  # step below works out whether this PR touches any .html, and the expensive
  # steps are gated on its output. So a non-HTML PR still gets a green
  # `validate-html` check in a couple of seconds, having run only the two
  # whole-repo invariant checks (~0.8s together) and skipped the rest.
  #
  # The `push:` trigger below keeps its `paths:` filter, because nothing depends
  # on a push producing a check run.
  pull_request:
  # `push` fires when commits land on a branch. `branches:` limits it to
  # `main`, and `paths:` again limits which pushes matter - so both conditions
  # must hold for this trigger to fire. This catches direct commits to main
  # that bypass the PR flow, so we don't have to wait for the weekly cron.
  #
  # The list is not only '**.html'. Two of the steps below check whole-repo
  # invariants that a pure-Python change can break with no HTML in the diff:
  # dropping a page from TARGET_PAGES, or editing the glossary parser or the
  # UNREACHABLE map. Commit 0559db56 added the glossary gate and touched no
  # HTML, so this workflow did not run and the new gate never executed - the
  # check meant to catch silent omissions was itself silently skipped. Anything
  # a step here reads has to be able to trigger the step.
  push:
    branches:
      - main
    paths:
      - '**.html'
      # check_docs_consistency.py reads authored Markdown as well as HTML, so a
      # commit touching only a README can break its gate. `**.md` matches at any
      # depth; `*.md` would mean root-level only and would miss tools/*.md and
      # docs/*.md entirely (see the `'*.html'` trap documented in CLAUDE.md).
      - '**.md'
      - 'tools/check_crosslink_coverage.py'
      - 'tools/check_glossary_coverage.py'
      - 'tools/check_docs_consistency.py'
      # Imported by check_docs_consistency.py for the canonical counts, so a
      # change to it changes that gate's verdict with nothing else in the diff.
      - 'tools/sync_counts.py'
      - 'tools/crosslink_pages.py'
      - 'tools/crosslink_glossary.py'
      - 'tools/glossary_terms.py'
      - 'tools/check_jsonld.py'
      - 'tools/check_no_inline_scripts.py'
      - 'tools/check_svg_dimensions.py'
      - '.github/workflows/validate-html.yml'
  # `schedule` runs the workflow on a timer using cron syntax (five fields:
  # minute, hour, day-of-month, month, day-of-week; `*` means "every").
  # `0 7 * * 1` reads: minute 0, hour 7, every day-of-month, every month,
  # weekday 1 (Monday) - i.e. 07:00 UTC every Monday. GitHub cron is always
  # UTC, not your local time. This weekly run is a safety net - the last line
  # of defense for anything that somehow slipped past both PR and push triggers.
  schedule:
    - cron: '0 7 * * 1'   # cron format: min hour day-of-month month day-of-week
  # Lets you run the workflow manually from the Actions tab in GitHub.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# What this workflow is allowed to do.
# `contents: read` = can read repo files. `pull-requests: write` = can post
# review comments. Read-only on the codebase - safer than the default.
# -----------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write


# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# "Don't let two of these run at the same time."
# `group` is the lock name; same group + same ref = queued/cancelled.
# `${{ github.ref }}` makes the lock per-branch/per-PR, so different PRs
# can validate in parallel - only the SAME PR cancels its old run.
# `cancel-in-progress: true` = if you push a new commit to a PR, kill the
# old validation run and start fresh on the latest commit. Read-only checks
# are safe to interrupt.
# -----------------------------------------------------------------------------
concurrency:
  # `${{ ... }}` is GitHub Actions' expression syntax: at run time it
  # substitutes a value in. `github.ref` is the branch/PR being built (e.g.
  # `refs/heads/main`), so each branch or PR gets its own lock group.
  group: validate-html-${{ github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# Each job runs on its own fresh VM ("runner"). Steps inside a job share
# the same filesystem and run in order; a failed step fails the whole job
# unless the step is marked `if: always()` or `continue-on-error: true`.
# -----------------------------------------------------------------------------
jobs:
  validate-html:
    # The VM image GitHub gives us. `ubuntu-latest` is the standard pick.
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Pull the repo onto the runner so we can read the files.
      # A step either calls a prebuilt, reusable action with `uses:` (like
      # this one) or runs shell commands with `run:` (see the next step).
      # `actions/checkout@<sha>` is GitHub's official action that clones the
      # repo onto the runner; without it the runner starts empty. The pinned
      # SHA (instead of @v6) is a security best practice - it prevents a
      # compromised tag from running malicious code on our runner.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Needed by the next step: diffing this PR against its base commit
          # requires both commits to be present, and checkout defaults to a
          # depth of 1. Without this the `git diff` below fails with a bad
          # object rather than reporting no changes, which would at least be
          # loud - but there is no reason to find out.
          fetch-depth: 0

      # Decide whether this run has any HTML to validate.
      #
      # This exists because the `pull_request` trigger above deliberately has no
      # `paths:` filter (see the long note there): as a required status check
      # this workflow must ALWAYS produce a check run, including on pull
      # requests that touch no HTML at all. The filtering therefore moves here,
      # where skipping work is cheap and still reports success.
      #
      # Any event that is not a pull_request - push to main, the weekly cron, a
      # manual dispatch - validates everything unconditionally. Those runs are
      # not gating a merge, and a full sweep is the point of the cron.
      - name: Detect HTML changes
        id: html
        # Context values go through `env:` rather than being interpolated
        # straight into the script. That is this repo's house pattern for
        # anything coming out of `github.*`, and here it also keeps the
        # comparison honest: `${{ github.event_name }}` substituted directly
        # into a `[ ... != ... ]` test renders as a literal string on both
        # sides, so the shell reads `[ "pull_request" != "pull_request" ]` and
        # the logs show a tautology. Correct, but unreadable.
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" != "true" ]; then
            echo "Event is $EVENT, not a pull request: validating everything."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '\.html$'; then
            echo "This pull request touches HTML: validating."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .html files changed in this pull request; nothing to validate."
            echo "This check reports success so it can serve as a required status check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # This step uses `run:` instead of `uses:` - it executes a shell command
      # on the runner. Here it launches a small Python script that lives in the
      # repo (checked out in Step 1) under tools/.
      # Step 2 - Refuse inline <script> blocks. Production CSP is
      # `script-src 'self'`, so inline scripts are silently blocked in the
      # browser - they "pass" HTML validation but break behavior. JSON-LD
      # and other data-typed <script> blocks are allowed (CSP exempts them).
      - name: Reject inline scripts (CSP gate)
        if: steps.html.outputs.changed == 'true'
        run: python3 tools/check_no_inline_scripts.py

      # Step 3 - Require width/height on every <svg viewBox>. Without the
      # attributes the browser can't derive an aspect ratio at parse time,
      # so the element is laid out at a default size and then jumps to its
      # CSS-driven size - Cumulative Layout Shift (CLS) that hurts Core
      # Web Vitals. The attributes only set the aspect ratio; final
      # rendered size still comes from CSS.
      - name: Require SVG dimensions (CLS gate)
        if: steps.html.outputs.changed == 'true'
        run: python3 tools/check_svg_dimensions.py

      # Step 3b - Every JSON-LD block must be valid JSON. Strict schema.org
      # parsers drop an entire block on the first syntax error (a single
      # quote, a trailing comma), so an invalid block ships no structured
      # data at all - silently, since presence-only audits still see a
      # <script> tag. This gate parses each block with json.loads.
      - name: Validate JSON-LD (structured-data gate)
        if: steps.html.outputs.changed == 'true'
        run: python3 tools/check_jsonld.py

      # Step 3c - Every root page must be either cross-linked by
      # crosslink_pages.py or listed as deliberately unlinked. That script
      # works from an opt-in list and a page missing from it is simply never
      # visited: no error, no warning, just a page that ships with zero
      # glossary links while its neighbours carry 40+. That happened twice
      # before this gate existed - 8 pages, then 23 more on a sweep, one of
      # them ~9,500 words. A silent omission is exactly the failure mode a
      # check should convert into a loud one.
      #
      # Deliberately NOT gated on steps.html.outputs.changed. This asserts a
      # whole-repo invariant rather than inspecting the diff, and the way it
      # breaks most easily is a pure-Python edit - dropping a name from
      # TARGET_PAGES - with no HTML in the commit at all. It takes ~0.4s, so
      # there is nothing to save by skipping it.
      - name: Require crosslink coverage for every root page
        run: python3 tools/check_crosslink_coverage.py

      # Step 3d - The glossary's own invariants. Both cross-linkers degrade
      # quietly here too: a <dt> that yields no lookup keys is skipped with no
      # message, an alias claimed by two entries resolves to whichever <dt>
      # sits earlier in the file, and a duplicated id silently steals another
      # entry's links. 5,000+ links across the site resolve through this one
      # mapping, so a quiet break here is expensive and invisible.
      # Unconditional for the same reason as 3c: editing the parser, a
      # denylist, or the UNREACHABLE map breaks this with no HTML in the diff.
      - name: Check glossary integrity and reachability
        run: python3 tools/check_glossary_coverage.py

      # Step 3e - Documentation consistency, mechanical half. Keeps the class of
      # defect the weekly review kept rediscovering from accumulating again: a
      # visible "Last updated" disagreeing with the page's own JSON-LD, a
      # datetime attribute disagreeing with the date printed beside it, an
      # em-dash where docs/EDITORIAL_STANDARDS.md calls for a spaced hyphen.
      #
      # --check fails ONLY on findings the script can fix itself. Placeholder
      # dates, missing card assets, and glossary orphans are reported to the
      # weekly tracking issue instead - a gate that failed on something CI
      # cannot fix would block every push until a human intervened, which is
      # how a gate gets disabled rather than satisfied.
      #
      # Unconditional for the same reason as 3c and 3d: the Markdown it reads
      # is not HTML, so `steps.html.outputs.changed` says nothing about it.
      - name: Check documentation consistency
        run: python3 tools/check_docs_consistency.py --check

      # Step 4 - Run the actual W3C validator. This action wraps the Nu
      # HTML Checker (the same engine validator.w3.org uses).
      - name: Validate HTML5
        if: steps.html.outputs.changed == 'true'
        uses: Cyb3r-Jak3/html5validator-action@443b108eb8e134b63a1f8a8ba0c942d552608ed7  # master 2025-09-19
        # `with:` passes input parameters into a `uses:` action - like
        # arguments to a function. The keys an action accepts are defined by
        # that action; here we set its `root` and `blacklist` inputs.
        with:
          root: .                                       # scan the whole repo
          # Skip files we don't want validated. The Google verification stub
          # is intentionally non-standard HTML - Google requires it as-is.
          blacklist: google66d489593949bd4c.html

      # Step 5 - Stash the validation log as an "artifact": a file the runner
      # saves and attaches to the run so a human can download it from the
      # GitHub run page. The runner's disk is wiped when the job ends, so
      # uploading is the only way to keep the log around. `if: always()` = run
      # even if the previous step failed, so we still get the log when it's
      # most useful.
      - name: Upload validation log
        # `always()` so a FAILED validation still uploads its log, but only when
        # validation actually ran - there is no log to upload on a skipped run.
        if: always() && steps.html.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # `name` is the label the download shows under; `path` is which file
          # to capture (the validator wrote its findings to log.log).
          name: html-validation-log
          path: log.log
          # `retention-days` is how long GitHub keeps the artifact before
          # auto-deleting it. `if-no-files-found: warn` means: if log.log is
          # missing, just print a warning rather than failing the step.
          retention-days: 30                            # auto-delete after 30 days
          if-no-files-found: warn

      # Step 6 - If validation failed AND this is a PR, post the errors as a
      # comment so the contributor sees them without digging through logs.
      # The `if:` here is a guard: the step only runs when BOTH are true -
      # `failure()` (an earlier step in this job failed) AND `github.event_name`
      # is `pull_request` (this run came from a PR, not a push or the cron).
      # So contributors get feedback on their PR, but pushes/cron stay quiet.
      - name: Comment on PR with validation results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # Inline JS that runs against GitHub's API. `github`, `context`, etc.
          # are pre-injected helpers from the github-script action.
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('log.log', 'utf8');
            } catch (e) {
              log = 'Error reading validation log';
            }

            // Trim the log to the last 50 lines so the PR comment doesn't
            // become an unreadable wall of text.
            const lines = log.split('\n');
            const trimmed = lines.length > 50
              ? '...(truncated)\n' + lines.slice(-50).join('\n')
              : log;

            const errorCount = (log.match(/error:/gi) || []).length;

            let comment = `## :x: HTML Validation Failed\n\n`;
            comment += `Found **${errorCount} validation error(s)** in HTML files.\n\n`;
            comment += `\`\`\`\n${trimmed}\n\`\`\`\n\n`;
            comment += `Fix the errors above and push again. Full log in workflow artifacts.`;

            // Post the comment on the PR.
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
