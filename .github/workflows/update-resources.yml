# =============================================================================
# Update Resources
# -----------------------------------------------------------------------------
# Once a week, asks Claude Code to research and add 2-3 new resources to each
# section of resources.html (CTF, Labs, Tools, Certifications, AI Security,
# Job Search). Opens a PR that auto-approves and auto-merges when ONLY
# resources.html changed; if Claude touched any other file the PR stays open
# for a human to review before it goes live.
#
# Requires repo secret: CLAUDE_CODE_OAUTH_TOKEN. Generate locally with
# `claude setup-token` (one-time) - it mints a long-lived OAuth token tied
# to your Claude Pro / Max subscription, so model usage draws from the
# subscription quota instead of pay-per-token API billing.
# Reuses org secrets: CSOH_CI_CLIENT_ID, CSOH_CI_PRIVATE_KEY (GitHub App for
# minting a write-scoped installation token, same pattern as update-news.yml),
# and CSOH_PAT (separate identity used to approve the PR so auto-merge can
# satisfy the "1 required approval" rule).
# =============================================================================

# A "workflow" is one automated process GitHub Actions runs for this repo.
# This whole file defines a single workflow. `name:` is just the label that
# shows up in the repo's "Actions" tab so humans can tell workflows apart.
name: Update Resources

# -----------------------------------------------------------------------------
# §1 - Triggers (matches "Anatomy / §1" on github-actions.html)
# Runs on a weekly Monday cron, or on demand from the Actions tab.
# -----------------------------------------------------------------------------
# `on:` lists the events that cause this workflow to run (its "triggers").
# A workflow can have several triggers; any one of them firing starts a run.
on:
  # `schedule:` runs the workflow automatically on a clock, like a cron job.
  # cron is the classic Unix time format: five fields meaning
  #   minute  hour  day-of-month  month  day-of-week.
  # `0 14 * * 1` = minute 0, hour 14, any day-of-month, any month, weekday 1
  # (Monday). So: every Monday at 14:00 UTC (10:00 ET / 09:00 CT). GitHub
  # always interprets cron in UTC.
  schedule:
    - cron: '0 14 * * 1'
  # `workflow_dispatch:` adds a "Run workflow" button in the Actions tab so a
  # human can kick off the workflow by hand, on demand, without waiting for
  # the schedule.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# §2 - Permissions (matches "Anatomy / §2" on github-actions.html)
# Keep the built-in token read-only; real write access is a minted App token.
# -----------------------------------------------------------------------------
# `permissions:` controls what the automatic, built-in token (called
# GITHUB_TOKEN) is allowed to do with this repo during the run. GitHub
# injects that token into every run; here we keep it deliberately minimal.
# Default token is read-only. Write access comes from the App installation
# token minted below, matching the pattern in update-news.yml.
# `id-token: write` is required by anthropics/claude-code-action@v1 - it
# exchanges a GitHub OIDC token for short-lived Claude credentials.
permissions:
  # `contents: read` = the token may clone/read this repo's files, nothing
  # more. It cannot push commits; the GitHub App token provides write access
  # where it's actually needed. That token is minted AFTER the Claude Code
  # step, not at the top of the job - see the note beside the checkout step.
  contents: read
  # OIDC (OpenID Connect) is a standard way for one system to prove its
  # identity to another using a short-lived, signed token instead of a stored
  # password. `id-token: write` lets this run request such a token from
  # GitHub. The same keyless idea powers this site's cloud deploys (AWS/GCP/
  # Azure trust GitHub's OIDC token instead of long-lived secrets); here the
  # Claude Code action trades it for temporary Claude credentials.
  id-token: write

# -----------------------------------------------------------------------------
# §3 - Concurrency (matches "Anatomy / §3" on github-actions.html)
# One global lock so two resource-refresh runs never overlap; never cancel one.
# -----------------------------------------------------------------------------
# `concurrency:` stops the same workflow from running on top of itself.
# Runs that share one "group" name are serialized: only one runs at a time,
# so two scheduled runs never stomp each other.
concurrency:
  # A constant group name (NOT one keyed on `${{ github.ref }}`) means EVERY
  # run of this workflow shares the single lock, regardless of branch. That is
  # what we want here: this workflow edits one shared file and one shared PR
  # branch, so overlapping runs must be serialized, not run in parallel.
  group: update-resources
  # `false` = a new run WAITS for the in-flight one to finish instead of
  # canceling it. We never want to interrupt a half-finished resource edit
  # (unlike the read-only lint/validate workflows, which cancel freely).
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# §4 - Jobs and steps (matches "Anatomy / §4" on github-actions.html)
# One job: mint a token, check out, let Claude edit, then open/approve/merge PR.
# -----------------------------------------------------------------------------
# `jobs:` holds the units of work. A workflow has one or more jobs; each job
# runs on its own fresh virtual machine. By default jobs run in parallel, but
# this workflow has just one job, so there's nothing to parallelize here.
jobs:
  # `update-resources` is this job's internal id (our choice of name).
  update-resources:
    # `runs-on:` picks the type of machine GitHub spins up for the job.
    # `ubuntu-latest` = a clean, throwaway Linux VM, discarded after the run.
    runs-on: ubuntu-latest
    # Safety cap: if the job hangs (e.g. Claude or the network stalls), GitHub
    # kills it after 20 minutes so it doesn't run - and bill - indefinitely.
    timeout-minutes: 20

    # `steps:` are the ordered actions inside a job. They run top-to-bottom on
    # the same VM, sharing its filesystem, so a later step sees files an
    # earlier step created. Each step is EITHER a `uses:` (a prebuilt, shared
    # action pulled from another repo) OR a `run:` (raw shell commands).
    steps:
      # STEP ORDER IS A SECURITY CONTROL IN THIS JOB. READ BEFORE REORDERING.
      #
      # The Claude Code step below reads web pages nobody here controls, so it
      # must be treated as processing untrusted input. Every credential present
      # in the job's environment while it runs is a credential a prompt
      # injection can try to reach: `Read` accepts absolute paths, so
      # /proc/self/environ and any file the runner wrote are in scope, and
      # `WebFetch` can carry whatever it finds to an arbitrary URL.
      #
      # So the csoh-ci App installation token - which has repo write, and whose
      # App is on the Main ruleset's bypass_actors list - is deliberately NOT
      # minted here at the top. It is minted AFTER the model step, immediately
      # before the create-PR step that is the only thing needing it. Steps run
      # in order, so during the model step that token does not exist yet.
      #
      # Moving the mint back above the model step would silently undo this.
      #
      # The checkout below therefore uses the default GITHUB_TOKEN, which this
      # workflow scopes to `contents: read` (see the permissions block above).
      # Cloning is all it has to do.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Do not leave any credential behind in .git/config. By default
          # checkout persists one as an http.extraheader for the rest of the
          # job, where the Claude Code step below could read it back out with a
          # plain file read. Nothing here needs it: create-pull-request is
          # handed the App token explicitly, further down.
          persist-credentials: false
          # `fetch-depth: 0` clones the FULL git history (not just the latest
          # commit). The create-PR action needs full history to build a clean
          # branch and diff. (0 means "no depth limit / everything".)
          fetch-depth: 0

      # Hand Claude Code a prompt that mirrors the manual workflow we used
      # to seed the catalog. The model researches new resources, checks for
      # duplicates against existing cards, and edits resources.html in place.
      - name: Run Claude Code to add new resources
        # This first-party Anthropic action is pinned to an exact commit SHA
        # (the trailing `# v1.0.165` just notes which release that SHA is),
        # same as the third-party actions above. Bump the SHA deliberately to
        # adopt a newer version - it will not move on its own.
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a  # v1.0.199
        with:
          # The credential the action uses to talk to Claude. It's the OAuth
          # token from `claude setup-token`, stored as an encrypted repo
          # secret, so model usage bills against the subscription quota.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Command-line flags forwarded to the Claude Code CLI. `--model`
          # picks which model to use. `--allowedTools` is an allowlist of the
          # ONLY tools Claude may use this run. Every entry on it is now an
          # in-process tool; there is no `Bash(...)` pattern of any kind, so
          # this step cannot start a shell at all.
          #
          # `Bash(python3:*)` used to be on this list and is deliberately gone.
          # It matched `python3 -c '<anything>'`, i.e. a full interpreter, which
          # made the rest of the allowlist meaningless: this step reads
          # attacker-controllable web pages via WebFetch/WebSearch, and a prompt
          # injection that reached an interpreter could read secrets out of the
          # process environment or trade this job's OIDC token for cloud
          # credentials. If a future prompt genuinely needs Python, add a
          # checked-in script and allowlist that exact path - never the bare
          # interpreter.
          #
          # `Bash(grep:*)` and `Bash(wc:*)` were removed on 2026-07-26. They
          # looked harmless next to the interpreter that was removed before
          # them, but `grep` takes a path like any other, so `Bash(grep:*)`
          # was a read primitive over the whole runner filesystem - including
          # /proc/self/environ, which holds this step's own secrets. The
          # built-in `Grep` tool that remains searches the workspace and is
          # not a shell. The prompt's "grep for the URLs you added" step is
          # served by it just as well.
          #
          # RESIDUAL RISK, stated plainly rather than papered over: `Read`
          # still accepts absolute paths and `WebFetch` is unqualified,
          # because the whole job of this step is to research resources on
          # the open web and a domain allowlist would defeat it. So a prompt
          # injection can still reach CLAUDE_CODE_OAUTH_TOKEN in this step's
          # environment and exfiltrate it. That token is rotatable and buys
          # model usage, nothing in this repo or in any cloud account. The
          # credential that actually matters, the csoh-ci App token, is not
          # minted until after this step for exactly that reason.
          claude_args: '--model claude-opus-4-8 --allowedTools "Read,Edit,Glob,Grep,WebSearch,WebFetch"'
          # `prompt:` is the instructions handed to Claude. The `|` is YAML's
          # "literal block scalar": every indented line below is kept verbatim
          # (newlines preserved) and passed through as one multi-line string.
          # The text below is that prompt's content, not YAML config.
          prompt: |
            You are updating the cloud security resources catalog at
            resources.html. The file is large (~3,800 lines); read it in
            chunks rather than all at once.

            Goal: add 2-3 new resources to EACH of the six category sections.
            Sections (and their HTML ids):
              - CTF Challenges          → id="ctf-challenges"
              - Labs & Training         → id="labs-training"
              - Security Tools          → id="security-tools"
              - Certifications          → id="certifications"
              - AI Security             → id="ai-security"
              - Job Search              → id="job-search"

            Hard requirements:
              1. NO DUPLICATES. Before adding a resource, grep resources.html
                 for its URL and name. If either already appears, pick a
                 different resource.
              2. Use legitimate, well-known, vendor-neutral sources. No
                 affiliate links. No obscure or sketchy sites. Prefer
                 official URLs (vendor sites, GitHub orgs, .gov/.edu).
              3. Match the existing resource-card HTML structure exactly.
                 Look at a recent card in the same section to copy the
                 format - `<a class="card-link">` wrapping a
                 `<div class="resource-card" data-tooltip="...">` with an
                 `<img class="resource-preview">`, an `<h3>`, a `<p>`, and
                 a `<div class="resource-tags">` of `<span class="tag">`.
              4. Insert each new card just before the closing `</div>` of
                 that section's resource-grid (the last `</a>` followed by
                 the grid's `</div>`).
              5. Preview image filenames follow this convention:
                 slashes in the URL path become underscores, dots are
                 preserved. Example:
                   https://github.com/foo/bar →
                     img/previews/github.com_foo_bar.jpg
                 You do NOT need to create the image - CI will generate it
                 from the URL after the PR is opened.
              6. Tooltip text (data-tooltip attribute) should be 2-3
                 sentences explaining what makes the resource useful and
                 distinct. Card description (<p>) is 1-2 short sentences.
              7. After adding all cards, update the resource counter in
                 the filter bar: find the `<span id="visibleCount">N</span>`
                 line and bump N by the exact number of new cards you added.

            Style guidance:
              - Tags: pick 2-4 relevant tags per card. Look at neighbor cards
                in the same section for the tag vocabulary already in use
                (e.g., "AWS", "Azure", "GCP", "Kubernetes", "Free",
                "Open Source", "CNAPP"). Include a category tag with the
                matching class (e.g., `<span class="tag ctf">CTF</span>` in
                CTF section, `<span class="tag tool">Tool</span>` in Tools).
              - Description should focus on what the resource teaches or
                does, not on marketing claims.

            Process:
              1. Skim resources.html to learn the structure and existing
                 entries in each section.
              2. For each category, brainstorm 4-6 candidate resources,
                 verify they're not already present, then pick the best
                 2-3 to add.
              3. Make all edits to resources.html.
              4. Update the visibleCount span.
              5. Do a final pass: grep for the URLs you added to confirm
                 they appear exactly once each.

            Do not modify any file other than resources.html. Do not
            commit or push - the workflow handles that.

      # Mint a short-lived installation token from the csoh-ci GitHub App so
      # the create-PR step has push access AND the PR can trigger downstream
      # CI (the default GITHUB_TOKEN cannot trigger workflows on PRs it opens).
      #
      # DELIBERATELY PLACED HERE, after the Claude Code step above rather than
      # at the top of the job. See the long note beside the checkout step: this
      # token has repo write and the csoh-ci App is on the Main ruleset's
      # bypass_actors list, so it must not exist in the environment while a
      # model is reading pages it does not control. Everything from this point
      # on is deterministic shell and prebuilt actions.
      - name: Mint installation token
        # `id:` gives this step a handle so later steps can read its results
        # via `steps.app-token.outputs.<name>` (used below as the push token).
        id: app-token
        # `uses:` runs a prebuilt action from another GitHub repo. The part
        # after `@` pins the EXACT version. Here it's a full 40-char commit
        # SHA (not a tag like `v3`) because tags can be silently moved to new
        # code; a SHA is immutable, so we always run the exact reviewed code.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # `secrets.NAME` reads an encrypted value stored in repo settings;
          # it is never printed in logs. These two identify and authenticate
          # the csoh-ci GitHub App so it can mint an installation token.
          client-id: ${{ secrets.CSOH_CI_CLIENT_ID }}
          private-key: ${{ secrets.CSOH_CI_PRIVATE_KEY }}

      # Bail out cleanly if Claude didn't change anything (e.g., it concluded
      # there was nothing high-quality to add this week, or hit an error).
      #
      # The file list below counts untracked files as well as modified ones,
      # deliberately: peter-evans/create-pull-request commits EVERYTHING in
      # the working tree, including brand-new files a plain `git diff` never
      # lists - so a scope check reading only the diff could clear a PR that
      # carries files it never saw. That matters more here than anywhere
      # else in this repo: Claude's Edit tool can create a file, not just
      # modify one, and this workflow's steer is "only touch resources.html".
      # A new file is exactly the kind of surprise the check exists to catch,
      # and it was the one shape the check could not see.
      # (check-pagespeed.yml and run-seo-audit.yml use the identical pair of
      # commands for the same reason.)
      - name: Detect changed files
        # This step is named via `id:` so later steps can branch on its
        # results, e.g. `steps.changes.outputs.has_changes`.
        id: changes
        # `run:` executes shell commands directly on the VM (no prebuilt
        # action). The `|` again means "treat the indented block below as one
        # multi-line script." Lines starting with `#` are shell comments.
        run: |
          # Bash "strict mode": -e exit on any error, -u error on undefined
          # variables, -o pipefail fail if any command in a pipe fails. This
          # makes the script stop loudly instead of silently misbehaving.
          set -euo pipefail
          # `git diff --name-only` lists tracked paths Claude modified vs the
          # last commit; `git ls-files --others --exclude-standard` lists new
          # untracked ones (--exclude-standard honors .gitignore, so ignored
          # junk isn't counted). Run back to back inside one `$( )`, they are
          # exactly the set the create-PR action would commit. We capture that
          # combined list into the `files` shell variable.
          files="$(git diff --name-only; git ls-files --others --exclude-standard)"
          # `[ -z "$files" ]` is true when the list is empty (no edits).
          if [ -z "$files" ]; then
            # `$GITHUB_OUTPUT` is a file GitHub gives each step; appending
            # `key=value` to it publishes a step "output" that later steps
            # read via `steps.<id>.outputs.key`. Here we record that there
            # were no changes, so the PR steps below get skipped.
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes - Claude added nothing this run."
            # `exit 0` ends this step successfully (0 = success); no PR needed.
            exit 0
          fi
          # There were changes - flag it and print them into the run log.
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$files"

          # Safety check: Claude was told to only edit resources.html. If it
          # touched anything else, surface that in the PR so a human catches
          # it. We don't fail the run - the PR review is the gate.
          # `grep -v` keeps lines that do NOT match; the regex `^resources\.html$`
          # matches that exact filename. So this `if` is true when at least one
          # changed file is something OTHER than resources.html.
          if echo "$files" | grep -v '^resources\.html$' >/dev/null; then
            # Something unexpected changed - record it so the PR body warns a
            # human and auto-merge stays off.
            echo "unexpected_files=true" >> "$GITHUB_OUTPUT"
          else
            # Clean: only resources.html changed - safe to auto-merge later.
            echo "unexpected_files=false" >> "$GITHUB_OUTPUT"
          fi

      # Open a PR. If Claude only touched resources.html, the steps below
      # auto-approve and enable auto-merge. If anything else changed, the
      # PR stays open for human review - important safety valve.
      - name: Create Pull Request
        id: cpr
        # `if:` is a guard: the step runs only when this expression is true.
        # `'true'` is in quotes because step outputs are always strings.
        # Skip opening a PR unless the previous step found real changes.
        if: steps.changes.outputs.has_changes == 'true'
        # This third-party action bundles several git operations into one:
        # it creates a branch, commits the working-tree changes, pushes, and
        # opens (or updates) the pull request.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # Push/PR with the App token (not the default one) so opening this
          # PR is allowed to trigger the downstream deploy CI.
          token: ${{ steps.app-token.outputs.token }}
          # The commit message used for the single commit on the PR branch.
          commit-message: 'chore: weekly resources catalog refresh'
          # The PR's title, shown in the pull-request list.
          title: 'chore: Weekly resources update'
          # The PR description. `|` keeps the multi-line text below literal,
          # so it's body content, not YAML config. The one `${{ A && B || C }}`
          # inside it is GitHub's stand-in for "if A then B else C": when
          # unexpected files changed it inserts a warning, otherwise an
          # "auto-merge enabled" note.
          body: |
            Automated weekly refresh of `resources.html`.

            Claude researched and proposed new entries for each of the six
            category sections (CTF, Labs & Training, Security Tools,
            Certifications, AI Security, Job Search).

            Preview images will be auto-generated by `site-update-deploy`
            after merge.

            ${{ steps.changes.outputs.unexpected_files == 'true' && '⚠️  **Heads up:** Claude touched files other than `resources.html`. Auto-merge is disabled on this PR - please review the diff carefully before merging.' || 'Auto-merge enabled - only `resources.html` was changed.' }}
          # Always reuse this fixed branch name for the PR. Reusing one branch
          # means a new run updates the existing PR instead of piling up new
          # ones week after week.
          branch: update-resources-content
          # Delete that branch automatically once the PR is merged or closed,
          # to keep the branch list tidy.
          delete-branch: true
          # Attach these labels to the PR for easy filtering in the PR list.
          labels: automated, content

      # Approve the PR using a separate identity (CSOH_PAT). GitHub blocks
      # an actor from approving its own PR, AND auto-merge does not honor
      # the App's ruleset bypass list for the approval requirement - so a
      # second identity approving is the only way to drive auto-merge to
      # completion. Same rationale as update-news.yml.
      - name: Auto approve
        # Run only if BOTH conditions hold (`&&` = and): a PR was actually
        # created (its number is not empty, `!=` = not equal), AND only the
        # expected file changed. Otherwise we don't rubber-stamp it.
        if: steps.cpr.outputs.pull-request-number != '' && steps.changes.outputs.unexpected_files == 'false'
        # `gh` is GitHub's official command-line tool, preinstalled on the VM.
        # `gh pr review --approve <number>` posts an approving review on the
        # PR that the create-PR step opened.
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        # `env:` sets environment variables just for this step. `gh` reads its
        # credentials from GH_TOKEN; pointing it at CSOH_PAT makes the approval
        # come from that separate identity, satisfying GitHub's "can't approve
        # your own PR" rule.
        env:
          GH_TOKEN: ${{ secrets.CSOH_PAT }}

      # Only enable auto-merge when the diff is purely resources.html. If
      # Claude wandered off and touched something else, the PR stays open
      # until a human reviews.
      - name: Enable PR auto-merge when only resources.html changed
        # Same dual guard as the approve step: clean diff AND a PR exists.
        # Auto-merge means "merge automatically once required checks pass and
        # the approval is in" - it does not merge immediately.
        if: steps.changes.outputs.unexpected_files == 'false' && steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d  # v3.0.0
        with:
          # App token again, so the action is allowed to act on the PR.
          token: ${{ steps.app-token.outputs.token }}
          # Which PR to enable auto-merge on - the one we just opened.
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          # `squash` collapses the PR's commits into a single commit on main,
          # keeping the main-branch history clean (one commit per merge).
          merge-method: squash
