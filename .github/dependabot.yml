# Dependabot configuration - keeps our pinned dependencies current.
#
# The site itself is static (no application dependencies to track), so the only
# thing worth watching is the GitHub Actions we pin by full commit SHA in
# .github/workflows/*.yml. When a newer release of an action exists, Dependabot
# opens a pull request that updates BOTH the SHA and the trailing "# vX.Y.Z"
# comment - exactly the bumps the GitHub Actions page says it does for us.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"   # scans .github/workflows/*.yml
    directory: "/"                         # "/" = repo root for this ecosystem
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    commit-message:
      # Match the repo's conventional-commit style (feat:/fix:/chore:).
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # Bundle all action bumps into ONE pull request per week instead of one
      # PR per action - far less review noise for a repo with a dozen workflows.
      github-actions:
        patterns:
          - "*"
