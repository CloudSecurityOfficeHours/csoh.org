  "leetcode\\.com",                    # Blocks bots (403)
  "securityboulevard\\.com",           # Blocks bots (403)
  "stackoverflow\\.com",               # Cloudflare challenge (403)
  "tryhackme\\.com",                   # Rate-limits bots (429)
  "www\\.adp\\.com",                   # Blocks bots (403)
  "www\\.appgate\\.com",               # 405 to bots
  "www\\.comparably\\.com",            # Blocks bots (403)
  "www\\.deeplearning\\.ai",           # Blocks bots (403)
  "www\\.fishbowlapp\\.com",           # Blocks bots (403)
  "www\\.flexjobs\\.com",              # Akamai resets bots' HTTP/2 streams
  "www\\.humansecurity\\.com",         # Bot-protection vendor; blocks bots (403)
  "www\\.iso\\.org",                   # Blocks bots (403)
  "www\\.monster\\.com",               # Blocks bots (403)
  "www\\.newsbytesapp\\.com",          # Blocks bots (403)
  "www\\.simplyhired\\.com",           # Blocks bots (403)
  "www\\.somethingofdoom\\.com",       # Blogger custom domain; Google rate-limits bots (429)
  "www\\.teamblind\\.com",             # Blocks bots (403)
  "www\\.theladders\\.com",            # Blocks bots (403)
  "www\\.usatoday\\.com",              # Paywall answers bots with 402
  "www\\.whizlabs\\.com",              # Blocks bots (403)
  # Short or generic names, anchored to the host so they can't match inside
  # another domain (an unanchored "x\\.com" would skip every *x.com site).
  "^https://(www\\.|consumer\\.)?ftc\\.gov/",  # Akamai serves bots a fake 404, even for the home page
  "^https://(www\\.)?x\\.com/",              # Blocks bots (403)
  "^https://cloud-security\\.slack\\.com/",  # Slack workspace; 403 to bots
  "^https://gemini\\.google\\.com/",         # HTTP/2 errors to bots
  "^https://github\\.com/signup",            # GitHub's signup page; 403 to bots
  "^https://remote\\.co/",                   # Akamai resets bots' HTTP/2 streams (FlexJobs)

  # --- Not links: strings inside the published Terraform (infra/terraform/**.tf) ---
  #
  # The .tf files are crawled too (they are published, and 65% of their lines
  # are teaching prose). But HCL is full of URL-SHAPED STRINGS that are
  # identifiers or examples, not destinations, and a crawler cannot tell the
  # difference. Every pattern below is anchored to the exact string so it
  # suppresses only that, and never weakens checking of a real link elsewhere
  # on the site - note each one ends at the host root (`/?$`), so the same
  # host WITH a path is still checked normally.
  #
  # Adding a new CSP host or federation issuer to a .tf file will surface here
  # as a fresh "404" on its bare root. That is expected; anchor it and add it.
  "^https://token\\.actions\\.githubusercontent\\.com/?$",  # OIDC issuer ID, not a page (root 404s)
  "^https://(i\\.ytimg\\.com|img\\.youtube\\.com)/?$",      # CSP frame/img allowlist hosts, bare roots
  "^https://(www|mta-sts)/?$",                              # Fragments of quoted Cloudflare rule expressions
  "^https://csoh-site-xxxx\\.run\\.app",                    # Placeholder Cloud Run URL in an example
  "^https://d111\\.cloudfront\\.net",                       # AWS's own docs-example distribution hostname
]

# Accept common redirect status codes
accept = [200, 202, 204, 301, 302, 308]

# Resolve root-relative links (e.g. /favicon.png) against the repo root
root_dir = "."

# Reasonable timeouts for external sites
timeout = 30
max_retries = 3
max_concurrency = 10

# Mail addresses are excluded by default in lychee v0.21+.
# To opt in, set include_mail = true.

# --- Per-host pacing (TOML tables: these must stay after every top-level key) ---
#
# Hosts that are live and answer a browser fine, but fail when the crawl sends
# them many requests at once. Slowing down keeps their links CHECKED, which an
# exclude would not. Only a full crawl pays this: PR runs skip links the cache
# already vouches for.
[hosts."github.com"]
# Hundreds of github.com links; at the default pace GitHub answers some of our
# own repo's blob pages with 503.
concurrency = 2
request_interval = "250ms"

[hosts."docs.ansible.com"]
# Rate-limits (429) a burst of collection-doc requests from one page.
concurrency = 1
request_interval = "1s"
