  "www\\.secureworks\\.com",           # Redirect loop to bots
  "www\\.servicenow\\.com",            # Live but blocks bots
  "www\\.sheltered-harbor\\.org",      # Live but blocks bots
  "www\\.shmoocon\\.org",              # 500 to automated clients
