  "www\\.hashicorp\\.com",             # Rate-limits bots (429)
  "www\\.hhs\\.gov",                   # Blocks bots (403)
  "www\\.kroll\\.com",                 # Blocks bots (403)
  "www\\.n-able\\.com",                # Blocks bots (403)
  "www\\.npmjs\\.com",                 # Blocks bots (403)
  "www\\.opentext\\.com",              # No response to bots (444)
  "www\\.pentest-standard\\.org",      # Live PTES wiki, HTTP-only, blocks bots
  "www\\.repvue\\.com",                # Rate-limits bots (429)
  "www\\.robustintelligence\\.com",    # Live (now Cisco) but blocks bots
