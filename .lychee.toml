# .lychee.toml - Configuration for lychee link checker
# Used by both CI and local runs:
#   lychee ./*.html ./breaches/*.html ./meetings/*.html ./portfolio/*.html ./homelab/*.html ./howto/*.html

# Exclude patterns that block automated checks
exclude = [
  "linkedin\\.com",                # LinkedIn blocks bots with 999 status
  "web\\.archive\\.org/web/\\d+",  # Archive.org rate-limits aggressively
  "localhost",
  "127\\.0\\.0\\.1",
  "blog\\.appsecco\\.com",        # Blocks bots (403)
  "bleepingcomputer\\.com",        # Blocks bots (403)
  "community\\.sap\\.com",        # Blocks bots (403)
  "cybersecuritydive\\.com",       # Blocks bots (403); serves 200 to a browser UA
  "darkreading\\.com",             # Blocks bots (403)
  "dl\\.acm\\.org",               # Blocks bots (403)
  "fiverr\\.com",                  # Blocks bots (403)
  "glassdoor\\.com",               # Blocks bots (403)
  "imdb\\.com",                    # Blocks bots (403)
  "indeed\\.com",                  # Blocks bots (403)
  "instagram\\.com",               # Blocks bots (403)
  "mdpi\\.com",                    # Blocks bots (403)
  "meco\\.org",                    # Blocks bots (403)
  "medium\\.com",                  # Blocks bots (403)
  "nexos\\.ai",                    # Blocks bots (403)
  "nytimes\\.com",                 # Blocks bots (403)
  # Only the apex/www host blocks bots. Keep this anchored so cdn.openai.com,
  # alignment.openai.com and platform.openai.com stay CHECKED; an unanchored
  # "openai\\.com" would skip them, and a dead technical-report PDF or docs
  # link could never be caught.
  "^https://(www\\.)?openai\\.com/",  # Apex blocks bots (403); subdomains do not
  "help\\.otter\\.ai",            # Blocks bots (403)
  # Kit, the mailing-list host. The signup link (csoh.kit.com) is in every
  # page's footer and answers 403 to bots. Anchored to the host so a name that
  # only ends in "kit.com" (toolkit.com) is still checked.
  "^https?://([a-z0-9-]+\\.)*kit\\.com(/|$)",
  "reddit\\.com",                  # Blocks bots (403)
  "rsaconference\\.com",           # Blocks bots (403)
  "sec-consult\\.com",             # Aggressive rate limiting
  "securitytrails\\.com",          # Blocks bots (403)
  "shodan\\.io",                   # Blocks bots (403)
  "substack\\.com",                # Blocks bots (403)
  "resilientcyber\\.io",           # Substack custom domain - blocks bots (403)
  "training\\.cloudsecurityalliance\\.org",  # Blocks bots (403)
  "uber\\.com",                    # Blocks bots (406)
  "udemy\\.com",                   # Blocks bots (403)
  "upwork\\.com",                  # Blocks bots (403)
  "washingtontimes\\.com",         # Blocks bots (403)
  "zoomeye\\.org",                 # Blocks bots (521)
  "blackhat\\.com",                # Blocks bots (403)
  "euvd\\.enisa\\.europa\\.eu",   # Unreliable (502)
  "gitconnected\\.com",            # SSL certificate issues
  "jobs\\.sap\\.com",              # Timeout-prone (behind WAF)
  "programs\\.com",                # Timeout-prone
  "trustoncloud\\.com",            # Timeout-prone
  "careersinaudit\\.com",          # Bot-verification redirect (302)
  "blog\\.lastpass\\.com",         # Cloudflare bot-block (403)
  "news\\.sky\\.com",              # Bot-block (403)
  "grep\\.app",                    # Rate-limits bots (429)
  "www\\.sophos\\.com",            # WAF timeouts for automated clients
  "www\\.nsa\\.gov",               # Blocks bots (403)
  "www\\.cyber\\.gov\\.au",        # WAF/geo timeouts for automated clients
  # --- Live hosts that block CI/automated clients ---
  "news\\.ycombinator\\.com",          # Rate-limits bots (429)
  "openlibrary\\.org",                 # Rate-limits bots (429)
  "support\\.lastpass\\.com",          # Cloudflare bot-block / SSL to bots
  "tcm-sec\\.com",                     # Blocks bots (403)
  "www\\.matanosecurity\\.com",        # Rate-limits bots (429)
  "www\\.mend\\.io",                   # Blocks bots (403)
  "www\\.technology\\.org",            # Blocks bots (403)
  "blog\\.phylum\\.io",                # Live (Veracode) but blocks bots
  "cisoseries\\.com",                  # Blocks bots (403)
  "devici\\.com",                      # Blocks bots (403)
  "docs-prv\\.pcisecuritystandards\\.org", # Blocks bots (403)
  "docs\\.openshift\\.com",            # Blocks bots (403)
  "docs\\.redhat\\.com",               # Blocks bots (403)
  "dodcio\\.defense\\.gov",            # Blocks bots (403)
  "drata\\.com",                       # Blocks bots (403)
  "flaws\\.cloud",                     # Live AWS CTF, HTTP-only, blocks bots
  "flaws2\\.cloud",                    # Live AWS CTF, HTTP-only, blocks bots
