server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Security Headers (mirrors .htaccess)
    # -----------------------------------------------------------------------
    # Server-level include for responses NOT served by a location with its
    # own add_header (e.g. error pages). The same snippet is also included
    # in every location below - nginx replaces (not merges) inherited
    # add_header when a location has any of its own.
    include /etc/nginx/conf.d/security-headers.conf;

    # Hide nginx version
    server_tokens off;

    # -----------------------------------------------------------------------
    # Emit RELATIVE redirects, never absolute ones
    # -----------------------------------------------------------------------
    # With nginx's default (absolute_redirect on) every redirect this server
    # issues is rebuilt as a full URL from the Host header it received - and
    # the Host it receives is NOT csoh.org. Cloud Run routes by Host, so the
    # Cloudflare load-balancer pool overrides the header to this service's
    # own *.run.app name. nginx then hands the visitor:
    #
    #   GET /img  ->  301  Location: http://csoh-site-<id>-uc.a.run.app/img/
    #
    # Three problems in one header. It discloses the origin hostname, which
    # fronting with Cloudflare is meant to prevent (the AWS origin carries a
    # response-headers policy for the same reason, see
    # infra/terraform/aws/cloudfront.tf). It downgrades the visitor to
    # plaintext http://, on a domain csoh.org's HSTS does not cover. And it
    # only happens on this origin, so roughly one request in three would
    # behave differently from the other two (see CLAUDE.md: verifying one
    # origin proves nothing).
    #
    # nginx issues these implicitly for ANY directory path (/img, /vendor,
    # /email-screenshots ...), not just ones with an explicit rule, so this
    # has to be a server-level setting rather than a per-location fix.
    # "off" makes the Location header a path (Location: /img/), which the
    # browser resolves against csoh.org over https.
    absolute_redirect off;

    # -----------------------------------------------------------------------
    # Compression (gzip for smaller transfer sizes)
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/xhtml+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/otf
        application/x-font-ttf
        application/x-font-opentype;

    # -----------------------------------------------------------------------
    # Custom error pages
    # -----------------------------------------------------------------------
    error_page 403 /403.html;
    error_page 404 /404.html;

    # -----------------------------------------------------------------------
    # Block sensitive files & directories
    # -----------------------------------------------------------------------

    # EXCEPTION, and it must come first: /.well-known/ is a dotted path, so the
    # `location ~ /\.` deny below would 403 it along with .git and .env,
    # including /.well-known/security.txt: the RFC 9116 canonical location and
    # the URL our own /security.txt names in its `Canonical:` field.
    #
    # The `^~` modifier is doing the real work, not the ordering. nginx picks the
    # longest matching PREFIX location first; if that location has `^~`, it stops
    # there and never evaluates the regex locations at all. So this wins over
    # `~ /\.` regardless of where either sits in the file. (Placed first anyway,
    # so a human reading top-to-bottom sees the carve-out before the deny.)
    #
    # Scoped to /.well-known/ only - every other dotted path still 403s.
    location ^~ /.well-known/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type text/plain;
        charset utf-8;
    }

    # Block hidden files/dirs (.git, .env, .htaccess, etc.)
    location ~ /\. {
        include /etc/nginx/conf.d/security-headers.conf;
        deny all;
        return 403;
    }

    # Block scripts, markdown, config, and backup files
    location ~* \.(py|pyc|md|sh|bak|config|dist|fla|inc|ini|log|psd|sql|swp|swo)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        deny all;
        return 403;
    }

    # Allow specific JSON files needed by site JS / the browser. This
    # allowlist must stay in sync with tools/site-publish.filter, which
    # decides what actually gets uploaded to the object-storage origins:
    #   preview-mapping.json       -> resource preview thumbnails (main.js)
    #   manifest.json              -> PWA "Add to Home Screen" metadata
    #   meetings-search-index.json -> meetings.html full-text search
    #   search-index.json          -> site-wide search (see its own note below)
    #   resources-index.json       -> resources.html hub search + deep-link shim
    location = /preview-mapping.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
    }
    location = /manifest.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
    }
    location = /meetings-search-index.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
    }
    # Site-wide search index. Generated fresh on every deploy by the
    # `python3 tools/build_search_index.py` step in deploy.yml and
    # lazy-loaded by /search.html via /search-init.js on first keystroke.
    # ~3.4MB raw, ~1.0MB gzipped via the gzip directive elsewhere in
    # this config (it carries a doc per resource card, not just per page).
    location = /search-index.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
    }

    # resources.html hub: slug -> category-page lookup for forwarding old
    # /resources.html#card-<slug> deep links, and the row set its search box
    # filters. Fetched lazily by /resources-hub.js, never on page load.
    # ~184KB raw. Adding a JSON file means naming it HERE and in
    # tools/site-publish.filter - miss either and it 403s or 404s depending
    # on which origin the load balancer picked.
    location = /resources-index.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
    }

    # Block all other JSON files
    location ~* \.json$ {
        include /etc/nginx/conf.d/security-headers.conf;
        deny all;
        return 403;
    }

    # Disable directory listing
    autoindex off;

    # -----------------------------------------------------------------------
    # Caching (mirrors .htaccess)
    # -----------------------------------------------------------------------

    # search.html - keep effectively uncached so layout tweaks to the
    # search UI propagate to users within seconds, not the hour-long
    # window of the global HTML rule below. The page is cheap to serve
    # (~15KB), and the MiniSearch bundle under /vendor/ plus the static
    # search-index.json carry the heavy lifting on first keystroke.
    location = /search.html {
        include /etc/nginx/conf.d/security-headers.conf;
        expires -1;
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    # HTML - short cache
    location ~* \.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # CSS & JS - long cache (cache-busted via ?v= param)
    location ~* \.(css|js)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images - long cache
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # XML files (sitemap, feed) - short cache, revalidate often
    location ~* \.xml$ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # No redirects for the legacy /csoh/ prefix
    # -----------------------------------------------------------------------
    # /csoh/... paths 404 on every origin, deliberately. Don't add a rewrite
    # here: only one of the three origins is nginx, so an origin-level
    # redirect would apply on roughly one request in three. If /csoh/... links
    # ever need redirecting, put them in a Cloudflare Bulk Redirect list so all
    # three origins behave identically.

    # -----------------------------------------------------------------------
    # Default location
    # -----------------------------------------------------------------------
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
