# Security headers, factored out so they can be `include`d in every
# location block. nginx's add_header is REPLACED (not inherited) by any
# location block that has its own add_header - without this snippet,
# adding a Cache-Control header in a location wipes out HSTS/CSP/etc.
#
# Sourced into nginx.conf via `include`. This file governs the GCP/Cloud Run
# origin only.
#
# THE SAME HEADER VALUES LIVE IN THREE PLACES AND MUST STAY IN STEP:
#   1. this file                                  - the GCP/nginx origin
#   2. infra/terraform/aws/cloudfront.tf          - the AWS/CloudFront origin
#      (aws_cloudfront_response_headers_policy.security)
#   3. infra/terraform/cloudflare/rules.tf        - the Cloudflare edge, which
#      covers every origin and is the ONLY source for Azure (Azure Blob static
#      websites cannot emit custom response headers at all)
#
# tools/check_edge_headers.py asserts the live edge against (3) on every deploy,
# so drift there fails the build. Nothing automatically compares (1) and (2)
# against (3) - if you change a header, change it in all three by hand.
#
# (.htaccess is a vestige of the retired LiteSpeed host. It is deleted by the
# Dockerfile and excluded from the publish filter, so it governs nothing.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
# script-src is strict 'self' only. The previous /search.html implementation
# (Pagefind) needed 'wasm-unsafe-eval' to stream-compile its WebAssembly
# search runtime; the current MiniSearch-based implementation is pure JS
# (see /vendor/minisearch-7.1.2.min.js + /search-init.js) so the WASM
# exception has been dropped, tightening CSP. No 'unsafe-inline', no
# 'unsafe-eval', no remote script origins anywhere on the site.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://csoh.org https://img.youtube.com https://i.ytimg.com https://csoh.goatcounter.com data:; font-src 'self'; connect-src 'self' https://csoh.goatcounter.com; frame-src https://www.youtube.com https://web.archive.org https://docs.google.com https://drive.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
