# Security headers, factored out so they can be `include`d in every
# location block. nginx's add_header is REPLACED (not inherited) by any
# location block that has its own add_header - without this snippet,
# adding a Cache-Control header in a location wipes out HSTS/CSP/etc.
#
# Sourced into nginx.conf via `include`. Keep this file in sync with the
# corresponding .htaccess rules.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
# script-src is strict 'self' only. The previous /search.html implementation
# (Pagefind) needed 'wasm-unsafe-eval' to stream-compile its WebAssembly
# search runtime; the current MiniSearch-based implementation is pure JS
# (see /vendor/minisearch-7.1.2.min.js + /search-init.js) so the WASM
# exception has been dropped, tightening CSP. No 'unsafe-inline', no
# 'unsafe-eval', no remote script origins anywhere on the site.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://csoh.org https://img.youtube.com https://i.ytimg.com https://csoh.goatcounter.com data:; font-src 'self'; connect-src 'self' https://csoh.goatcounter.com; frame-src https://www.youtube.com https://web.archive.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
